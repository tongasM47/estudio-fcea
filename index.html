<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material de estudio — Gastón | FCEA 2026</title>
<style>
:root{
  --bg:#0f1420; --bg2:#161d2e; --card:#1c2435; --card2:#232c41;
  --ink:#e8ecf5; --ink2:#aab4c8; --muted:#7a8499;
  --brand:#6c8cff; --brand2:#8a6cff; --accent:#ffc24b; --good:#36d399; --bad:#ff6b6b;
  --line:#2a3450; --eli:#1a2a3f; --eli-b:#2f6fb8;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 800px at 80% -10%,#1d2740 0%,var(--bg) 55%);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
h1,h2,h3,h4{line-height:1.25;margin:.2em 0 .5em}
h2{font-size:1.7rem}
h3{font-size:1.25rem;color:#fff}
h4{font-size:1.05rem;color:var(--accent);margin-top:1.4em}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* Top bar */
header.top{position:sticky;top:0;z-index:50;background:rgba(15,20,32,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:62px}
.logo{font-weight:800;letter-spacing:.3px;font-size:1.05rem;cursor:pointer;white-space:nowrap}
.logo span{color:var(--accent)}
nav.materias{display:flex;gap:6px;overflow-x:auto;margin-left:auto}
nav.materias button{background:transparent;border:1px solid transparent;color:var(--ink2);padding:7px 13px;border-radius:999px;cursor:pointer;font-size:.86rem;font-weight:600;white-space:nowrap;transition:.15s}
nav.materias button:hover{color:#fff;background:var(--card)}
nav.materias button.active{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff}

/* Views */
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Landing */
.hero{padding:54px 0 30px}
.hero h1{font-size:2.5rem;margin-bottom:.1em;background:linear-gradient(120deg,#fff,#b9c6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p.lead{font-size:1.12rem;color:var(--ink2);max-width:680px}
.note-self{background:linear-gradient(120deg,#1a2236,#1e2740);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 18px;margin:22px 0;color:var(--ink2);font-size:.96rem}
.note-self b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:26px 0}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.mcard:hover{transform:translateY(-4px);border-color:var(--brand);box-shadow:var(--shadow)}
.mcard .code{font-size:.72rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.mcard h3{margin:.3em 0 .5em}
.mcard .date{font-size:.9rem;color:var(--ink2)}
.mcard .cd{margin-top:12px;font-size:.82rem;font-weight:700}
.mcard .bar{height:6px;border-radius:6px;background:var(--card2);margin-top:14px;overflow:hidden}
.mcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent))}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.pill.ready{background:rgba(54,211,153,.13);color:var(--good);border-color:rgba(54,211,153,.3)}
.pill.soon{background:rgba(255,194,75,.12);color:var(--accent);border-color:rgba(255,194,75,.3)}

/* Materia layout */
.mhead{padding:34px 0 6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.mhead .code{color:var(--muted);font-size:.78rem;letter-spacing:1px;text-transform:uppercase}
.mhead h2{margin:.1em 0}
.mhead .meta{color:var(--ink2);font-size:.92rem}
.subnav{position:sticky;top:62px;z-index:30;background:rgba(15,20,32,.9);backdrop-filter:blur(8px);display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line)}
.subnav button{background:var(--card);border:1px solid var(--line);color:var(--ink2);padding:7px 13px;border-radius:10px;cursor:pointer;font-size:.84rem;font-weight:600;white-space:nowrap}
.subnav button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.sec{display:none;padding:22px 0 60px}
.sec.active{display:block}

/* Content blocks */
.idea{background:linear-gradient(120deg,#16233a,#1a2742);border:1px solid #2a3a5c;border-radius:12px;padding:14px 18px;margin:16px 0}
.idea b{color:var(--brand)}
.eli{background:var(--eli);border:1px solid #234b73;border-left:4px solid var(--eli-b);border-radius:10px;padding:12px 16px;margin:14px 0}
.eli .tag{font-size:.72rem;font-weight:800;letter-spacing:.5px;color:#7cc0ff;text-transform:uppercase}
.trap{background:#2a1c22;border:1px solid #6b3140;border-left:4px solid var(--bad);border-radius:10px;padding:12px 16px;margin:14px 0}
.trap .tag{font-size:.72rem;font-weight:800;letter-spacing:.5px;color:#ff9aa6;text-transform:uppercase}
.key{background:rgba(255,194,75,.13);border:1px solid rgba(255,194,75,.32);border-radius:10px;padding:12px 16px;margin:14px 0}
.key .tag{font-size:.72rem;font-weight:800;letter-spacing:.5px;color:var(--accent);text-transform:uppercase}
mark{background:rgba(255,194,75,.28);color:#fff;border-radius:4px;padding:0 4px}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.92rem;background:var(--card);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);color:#fff;font-size:.82rem;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:none}
.fml{font-family:"SF Mono",Consolas,monospace;background:#0e1626;border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:#9fd0ff;display:inline-block}
.formula-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.fbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.fbox .big{font-family:"SF Mono",Consolas,monospace;font-size:1.05rem;color:#9fd0ff;font-weight:700}
.fbox small{color:var(--ink2);display:block;margin-top:6px}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{position:relative;padding:10px 12px 10px 46px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0;margin:18px 0;overflow:hidden}
.ex summary{cursor:pointer;padding:14px 18px;font-weight:700;background:var(--card2);list-style:none;display:flex;justify-content:space-between;align-items:center}
.ex summary::-webkit-details-marker{display:none}
.ex summary::after{content:"▸ ver resolución";color:var(--brand);font-size:.78rem;font-weight:600}
.ex[open] summary::after{content:"▾ ocultar"}
.ex .body{padding:6px 18px 16px}
.tagline{color:var(--muted);font-size:.85rem;margin:6px 0 0}

/* Flashcards */
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:18px 0}
.fc{perspective:1200px;height:170px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line)}
.fc-f{background:linear-gradient(135deg,var(--card2),var(--card));font-weight:700;font-size:1.02rem}
.fc-b{background:linear-gradient(135deg,#1c2c46,#16233a);transform:rotateY(180deg);font-size:.9rem;color:var(--ink2);overflow:auto}
.fc-f small{position:absolute;bottom:8px;left:0;right:0;color:var(--muted);font-weight:600;font-size:.68rem;text-transform:uppercase;letter-spacing:.5px}

/* Quiz */
.quiz .q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.quiz .q p.qt{font-weight:700;margin:.1em 0 .7em}
.quiz .opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:9px;margin:7px 0;cursor:pointer;font-size:.92rem;transition:.12s}
.quiz .opt:hover{border-color:var(--brand)}
.quiz .opt.correct{background:rgba(54,211,153,.16);border-color:var(--good);color:#bbf3da}
.quiz .opt.wrong{background:rgba(255,107,107,.14);border-color:var(--bad);color:#ffc9c9}
.quiz .fb{margin-top:8px;font-size:.86rem;color:var(--ink2);display:none}
.quiz .fb.show{display:block}
.scorebar{position:sticky;bottom:0;background:rgba(15,20,32,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin-top:18px;display:flex;justify-content:space-between;align-items:center;font-weight:700}

/* Checklist */
.check label{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--good)}
.check label.done span{text-decoration:line-through;color:var(--muted)}

.constr{text-align:center;padding:70px 20px;color:var(--ink2)}
.constr .big{font-size:3rem}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:.85rem;text-align:center}
.backtop{margin:30px 0 0}
.backtop button{background:var(--card);border:1px solid var(--line);color:var(--ink2);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600}
@media print{header.top,.subnav,nav.materias{display:none}.sec{display:block!important}.view{display:block!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo" onclick="go('home')">📚 Material de <span>estudio</span> · Gastón</div>
    <nav class="materias" id="topnav"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer class="wrap">
  Armado por Gastón Maldonado · FCEA–UdelaR · Generación 2026 · Hecho para estudiar (y para compartir 🤝)
</footer>

<script>
/* ============ CONFIG MATERIAS ============ */
const HOY = new Date(2026,5,17); // 17 jun 2026 (mes 0-index)
const MATERIAS = [
  {id:'micro', code:'E10', nom:'Introducción a la Microeconomía', fecha:'2026-07-17', fechaTxt:'17 jul 2026 · 08:00', estado:'ready',
   scope:'Ambos parciales · P1: U1–5 (producción, frontera, juegos, Pareto) · P2: U6–8 (empresa y clientes, oferta y demanda, empresa y personal). Manual CORE-ECON.'},
  {id:'calculo', code:'114A', nom:'Cálculo I/A', fecha:'2026-07-07', fechaTxt:'7 jul 2026 · 18:00', estado:'ready',
   scope:'Ambos parciales · P1: funciones (Cap 1–4) · P2: límites, continuidad, derivadas y optimización (Cap 5–9).'},
  {id:'aygo', code:'A10', nom:'Administración y Gestión de las Organizaciones I', fecha:'2026-07-11', fechaTxt:'11 jul 2026 · 08:00', estado:'ready',
   scope:'Ambos parciales · P1: Módulos I–II (organizaciones, proceso administrativo) · P2: Módulos III–IV (gerencias funcionales, creación y crecimiento).'},
  {id:'conceptos', code:'C10', nom:'Conceptos Contables', fecha:'2026-07-14', fechaTxt:'14 jul 2026 · 08:00', estado:'ready',
   scope:'Ambos parciales · P1: U1–6 (patrimonio, cuentas, asientos, IVA, sueldos) · P2: U7–8 (proceso contable, resultados, ajustes y hoja de trabajo).'},
];

function diasPara(f){const d=new Date(f+'T00:00:00');return Math.round((d-HOY)/86400000);}
function cdTxt(f){const n=diasPara(f);return n>0?('faltan '+n+' días'):(n===0?'¡es hoy!':'ya pasó');}

/* ============ NAV ============ */
function buildTopnav(){
  const nv=document.getElementById('topnav');
  nv.innerHTML='<button data-v="home" onclick="go(\'home\')">Inicio</button>'+
    MATERIAS.map(m=>`<button data-v="${m.id}" onclick="go('${m.id}')">${m.nom.split(' ')[0]==='Introducción'?'Micro':m.nom.split(' ')[0]==='Administración'?'AYGO':m.nom.split(' ')[0]==='Cálculo'?'Cálculo':'Conceptos'}</button>`).join('');
}
function go(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  const el=document.getElementById('view-'+v); if(el)el.classList.add('active');
  document.querySelectorAll('#topnav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  window.scrollTo({top:0,behavior:'instant'});
}
function showSec(mid,sid,btn){
  document.querySelectorAll('#view-'+mid+' .sec').forEach(e=>e.classList.remove('active'));
  document.getElementById(sid).classList.add('active');
  btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  window.scrollTo({top:document.querySelector('#view-'+mid+' .subnav').offsetTop-70,behavior:'smooth'});
}
function flip(el){el.classList.toggle('flip');}

/* ============ LANDING ============ */
function buildHome(){
  const cards=MATERIAS.slice().sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(m=>{
    const dias=diasPara(m.fecha); const tot=40; const prog=Math.max(4,Math.min(100,Math.round((tot-dias)/tot*100)));
    const est=m.estado==='ready'?'<span class="pill ready">listo ✓</span>':'<span class="pill soon">en armado</span>';
    return `<div class="mcard" onclick="go('${m.id}')">
      <div class="code">${m.code}</div>
      <h3>${m.nom}</h3>
      <div class="date">📅 ${m.fechaTxt}</div>
      <div class="cd" style="color:${dias<=7?'#ff6b6b':dias<=14?'#ffc24b':'#36d399'}">${cdTxt(m.fecha)}</div>
      <div class="bar"><i style="width:${prog}%"></i></div>
      <div style="margin-top:12px">${est}</div>
    </div>`;
  }).join('');
  return `<div class="view active" id="view-home">
    <section class="hero">
      <h1>Mi material de estudio — FCEA</h1>
      <p class="lead">Me armé esto para estudiar yo, pero lo dejé prolijo para compartirlo con ustedes. Sirve para <b>estudiar las 4 materias en general</b> —no solo un parcial—, con la división clara entre lo que fue del <b>1er parcial (P1)</b> y lo que va para el <b>2º (P2)</b>. La idea: tener <b>todo lo que entra</b> a mano, bien resaltado, con ELI5, tablas, fórmulas y ejercicios resueltos. Sirve igual para parcial o para examen.</p>
      <div class="note-self">📌 <b>Cómo lo uso:</b> primero leo el <b>resumen teórico</b> de cada unidad, después fijo con las <b>flashcards</b>, practico con los <b>ejercicios resueltos</b> y me autoevalúo con el <b>quiz</b>. Si voy corto de tiempo, miro la sección <b>“Trampas típicas”</b> y la <b>hoja de fórmulas</b>, que es lo que más puntos da.</div>
      <div class="grid">${cards}</div>
      <p class="tagline">Las 4 materias están armadas con <b>ambos parciales completos</b> (1ª y 2ª revisión), pensado también para los que rinden examen. Cada una: teoría por unidad, fórmulas/cuadros, ejercicios resueltos, trampas típicas, flashcards y autoevaluación.</p>
    </section>
  </div>`;
}

/* ============ QUIZ + CHECKLIST HELPERS ============ */
function answer(btn,ok,qid){
  const q=btn.closest('.q'); if(q.dataset.done)return; q.dataset.done='1';
  q.querySelectorAll('.opt').forEach(o=>{o.disabled=true; if(o.dataset.ok==='1')o.classList.add('correct');});
  if(!ok)btn.classList.add('wrong');
  q.querySelector('.fb').classList.add('show');
  const sb=q.closest('.quiz').querySelector('.scorebar b'); const tot=q.closest('.quiz').querySelectorAll('.q').length;
  let done=q.closest('.quiz').querySelectorAll('.q[data-done]').length;
  let good=[...q.closest('.quiz').querySelectorAll('.q[data-done]')].filter(x=>!x.querySelector('.opt.wrong')).length;
  sb.textContent=good+' / '+tot+' correctas  ('+done+' respondidas)';
}
function tick(cb){cb.closest('label').classList.toggle('done',cb.checked);}
</script>

<script>
/* ===================== MÓDULO MICROECONOMÍA ===================== */
function MICRO_VIEW(){ return `
<div class="view" id="view-micro">
  <div class="mhead">
    <div class="code">E10 · Introducción a la Microeconomía</div>
    <h2>Microeconomía</h2>
    <div class="meta">Manual CORE-ECON · <b>P1:</b> U1–5 · <b>P2:</b> U6–8 · Próxima revisión: 17 jul 2026</div>
  </div>
  <div class="subnav">
    <button class="active" onclick="showSec('micro','m-mapa',this)">🗺️ Mapa</button>
    <button onclick="showSec('micro','m-p1a',this)">P1 · Producción y tecnologías</button>
    <button onclick="showSec('micro','m-p1b',this)">P1 · Frontera y consumo-ocio</button>
    <button onclick="showSec('micro','m-p1c',this)">P1 · Juegos y Pareto</button>
    <button onclick="showSec('micro','m-u6',this)">P2 · U6 Empresa y clientes</button>
    <button onclick="showSec('micro','m-u7',this)">P2 · U7 Oferta y demanda</button>
    <button onclick="showSec('micro','m-u8',this)">P2 · U8 Empresa y personal</button>
    <button onclick="showSec('micro','m-fml',this)">🧮 Fórmulas</button>
    <button onclick="showSec('micro','m-ej',this)">✍️ Ejercicios</button>
    <button onclick="showSec('micro','m-rec',this)">🍳 Recetas de examen</button>
    <button onclick="showSec('micro','m-trap',this)">⚠️ Trampas</button>
    <button onclick="showSec('micro','m-fc',this)">🃏 Flashcards</button>
    <button onclick="showSec('micro','m-quiz',this)">🎯 Autoevaluación</button>
    <button onclick="showSec('micro','m-check',this)">✅ Checklist</button>
  </div>

  <!-- ===== MAPA ===== -->
  <section class="sec active" id="m-mapa">
    <h3>Cómo encaro este parcial</h3>
    <p>El primer parcial fue producción, frontera, juegos y Pareto (U1–U5). Este segundo se va a lo concreto del mercado: <b>cómo una empresa pone precios</b>, <b>cómo se forma el precio cuando hay muchos</b> y <b>cómo la empresa maneja a su gente</b>. Igual que antes, lo mío es reconocer el tipo de ejercicio antes de calcular.</p>
    <table>
      <tr><th>Unidad</th><th>De qué va</th><th>La pregunta clave</th><th>Herramienta</th></tr>
      <tr><td><b>U6</b> La empresa y sus clientes</td><td>Empresa que <b>fija precios</b> (tiene poder de mercado)</td><td>¿Qué precio y cantidad me dejan más beneficio?</td><td><span class="fml">IMg = CMg</span> + margen</td></tr>
      <tr><td><b>U7</b> Oferta y demanda</td><td>Muchos compradores y vendedores, <b>precio-aceptantes</b></td><td>¿Dónde se cruzan oferta y demanda?</td><td><span class="fml">Qd = Qs</span> + excedentes</td></tr>
      <tr><td><b>U8</b> La empresa y su personal</td><td>Contratos incompletos: comprar <b>esfuerzo</b></td><td>¿Qué salario hace que el trabajador rinda?</td><td>Renta del empleo + salario de eficiencia</td></tr>
    </table>
    <div class="key"><span class="tag">★ Regla de oro</span> En U6 la empresa <b>elige</b> el precio; en U7 el precio <b>se lo imponen</b> (lo toma del mercado). Esa diferencia decide casi todo el ejercicio.</div>
    <div class="idea">🔗 <b>Hilo conductor del curso:</b> en U6 hay poder de mercado y <mark>P &gt; CMg</mark> (hay pérdida de eficiencia). En U7, con competencia, <mark>P = CMg</mark> y el resultado es eficiente. En U8 vemos que el mercado de trabajo NO se vacía: queda desempleo y eso es parte del equilibrio.</div>
  </section>

  <!-- ===== U6 ===== -->
  <section class="sec" id="m-u6">
    <h3>Unidad 6 — La empresa y sus clientes</h3>
    <div class="idea">✓ <b>Idea madre:</b> una empresa con producto diferenciado <b>fija el precio</b>. Enfrenta una curva de demanda con pendiente negativa: si quiere vender más, tiene que bajar el precio. Elige el punto (precio, cantidad) que le deja el <b>mayor beneficio posible</b>.</div>
    <div class="eli"><span class="tag">ELI5</span> Es como tener el único puesto que vende ese pancho especial: si cobrás caro, vendés pocos; si cobrás barato, vendés muchos pero ganás poco por cada uno. Buscás el precio del medio que te deja la torta más grande.</div>

    <p>La clave de toda la unidad es entender por qué la empresa <b>no</b> pone el precio más alto posible. Como su producto está <b>diferenciado</b> (nadie vende exactamente lo mismo), tiene <b>poder de mercado</b>: puede elegir el precio. Pero enfrenta una <b>curva de demanda con pendiente negativa</b>, que no es otra cosa que <b>todos los clientes ordenados de mayor a menor disposición a pagar</b>. Si quiere venderle a uno más, tiene que <b>bajarle el precio a todos</b>, no solo al cliente nuevo. Por eso lo que gana por vender una unidad extra (el <b>ingreso marginal</b>) es <b>menor</b> que el precio de esa unidad: gano el precio del cliente nuevo, pero pierdo un poquito en cada cliente que antes pagaba más. La empresa sigue agregando ventas mientras lo que entra por la última unidad (IMg) supere lo que cuesta producirla (CMg), y se planta justo cuando <b>IMg = CMg</b>. Ese es el óptimo.</p>
    <h4>Conceptos que tengo que dominar</h4>
    <table>
      <tr><th>Concepto</th><th>Qué es</th><th>ELI5 / clave</th></tr>
      <tr><td>Disposición a pagar (DAP)</td><td>Lo máximo que un cliente paga por una unidad</td><td>La <b>curva de demanda</b> ordena a los clientes de mayor a menor DAP</td></tr>
      <tr><td>Empresa que fija precios</td><td>Tiene poder de mercado (producto diferenciado); enfrenta demanda con pendiente negativa</td><td>Lo opuesto al precio-aceptante de U7</td></tr>
      <tr><td>Ingreso total (IT)</td><td><span class="fml">IT = P × Q</span></td><td>La plata que entra</td></tr>
      <tr><td>Ingreso marginal (IMg)</td><td>Lo extra que entra por vender 1 unidad más</td><td><b>IMg &lt; P</b>: para vender una más, bajo el precio a TODAS</td></tr>
      <tr><td>Costo marginal (CMg)</td><td>Lo que cuesta producir 1 unidad más</td><td>Se compara contra el IMg</td></tr>
      <tr><td>Curvas de isobeneficio</td><td>Combinaciones de P y Q con el mismo beneficio</td><td>Como curvas de indiferencia, pero de la empresa</td></tr>
      <tr><td>Margen (markup)</td><td><span class="fml">(P − CMg)/P = 1/|ε|</span></td><td>Cuanto más <b>inelástica</b> la demanda, más margen me banco</td></tr>
      <tr><td>Elasticidad precio (ε)</td><td><span class="fml">ε = %ΔQ / %ΔP</span> (en valor absoluto)</td><td>Elástica (&gt;1): sensible al precio. Inelástica (&lt;1): poco sensible</td></tr>
    </table>

    <h4>El óptimo de la empresa</h4>
    <p>El mejor punto es el de la curva de demanda que toca la <b>isobeneficio más alta</b>: ahí la curva de demanda y la isobeneficio se tocan (tangencia). En ese punto se cumple <span class="fml">IMg = CMg</span> y también <b>RMS = RMT</b> (la pendiente de la demanda iguala la de la isobeneficio).</p>
    <div class="key"><span class="tag">Para el ejercicio</span> Dada una tabla de demanda y costos: 1) calculo IT, 2) calculo IMg, 3) busco la Q donde <b>IMg = CMg</b>, 4) leo el precio en la demanda, 5) saco beneficio y margen.</div>
    <div class="trap"><span class="tag">Ojo con la trampa</span> El óptimo <b>NO</b> es donde el precio es más alto ni donde se vende más. Es donde <b>IMg = CMg</b>. Y el margen usa <b>CMg</b>, no CMe.</div>

    <h4>Eficiencia: por qué el poder de mercado deja plata sobre la mesa</h4>
    <p>Como la empresa cobra <mark>P &gt; CMg</mark>, produce <b>menos</b> de lo eficiente. Hay clientes con DAP por encima del CMg que se quedan sin comprar: esas ventas que no pasan son la <b>pérdida de eficiencia</b> (deadweight loss). Con <b>discriminación de precios</b> (cobrar distinto según la DAP de cada cliente) la empresa captura más excedente.</p>
  </section>

  <!-- ===== U7 ===== -->
  <section class="sec" id="m-u7">
    <h3>Unidad 7 — Oferta y demanda: mercados con muchos compradores y vendedores</h3>
    <div class="idea">✓ <b>Idea madre:</b> cuando hay <b>muchos</b> compradores y vendedores chicos, nadie fija el precio. Todos son <b>precio-aceptantes</b>: toman el precio del mercado como dado. El precio sale solo del cruce de la oferta con la demanda.</div>
    <div class="eli"><span class="tag">ELI5</span> Es una feria gigante con mil puestos que venden lo mismo. Si uno cobra de más, te cruzás de vereda. Entonces el precio se acomoda solito hasta que lo que se ofrece es igual a lo que se quiere comprar.</div>

    <p>Esta unidad es el <b>contraste</b> con la anterior. Acá hay <b>tantos</b> compradores y vendedores, y todos venden algo tan parecido, que <b>nadie</b> tiene poder para mover el precio: todos son <b>precio-aceptantes</b>, lo toman como un dato del mercado. ¿Y de dónde sale ese precio? Del cruce de dos fuerzas. La <b>demanda</b> (los compradores ordenados por disposición a pagar, de mayor a menor) y la <b>oferta</b> (los vendedores ordenados por costo, de menor a mayor, porque cada empresa produce mientras P ≥ CMg). Donde se cruzan queda el <b>equilibrio</b> (P*, Q*), el único precio donde la cantidad que se quiere comprar iguala a la que se quiere vender: el mercado <b>se vacía</b>, no sobra ni falta nada. Lo potente es que en ese punto se cumple <b>P = CMg</b> y el <b>excedente total</b> (lo que ganan compradores + vendedores) es <b>máximo</b>: es <b>eficiente de Pareto</b>. Justo lo contrario del poder de mercado de U6, donde P &gt; CMg y se perdía eficiencia.</p>
    <table>
      <tr><th>Concepto</th><th>Qué es</th><th>Clave</th></tr>
      <tr><td>Precio-aceptante</td><td>Toma el precio del mercado como dado</td><td>Su demanda individual es <b>horizontal</b> al precio</td></tr>
      <tr><td>Curva de oferta del mercado</td><td>Suma horizontal de los CMg de las empresas</td><td>Cada empresa produce donde <b>P = CMg</b></td></tr>
      <tr><td>Equilibrio competitivo</td><td>P* y Q* donde <span class="fml">Qd = Qs</span></td><td>El mercado se <b>vacía</b>: no sobra ni falta</td></tr>
      <tr><td>Excedente del consumidor</td><td>Σ (DAP − precio pagado)</td><td>Lo que el comprador "se ahorra"</td></tr>
      <tr><td>Excedente del productor</td><td>Σ (precio − CMg)</td><td>Lo que el vendedor gana sobre su costo</td></tr>
      <tr><td>Eficiencia de Pareto</td><td>En el equilibrio competitivo el excedente total es <b>máximo</b></td><td>Acá <b>P = CMg</b> → eficiente (≠ monopolio)</td></tr>
    </table>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="45" y1="12" x2="45" y2="174" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="40" y1="160" x2="345" y2="160" stroke="#7a8499" stroke-width="1.5"/>
      <text x="348" y="164" fill="#aab4c8" font-size="13">Q</text>
      <text x="33" y="14" fill="#aab4c8" font-size="13">P</text>
      <line x1="55" y1="40" x2="300" y2="155" stroke="#6c8cff" stroke-width="2.5"/>
      <text x="250" y="150" fill="#6c8cff" font-size="12">Demanda</text>
      <line x1="55" y1="155" x2="300" y2="40" stroke="#36d399" stroke-width="2.5"/>
      <text x="258" y="44" fill="#36d399" font-size="12">Oferta</text>
      <line x1="177" y1="97" x2="177" y2="160" stroke="#7a8499" stroke-width="1.2" stroke-dasharray="4 3"/>
      <line x1="177" y1="97" x2="45" y2="97" stroke="#7a8499" stroke-width="1.2" stroke-dasharray="4 3"/>
      <circle cx="177" cy="97" r="4.5" fill="#ffc24b"/>
      <text x="170" y="176" fill="#ffc24b" font-size="12">Q*</text>
      <text x="27" y="101" fill="#ffc24b" font-size="12">P*</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">El precio y la cantidad de equilibrio (P*, Q*) salen del <b>cruce de la oferta y la demanda</b>. Ahí el mercado se vacía: no sobra ni falta.</div>
    </div>
    <div class="key"><span class="tag">Las 4 condiciones de la eficiencia (CORE-ECON)</span> El equilibrio competitivo es Pareto eficiente <b>solo si se cumplen 4 condiciones estrictas</b>: (1) <b>muchos</b> compradores y vendedores de bienes <b>idénticos</b>; (2) todos <b>precio-aceptantes</b> en el equilibrio; (3) <b>sin externalidades</b> (nadie le traslada costos o beneficios a terceros que no se tengan en cuenta); (4) <b>contratos completos</b> (cubren todo lo relevante y son exigibles ante la justicia). Si alguna falla, el resultado deja de ser eficiente — y por eso existen el poder de mercado (U6) y los problemas del mercado de trabajo (U8).</div>
    <p>Un detalle fino que la cátedra liga al equilibrio competitivo: es también un <b>equilibrio de Nash</b>. Como todos son precio-aceptantes, ninguno puede mejorar comerciando a otro precio (siempre hay otra contraparte dispuesta al precio de equilibrio). Y la <b>distribución del excedente</b> entre consumidores y productores depende de las <b>elasticidades relativas</b> de la oferta y la demanda: el lado más <b>inelástico</b> se queda con la porción mayor.</p>

    <h4>Intervenciones del Estado</h4>
    <table>
      <tr><th>Medida</th><th>Qué hace</th><th>Efecto</th></tr>
      <tr><td>Impuesto</td><td>Mete una cuña entre lo que paga el comprador y lo que recibe el vendedor</td><td>Baja Q, recauda, genera <b>pérdida de eficiencia</b>. La <b>incidencia</b> recae más en el lado más inelástico</td></tr>
      <tr><td>Precio máximo (techo)</td><td>Tope por <b>debajo</b> del equilibrio (ej. alquileres)</td><td><b>Escasez</b>: la demanda supera a la oferta</td></tr>
      <tr><td>Precio mínimo (piso)</td><td>Piso por <b>encima</b> del equilibrio (ej. salario mínimo)</td><td><b>Excedente</b>: sobra oferta (ej. desempleo)</td></tr>
    </table>
    <div class="trap"><span class="tag">Ojo con la trampa</span> No confundas <b>desplazar la curva</b> (cambia un determinante: ingreso, gustos, costos) con <b>moverse sobre la curva</b> (cambia el precio). Y un techo de precios sólo "muerde" si está por <b>debajo</b> del equilibrio.</div>
  </section>

  <!-- ===== U8 ===== -->
  <section class="sec" id="m-u8">
    <h3>Unidad 8 — La empresa y su personal</h3>
    <div class="idea">✓ <b>Idea madre:</b> la empresa contrata trabajo, pero <b>no puede comprar esfuerzo</b> directamente: el contrato es incompleto. Usa el <b>salario</b> y la <b>amenaza de despido</b> para que el trabajador se esfuerce.</div>
    <div class="eli"><span class="tag">ELI5</span> No podés pagar por "ganas de laburar". Entonces le pagás un poco de más para que tenga algo que perder: si zafa y lo echan, pierde esa diferencia. Ese miedo a perder el buen laburo es lo que lo hace rendir.</div>

    <p>El problema de fondo de esta unidad es que el contrato de trabajo es <b>incompleto</b>: la empresa puede contratar las <b>horas</b> del trabajador, pero no su <b>esfuerzo</b>, porque no se puede escribir en un papel ni verificar del todo "esforzate al 90%". Esto es un caso del <b>problema principal-agente</b>: el <b>principal</b> (la empresa) quiere algo que el <b>agente</b> (el trabajador) elige por su cuenta y que no se observa bien — hay conflicto de intereses e información asimétrica. ¿La solución de la empresa? Crear un incentivo. Le paga un <b>salario por encima</b> de lo que el trabajador conseguiría afuera (su <b>salario de reserva</b>), de modo que tener <b>este</b> empleo le deje una ganancia extra: la <b>renta del empleo</b>. Esa renta es lo que <b>perdería si lo echan por vago</b>, así que funciona como zanahoria y garrote a la vez. Por eso aparece el <b>desempleo involuntario</b> como algo <b>necesario</b>: si todos consiguieran trabajo igual de bueno al instante, la amenaza de despido no asustaría a nadie y el truco no funcionaría.</p>
    <table>
      <tr><th>Concepto</th><th>Qué es</th><th>Clave</th></tr>
      <tr><td>Contrato incompleto</td><td>El esfuerzo no se puede exigir ni verificar en el contrato</td><td>Raíz de todo el problema</td></tr>
      <tr><td>Problema principal-agente</td><td>El principal (empresa) quiere algo que el agente (trabajador) elige y no se observa del todo</td><td>Conflicto de intereses + info asimétrica</td></tr>
      <tr><td>Salario de reserva</td><td>El mejor ingreso del trabajador <b>fuera</b> de este empleo</td><td>Sube si sube el seguro de paro o bajan los despidos</td></tr>
      <tr><td>Renta del empleo</td><td>Lo que gana por tener <b>este</b> empleo por encima de su reserva (neto del esfuerzo)</td><td>Es lo que <b>perdería si lo echan</b> → motiva</td></tr>
      <tr><td>Salario de eficiencia</td><td>La empresa paga <b>por encima</b> del que vaciaría el mercado</td><td>Para crear renta y disciplinar</td></tr>
      <tr><td>Desempleo involuntario</td><td>Queda gente sin trabajo en el equilibrio</td><td>Es <b>necesario</b>: sin paro, la amenaza de despido no asusta</td></tr>
    </table>

    <h4>Cómo elige la empresa el salario</h4>
    <p>La <b>curva de mejor respuesta</b> del trabajador dice cuánto esfuerzo pone según el salario (a más salario, más esfuerzo). La empresa busca el salario que <b>minimiza el costo por unidad de esfuerzo</b>: el punto donde una recta desde el origen es tangente a la curva de mejor respuesta.</p>
    <div class="key"><span class="tag">Cadena de efectos típica</span> Sube el seguro de paro → sube el <b>salario de reserva</b> → baja la <b>renta del empleo</b> → el trabajador se esfuerza menos → la empresa <b>sube el salario</b> para recomponer la renta.</div>
    <h4>El gran resultado: el pleno empleo es imposible</h4>
    <p>El salario que la empresa termina pagando (el <b>salario de no holgazaneo</b>) es <b>salario de reserva + costo del esfuerzo + una renta</b>. Ahora pensá en toda la economía: si hubiera <b>pleno empleo</b>, perder el trabajo no costaría nada (conseguís otro al instante), así que la renta del empleo necesaria para que la gente se esfuerce se dispararía al infinito y <b>ninguna empresa podría pagarla</b>. Conclusión potente de CORE-ECON: <b>tiene que existir desempleo involuntario en el equilibrio</b> — la amenaza del paro es justamente lo que hace que el sistema funcione. No es una falla, es parte del equilibrio.</p>
    <p>Esto también explica el <b>salario mínimo</b>, que tiene dos lecturas según el mercado. En <b>competencia perfecta</b>, un mínimo por encima del equilibrio genera <b>desempleo</b> (sobra oferta de trabajo). Pero si la empresa tiene <b>poder de monopsonio</b> (es la que manda en el mercado laboral), un salario mínimo puede <b>subir a la vez el salario y el empleo</b> — y la evidencia uruguaya (Casacuberta y Gandelman) muestra que acá predominan empresas con poder de mercado, cuyo poder se redujo con el salario mínimo y los Consejos de Salarios.</p>
    <div class="trap"><span class="tag">Ojo con la trampa</span> La renta del empleo <b>no</b> es el salario: es salario − reserva − costo del esfuerzo. El salario de eficiencia no es "generosidad", es estrategia para que rindan. Y el desempleo involuntario <b>no</b> es un accidente: es <b>necesario</b> para que la amenaza de despido discipline (por eso el pleno empleo es imposible).</div>
  </section>

  <!-- ===== EJERCICIOS ===== -->
  <section class="sec" id="m-ej">
    <h3>Ejercicios resueltos tipo revisión</h3>
    <p class="tagline">Los armo como me gusta: leo el tipo, aplico el procedimiento y justifico. Cada uno con los pasos a la vista.</p>

    <details class="ex" open><summary>Ej 1 · U6 — Empresa que fija precios: precio, cantidad y margen óptimos</summary>
      <div class="body">
        <p><b>Letra:</b> La demanda de mi producto es <span class="fml">P = 10 − Q</span> (P en $, Q en miles). El costo marginal es constante <span class="fml">CMg = 2</span> y no hay costos fijos. Hallá la cantidad y el precio que maximizan el beneficio, el beneficio y el margen.</p>
        <ol class="steps">
          <li><b>Ingreso total:</b> IT = P·Q = (10 − Q)·Q = 10Q − Q².</li>
          <li><b>Ingreso marginal:</b> IMg = 10 − 2Q (la pendiente del IT).</li>
          <li><b>Óptimo IMg = CMg:</b> 10 − 2Q = 2 → <b>Q* = 4</b> (mil unidades).</li>
          <li><b>Precio:</b> lo leo en la demanda: P = 10 − 4 = <b>$6</b>.</li>
          <li><b>Beneficio:</b> (P − CMg)·Q = (6 − 2)·4 = <b>$16</b> (miles).</li>
          <li><b>Margen:</b> (6 − 2)/6 = <b>0,67</b> → 67%. Chequeo con elasticidad: ε = −1·(6/4) = −1,5; 1/|ε| = 0,67 ✓.</li>
        </ol>
        <div class="key"><span class="tag">Comparación con lo eficiente</span> Lo eficiente sería P = CMg = 2 → Q = 8. Como yo produzco 4, la <b>pérdida de eficiencia</b> es el triángulo ½·(6−2)·(8−4) = <b>8</b>.</div>
      </div>
    </details>

    <details class="ex"><summary>Ej 2 · U7 — Equilibrio competitivo y excedentes</summary>
      <div class="body">
        <p><b>Letra:</b> En un mercado competitivo, la demanda es <span class="fml">Qd = 12 − P</span> y la oferta <span class="fml">Qs = 2P</span>. Hallá el precio y cantidad de equilibrio y los excedentes.</p>
        <ol class="steps">
          <li><b>Equilibrio:</b> Qd = Qs → 12 − P = 2P → 3P = 12 → <b>P* = 4</b>.</li>
          <li><b>Cantidad:</b> Q* = 2·4 = <b>8</b>.</li>
          <li><b>Excedente del consumidor:</b> precio máximo de la demanda (P cuando Q=0) es 12. EC = ½·(12 − 4)·8 = <b>32</b>.</li>
          <li><b>Excedente del productor:</b> la oferta arranca en P=0. EP = ½·(4 − 0)·8 = <b>16</b>.</li>
          <li><b>Excedente total:</b> 32 + 16 = <b>48</b> (máximo, porque es competitivo y P = CMg).</li>
        </ol>
        <div class="trap"><span class="tag">Ojo</span> Si me ponen un <b>impuesto</b> o un <b>precio máximo</b>, el excedente total baja: la diferencia es la pérdida de eficiencia.</div>
      </div>
    </details>

    <details class="ex"><summary>Ej 3 · U8 — Renta del empleo y salario de reserva</summary>
      <div class="body">
        <p><b>Letra:</b> Un trabajador consigue afuera $100/semana (seguro de paro + changas). La desutilidad de esforzarse en este empleo equivale a $20. La empresa le paga $160. (a) ¿Cuál es su renta del empleo? (b) ¿Qué pasa si el seguro de paro sube y su reserva pasa a $130?</p>
        <ol class="steps">
          <li><b>Renta del empleo (a):</b> w − reserva − costo esfuerzo = 160 − 100 − 20 = <b>$40</b>. Eso es lo que pierde si lo echan → lo motiva a rendir.</li>
          <li><b>Sube la reserva (b):</b> nueva renta = 160 − 130 − 20 = <b>$10</b>. La renta cae, la amenaza de despido pierde fuerza.</li>
          <li><b>Reacción de la empresa:</b> para recomponer la disciplina, <b>sube el salario</b> (salario de eficiencia más alto).</li>
        </ol>
      </div>
    </details>

  <!-- ===== RECETAS ===== -->
  <section class="sec" id="m-rec">
    <h3>Recetas de examen — tipos de ejercicio</h3>
    <p class="tagline">La materia es nueva, así que esto sale de los ejercicios de cada capítulo del libro y de la prueba de práctica. Foco en U6-U8 (tu parcial).</p>
    <div class="key"><span class="tag">★ Formato del examen</span> <b>10 preguntas de múltiple opción</b>, 3 opciones (A/B/C), una correcta. 40 puntos, mínimo 16. <b>Correcta +4, incorrecta −1, en blanco 0</b> → conviene responder solo si podés descartar al menos una opción. Tres modalidades: <b>conceptual</b> ("señalá la verdadera"), <b>lectura de gráfico</b>, y <b>cálculo escondido en la opción</b> (acá ganás puntos seguros si sabés la fórmula).</div>

    <h4>U6 · La empresa y sus clientes</h4>
    <table>
      <tr><th>Tipo · cómo lo reconozco</th><th>Cómo se resuelve</th><th>Trampa</th></tr>
      <tr><td><b>Beneficio en un punto de la demanda</b> — tabla Q–P y costo unitario</td><td><b>Beneficio = (P − costo unitario) × Q</b>. Calculalo para cada Q y compará; el máximo está en el medio de la demanda. (Ej.: costo 60, Q=400, P=180 → (180−60)×400 = 48.000.)</td><td>La opción mete un número redondo casi correcto — calculá, no estimes. "Más Q = más beneficio" es falso.</td></tr>
      <tr><td><b>CMg, CMe y costos fijos</b> — desde C(Q)</td><td><b>CMg = pendiente de C(Q)</b>. Costos fijos = C(0). <b>CMe = C(Q)/Q</b>; si no hay fijos y CMg es constante → CMe = CMg.</td><td>Decir que el CMe "baja al producir más" cuando NO hay costos fijos (ahí es constante).</td></tr>
      <tr><td><b>Óptimo del productor</b> — tangencia / IMg = CMg</td><td>El óptimo (P*, Q*) está donde la <b>demanda es tangente a una isobeneficio</b>, o donde <b>IMg = CMg</b>. Si IMg &gt; CMg conviene producir más; si IMg &lt; CMg, menos.</td><td>Creer que en IMg=CMg "el beneficio es cero". No: ese ES el óptimo; el beneficio total es positivo.</td></tr>
      <tr><td><b>Excedentes vs beneficio · pérdida irrecuperable</b></td><td>Exc. consumidor = DAP − precio. <b>Exc. productor = ingresos − CMg (NO incluye costos fijos)</b>. <b>Beneficio = exc. productor − costos fijos</b>. La empresa con poder restringe Q → deja <b>pérdida irrecuperable</b>.</td><td>Decir "excedente del productor = beneficio" (ignora los costos fijos). Creer que el monopolista logra TODAS las ganancias del comercio.</td></tr>
      <tr><td><b>Qué aumenta el poder de mercado</b></td><td>Menos sustitutos, patentes, fidelidad de marca, producto diferenciado → demanda <b>menos elástica</b> → puede subir el precio.</td><td>Que a los consumidores "les importe más el precio" REDUCE el poder, no lo aumenta.</td></tr>
    </table>

    <h4>U7 · Oferta y demanda</h4>
    <table>
      <tr><th>Tipo · cómo lo reconozco</th><th>Cómo se resuelve</th><th>Trampa</th></tr>
      <tr><td><b>Equilibrio Qd = Qs</b> y sentido del exceso</td><td>Equilibrio = donde Qd = Qs (mercado se vacía). <b>P &gt; P* → exceso de OFERTA</b>; P &lt; P* → exceso de demanda. Se transa la cantidad del equilibrio, no la demanda máxima.</td><td>Invertir el sentido del exceso (P alto = exceso de oferta, no de demanda).</td></tr>
      <tr><td><b>Desplazamientos</b> de oferta/demanda</td><td>Cambia la DAP (gustos, ingreso, sustitutos) → se mueve la <b>demanda</b>. Cambian costos/nº de vendedores → se mueve la <b>oferta</b>. Si lo que cambió fue la otra curva, hay <b>movimiento a lo largo</b>, no desplazamiento.</td><td>Decir que la oferta "se desplaza" cuando lo que cambió fue la demanda.</td></tr>
      <tr><td><b>Elasticidad</b> e ingreso total</td><td><b>ε = −(%ΔQ)/(%ΔP)</b> (con el signo menos para que dé positivo). ε&gt;1 elástica, &lt;1 inelástica. Si elástica, <b>bajar</b> el precio sube el IT; si inelástica, <b>subir</b> el precio sube el IT.</td><td>Olvidar el signo menos. Confundir pendiente con elasticidad (la elasticidad varía a lo largo de la curva).</td></tr>
      <tr><td><b>Incidencia de un impuesto</b> (¡clave!)</td><td>El impuesto desplaza la oferta hacia arriba: consumidores pagan <b>P1</b>, productores reciben <b>P0</b>. <b>Ingreso fiscal = (P1 − P0) × Q1</b>. <b>Pérdida de eficiencia = ½·(P1 − P0)·(Q* − Q1)</b>.</td><td>Decir que los productores reciben P* o que el ingreso fiscal es (P*−P0)·Q1. Reciben <b>P0</b> y se usa la brecha completa P1−P0.</td></tr>
    </table>

    <h4>U8 · La empresa y su personal</h4>
    <table>
      <tr><th>Tipo · cómo lo reconozco</th><th>Cómo se resuelve</th><th>Trampa</th></tr>
      <tr><td><b>Renta del empleo</b> (cálculo, muy frecuente)</td><td><b>Renta/h</b> = (w − c) − (subsidio − costo psico). <b>Renta total</b> = renta/h × horas/sem × semanas de búsqueda. <b>Salario de reserva</b> = valor de la mejor alternativa / horas totales del horizonte. (Ej. María: (12−2)−(4−1)=7 $/h; total 7×35×44=10.780.)</td><td>Dar la renta para todo el horizonte (solo dura las semanas de búsqueda). El salario de reserva NO es solo el subsidio.</td></tr>
      <tr><td><b>Salario de no holgazaneo</b></td><td><b>w = wr + c + (s/(h−s))·c</b> (wr reserva, c esfuerzo, s semanas hasta el despido, h horizonte). Siempre <b>por encima</b> del salario de reserva. Si s sube → w sube; si h sube → la renta baja.</td><td>Olvidar el término de renta y poner w = wr + c.</td></tr>
      <tr><td><b>Óptimo del empleador</b> — no holgazaneo + isobeneficio</td><td>Conjunto factible = por <b>encima</b> de la curva de no holgazaneo. El óptimo es la <b>tangencia</b> con la isobeneficio más alta. Beneficio = y − w·N.</td><td>Confundir misma isobeneficio con mismo beneficio numérico — verificá con y − w·N.</td></tr>
      <tr><td><b>Contrato laboral / salario mínimo</b> — conceptual</td><td>El contrato laboral da <b>autoridad para dirigir</b>, no transfiere la propiedad del empleado; es de larga duración. Salario mínimo (estudio de Dube, experimento natural): <b>redujo la rotación</b> y la desigualdad, efecto en empleo <b>mínimo</b>.</td><td>"El contrato transfiere la propiedad" (falso). "El salario mínimo aumentó la rotación" (fue al revés).</td></tr>
    </table>
  </section>

  <!-- ===== TRAMPAS ===== -->
  <section class="sec" id="m-trap">
    <h3>Trampas típicas (donde se pierden puntos fáciles)</h3>
    <div class="trap"><span class="tag">U6</span> El óptimo es <b>IMg = CMg</b>, no "el precio más alto" ni "vender lo más posible". Y <b>IMg &lt; P</b> siempre cuando fijo precios.</div>
    <div class="trap"><span class="tag">U6</span> El margen usa <b>CMg</b>, no CMe. Y a mayor elasticidad, <b>menor</b> margen.</div>
    <div class="trap"><span class="tag">U7</span> Precio-aceptante produce donde <b>P = CMg</b> (acá IMg = P). No lo mezcles con el monopolio.</div>
    <div class="trap"><span class="tag">U7</span> Desplazar la curva ≠ moverse sobre la curva. Un techo de precios sólo afecta si está <b>debajo</b> del equilibrio.</div>
    <div class="trap"><span class="tag">U8</span> Renta del empleo ≠ salario. El desempleo de equilibrio <b>no es un error</b>: es lo que hace creíble la amenaza.</div>
  </section>

  <!-- ===== P1-A: PRODUCCIÓN Y TECNOLOGÍAS ===== -->
  <section class="sec" id="m-p1a">
    <h3>1er Parcial · Producción, tecnologías y costos (U1–U2)</h3>
    <div class="idea">✓ <b>Idea madre:</b> la micro estudia cómo personas, empresas y Estado deciden con <b>recursos escasos</b>. El curso (CORE-ECON) arranca de problemas reales y construye modelos. La gran imagen del crecimiento es el <b>"palo de hockey"</b>: muchos siglos casi plano y, con la revolución capitalista y la tecnología, una subida fuerte.</div>
    <div class="eli"><span class="tag">ELI5</span> Economía no es solo plata: es decisiones. Como no puedo tener todo, elegir algo significa <b>resignar otra cosa</b> (costo de oportunidad).</div>

    <h4>Conceptos base</h4>
    <p>La economía estudia cómo tomamos decisiones cuando los recursos son <b>escasos</b>. Y "escaso" no quiere decir "poco": un bien es escaso si lo <b>valoramos</b> y conseguir más tiene un <b>costo de oportunidad</b>, es decir, nos obliga a resignar otra cosa. El aire no es escaso (hay de sobra); tu tiempo sí lo es. Como no podemos estudiar la realidad entera, los economistas usan <b>modelos</b>: representaciones simplificadas que se quedan con lo esencial para responder una pregunta, igual que un mapa que no dibuja cada árbol pero te lleva a destino. Para analizarlos con orden se usa el <b>ceteris paribus</b>: cambio <b>una</b> variable y dejo <b>todo lo demás congelado</b>, para ver el efecto de esa sola cosa. El curso CORE-ECON arranca con una foto histórica: durante <b>siglos</b> el ingreso por persona casi no se movió, hasta que con la <b>revolución capitalista</b> (propiedad privada + mercados + empresas) y el cambio tecnológico la curva pegó un salto: es el famoso <b>"palo de hockey"</b>. Y el motor de ese salto es la <b>destrucción creativa</b>: las tecnologías nuevas desplazan a las viejas y liberan recursos para usos mejores.</p>
    <table>
      <tr><th>Concepto</th><th>Definición</th><th>ELI5</th></tr>
      <tr><td>Escasez</td><td>Un bien es escaso si se valora y conseguir más tiene costo de oportunidad</td><td>No puedo tener todo</td></tr>
      <tr><td>Modelo</td><td>Representación simplificada de la realidad para responder una pregunta</td><td>Como un mapa: muestra lo útil</td></tr>
      <tr><td>Ceteris paribus</td><td>Mantener constante todo lo demás para aislar una relación</td><td>Cambio una cosa y congelo el resto</td></tr>
      <tr><td>Capitalismo</td><td>Empresas privadas usan capital y trabajo para producir y vender en mercados buscando beneficios</td><td>Propiedad privada + mercados + empresas</td></tr>
      <tr><td>Destrucción creativa</td><td>Nuevas tecnologías desplazan a las viejas y liberan recursos</td><td>Lo nuevo pisa lo viejo</td></tr>
    </table>

    <h4>Producción: producto medio y marginal</h4>
    <p>Una <b>función de producción</b> es la relación entre lo que <b>pongo</b> (insumos: trabajo, capital, energía) y lo que <b>obtengo</b> (producto). Para entender cuánto rinde un insumo se miran dos cosas distintas que conviene no mezclar. El <b>producto medio</b> es el <b>promedio</b>: divido todo lo producido entre las unidades de insumo (Q/L). El <b>producto marginal</b> es lo <b>extra</b> que aporta la <b>última</b> unidad que sumé (ΔQ/ΔL). La idea central es que el marginal suele ir <b>cayendo</b>: cada hora o trabajador adicional agrega menos que el anterior, porque los recursos fijos se van saturando. Eso son los <b>rendimientos decrecientes</b> (el cuarto cocinero en una cocina chica ya casi no suma).</p>
    <table>
      <tr><th>Medida</th><th>Fórmula</th><th>Qué es</th></tr>
      <tr><td>Producto medio (PM)</td><td><span class="fml">PM = Q / L</span></td><td>Promedio por unidad de insumo</td></tr>
      <tr><td>Producto marginal (PMg)</td><td><span class="fml">PMg = ΔQ / ΔL</span></td><td>El extra de la última unidad</td></tr>
    </table>
    <div class="trap"><span class="tag">Ojo con la trampa</span> PM no es PMg. Si el ejercicio dice "la última hora" o "una hora adicional", es <b>marginal</b>. Y ocio = tiempo total − trabajo.</div>

    <h4>Tecnologías y costo de oportunidad</h4>
    <p>Una <b>tecnología</b> es una receta para producir. Una tecnología <b>domina</b> a otra si usa <b>menos o igual de todos</b> los insumos y menos de al menos uno → la dominada se descarta. Si ninguna domina, recién ahí miro <b>precios relativos</b>.</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">CT = wL + rK</div><small>Costo con dos insumos</small></div>
      <div class="fbox"><div class="big">Renta = BN elegido − BN mejor alternativa</div><small>Renta económica</small></div>
      <div class="fbox"><div class="big">Costo económico = costo directo + costo de oportunidad</div><small>Lo que realmente "cuesta" decidir</small></div>
    </div>
  </section>

  <!-- ===== P1-B: FRONTERA Y CONSUMO-OCIO ===== -->
  <section class="sec" id="m-p1b">
    <h3>1er Parcial · Preferencias, frontera factible y consumo-ocio (U3)</h3>
    <div class="idea">✓ <b>Idea madre:</b> elijo la <b>mejor combinación alcanzable</b>. La <b>frontera factible</b> dice qué puedo lograr; las <b>curvas de indiferencia</b> dicen qué prefiero. El óptimo es donde se tocan.</div>
    <div class="eli"><span class="tag">ELI5</span> La frontera es lo que el bolsillo (o el tiempo) me permite; la indiferencia es lo que me gusta. El punto justo es donde lo que quiero toca lo que puedo.</div>

    <p>Toda elección económica junta <b>dos cosas</b>: lo que <b>quiero</b> y lo que <b>puedo</b>. Lo que quiero se representa con las <b>curvas de indiferencia</b>: cada curva une combinaciones de bienes que me dan <b>la misma satisfacción</b>, y cuanto más arriba y a la derecha esté la curva, mejor estoy. Su pendiente es la <b>TMS</b> (tasa marginal de sustitución): cuánto de un bien estoy dispuesto a <b>resignar</b> para ganar un poco del otro sin cambiar mi satisfacción — es mi valoración <b>subjetiva</b>. Lo que puedo se representa con la <b>frontera factible</b>: el borde de lo alcanzable con mis recursos (adentro es posible, afuera imposible). Su pendiente es la <b>TMT</b> (tasa marginal de transformación): la tasa a la que <b>el mundo</b> me deja cambiar un bien por otro — es el "tipo de cambio" <b>objetivo</b> que me impone la realidad. El óptimo aparece donde mi valoración iguala a la del mundo: <b>TMS = TMT</b>, es decir, donde la curva de indiferencia más alta apenas <b>toca</b> la frontera.</p>
    <table>
      <tr><th>Concepto</th><th>Definición</th><th>Clave</th></tr>
      <tr><td>Curva de indiferencia</td><td>Combinaciones que me dan la misma satisfacción (utilidad)</td><td>Más arriba/derecha = mejor</td></tr>
      <tr><td>TMS</td><td>Tasa marginal de sustitución: cuánto cambio un bien por otro manteniendo utilidad</td><td>Pendiente de la indiferencia</td></tr>
      <tr><td>Frontera factible</td><td>Borde de lo alcanzable con mis recursos</td><td>Adentro = posible; afuera = imposible</td></tr>
      <tr><td>TMT</td><td>Tasa marginal de transformación: a qué tasa el mundo me deja cambiar un bien por otro</td><td>Pendiente de la frontera</td></tr>
    </table>
    <div class="key"><span class="tag">Regla del óptimo interior</span> <span class="fml">TMS = TMT</span>: la curva de indiferencia más alta toca la frontera factible.</div>

    <h4>Consumo, ocio y salario</h4>
    <p>El modelo estrella de esta unidad aplica todo lo anterior a una decisión muy real: <b>cuánto trabajar</b>. Acá los dos "bienes" son el <b>consumo</b> (la plata que gano para gastar) y el <b>ocio</b> (mi tiempo libre). El truco es ver que el ocio <b>no es gratis</b>: cada hora que descanso es una hora que <b>no trabajo</b>, así que su costo de oportunidad es <b>el salario que dejo de ganar</b>. Por eso la frontera factible entre consumo y ocio tiene como pendiente el <b>salario</b>: a mayor salario, más empinada (renunciar a una hora de ocio "rinde" más consumo). Elijo el punto donde mi curva de indiferencia toca esa frontera.</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">y = w × h</div><small>Ingreso por trabajo (w salario/hora, h horas)</small></div>
      <div class="fbox"><div class="big">c = w(24 − t)</div><small>Consumo según tiempo libre t</small></div>
    </div>
    <div class="trap"><span class="tag">Ojo con la trampa</span> Ante un cambio de salario, no asumas que A→B es siempre efecto sustitución: hay efecto ingreso y efecto sustitución.</div>
  </section>

  <!-- ===== P1-C: JUEGOS Y PARETO ===== -->
  <section class="sec" id="m-p1c">
    <h3>1er Parcial · Juegos, dilemas sociales, Pareto e instituciones (U4–U5)</h3>
    <div class="idea">✓ <b>Idea madre:</b> cuando lo que me conviene depende de lo que hace el otro, uso <b>teoría de juegos</b>. Las <b>reglas del juego</b> (instituciones) deciden qué se produce y quién se queda con qué.</div>
    <div class="eli"><span class="tag">ELI5</span> En un juego miro: "si el otro hace X, ¿qué me conviene a mí?". Cuando las mejores respuestas de los dos coinciden, nadie quiere moverse: eso es Nash.</div>

    <p>Hasta acá cada uno decidía solo. Pero muchas veces <b>lo que me conviene depende de lo que haga el otro</b>: ahí entra la <b>teoría de juegos</b>. Dos ideas la ordenan. Una <b>estrategia dominante</b> es la que me conviene <b>pase lo que pase</b> el otro: si la tengo, la juego siempre sin pensar. El <b>equilibrio de Nash</b> es una situación donde <b>cada uno está jugando su mejor respuesta</b> a lo que hace el otro, así que <b>nadie gana cambiando de jugada por su cuenta</b>. Lo interesante (y lo que más cae) es el <b>dilema social</b> o <b>dilema del prisionero</b>: cada uno, haciendo lo individualmente racional, lleva a un resultado <b>peor para todos</b> que si hubieran cooperado. El villano típico es el <b>free-rider</b>, el que se cuelga del esfuerzo ajeno sin aportar.</p>
    <table>
      <tr><th>Concepto</th><th>Definición</th><th>Clave</th></tr>
      <tr><td>Estrategia dominante</td><td>La mejor sin importar lo que haga el otro</td><td>Si existe, la juego siempre</td></tr>
      <tr><td>Equilibrio de Nash</td><td>Cada uno juega su mejor respuesta a la del otro</td><td>Nadie gana desviándose solo</td></tr>
      <tr><td>Dilema social / del prisionero</td><td>Lo racional individual da un resultado peor para todos</td><td>Free-riders: se cuelgan del esfuerzo ajeno</td></tr>
      <tr><td>Pago esperado</td><td><span class="fml">PE = probabilidad × pago si aceptan</span></td><td>Ultimátum: pago del proponente = torta − oferta</td></tr>
    </table>
    <p>El otro gran tema es cómo evaluar si un resultado es "bueno". Acá se usa el criterio de <b>Pareto</b>, que separa <b>dos preguntas que la gente confunde</b>: si algo es <b>eficiente</b> y si es <b>justo</b>. Una <b>mejora paretiana</b> es un cambio donde <b>alguien mejora y nadie empeora</b> (plata gratis: hay que hacerlo). Una situación es <b>eficiente de Pareto</b> cuando ya <b>no quedan</b> mejoras así: no se puede beneficiar a uno sin perjudicar a otro. Cuidado, que <b>eficiente no es lo mismo que justo</b>: un reparto en el que uno se queda con casi todo puede ser perfectamente eficiente de Pareto. Quién se queda con qué lo deciden las <b>instituciones</b>, las "reglas del juego" (quién tiene poder, la propiedad, los contratos). En el modelo <b>Ángela-Bruno</b> del curso se ve justamente eso: cambiando las reglas (de la esclavitud a la propiedad de la tierra al salario), cambia cuánto produce Ángela y cuánto se queda cada uno, aunque la tierra sea la misma.</p>
    <div class="key"><span class="tag">Pareto e instituciones</span> Una <b>mejora paretiana</b>: alguien mejora y <b>nadie empeora</b>. Eficiente de Pareto: no se puede mejorar a uno sin empeorar a otro. En el modelo <b>Ángela-Bruno</b>, las reglas (poder, propiedad, contratos) definen la distribución.</div>
    <div class="trap"><span class="tag">Ojo con la trampa</span> Nash ≠ "lo mejor para todos". Pareto ≠ "justo": un reparto súper desigual puede ser eficiente de Pareto.</div>
  </section>

  <!-- UNIDAD 5: LÍMITES x→a -->
  <section class="sec" id="c-u5">
    <h3>Unidad 5 · Límites para x → a (Cap. 5)</h3>

    <h4>Primero lo macro: ¿para qué sirve un límite?</h4>
    <p>Antes de calcular nada, quiero entender <b>por qué existe esta herramienta</b>. Un límite responde una pregunta muy concreta: <i>"¿hacia qué valor se está acercando una función cuando me acerco a cierto punto?"</i>. Sirve para dos cosas que vienen después: (1) estudiar qué hace una función en puntos donde "se rompe" o ni siquiera existe, y (2) — la más importante— es la <b>base de la derivada</b> (el resto del curso se apoya en esto). Si entiendo bien límites, lo demás se encadena solo.</p>
    <div class="eli"><span class="tag">ELI5</span> Imaginá que caminás hacia una puerta. El límite es <b>a dónde estás llegando</b>, aunque la puerta esté tapiada y no puedas pasar. No importa qué hay exactamente en la puerta: importa hacia dónde venías yendo.</div>

    <h4>¿Qué significa "x → a"? (leo el símbolo)</h4>
    <p>La expresión <span class="fml">x → a</span> se lee "x tiende a a" y significa: <b>x se acerca a a todo lo que quiera, por los dos lados, pero sin llegar nunca a ser exactamente a</b>. Esto último es la clave: <b>el límite NO mira el valor en a, mira los alrededores</b>. Por eso una función puede tener un "agujero" justo en a y aún así tener límite.</p>
    <p>La notación completa es <span class="fml">lím_(x→a) f(x) = L</span>, y se lee: "el límite de f(x), cuando x tiende a a, es L". L es el número al que se está arrimando f(x).</p>

    <h4>Cómo lo calculo (paso 1: probar a sustituir)</h4>
    <p>Lo primero, siempre, es <b>sustituir</b>: meto x = a en la función y veo qué da. Si la función es "tranquila" en ese punto (un polinomio, por ejemplo), el límite es directamente ese valor. ¿Por qué? Porque esas funciones no pegan saltos: a dónde se acercan coincide con lo que valen. (Eso es justo la idea de <b>continuidad</b>, que vemos en la sección siguiente.)</p>
    <p>El problema aparece cuando al sustituir me da una <b>indeterminación</b>.</p>

    <h4>¿Qué es una "indeterminación"? (el caso 0/0)</h4>
    <p>Una indeterminación es un resultado que <b>por sí solo no me dice cuánto vale el límite</b>. El caso típico es <span class="fml">0/0</span>: el numerador tiende a 0 y el denominador también. ¿Por qué no puedo concluir nada? Porque 0/0 <b>podría dar cualquier cosa</b> según cómo se acerquen a cero arriba y abajo (podría dar 4, dar 0, dar ∞…). No es que "no exista": es que <b>todavía no lo sé</b> y tengo que trabajarlo. A eso se le llama "levantar la indeterminación".</p>
    <div class="trap"><span class="tag">Ojo con la trampa</span> 0/0 <b>no</b> es 0 ni 1. Es una señal de "che, hay trabajo para hacer acá".</div>

    <h4>Levantar 0/0 con polinomios (y por qué funciona)</h4>
    <p>Si al sustituir x = a me da 0 arriba y 0 abajo, eso me está diciendo algo útil: <b>a es raíz del numerador y del denominador</b> (una "raíz" es un valor que hace cero al polinomio). Y si a es raíz, entonces <span class="fml">(x − a)</span> es un <b>factor</b> de ese polinomio — es decir, lo puedo escribir como (x − a) por otra cosa.</p>
    <p>La estrategia: <b>factorizo</b> arriba y abajo (con Bhaskara si es de grado 2, o con Ruffini si es de grado mayor), me queda el factor (x − a) repetido, y lo <b>simplifico</b>. ¿Puedo "tacharlo" sin hacer trampa? Sí, porque en el límite x se <b>acerca</b> a a pero <b>nunca es</b> a, así que (x − a) nunca es exactamente cero y dividir por él es legal. Ese (x − a) era justamente el culpable del 0/0; al sacarlo, la indeterminación desaparece y ya puedo sustituir tranquilo.</p>
    <div class="key"><span class="tag">La receta, en una línea</span> 0/0 con polinomios → factorizo arriba y abajo → simplifico el (x − a) que sobra → sustituyo. (Hay un ejemplo completo con Bhaskara y otro con Ruffini en la pestaña <b>Ejercicios</b>.)</div>

    <h4>Límites laterales (acercarme por un lado o por el otro)</h4>
    <p>A veces la función hace cosas distintas según de qué lado me acerco. Por eso miro los <b>límites laterales</b>:</p>
    <table>
      <tr><th>Notación</th><th>Cómo me acerco</th></tr>
      <tr><td><span class="fml">x → a⁻</span></td><td>Por la <b>izquierda</b>: con valores un poquito <b>menores</b> que a</td></tr>
      <tr><td><span class="fml">x → a⁺</span></td><td>Por la <b>derecha</b>: con valores un poquito <b>mayores</b> que a</td></tr>
    </table>
    <p>Regla de oro: <b>el límite existe si y solo si los dos laterales existen y dan lo mismo</b>. Si por izquierda tiende a 3 y por derecha a 5 (un "salto"), el límite <b>no existe</b>. Esto es típico en funciones definidas por tramos.</p>

    <h4>Cuando el límite se va a infinito (asíntota vertical)</h4>
    <p>Si al acercarme a a el <b>denominador tiende a 0 pero el numerador NO</b> (tiende a un número distinto de cero), la fracción se hace gigante: la función se dispara a +∞ o −∞. Gráficamente, eso es una <b>asíntota vertical</b> en x = a (la curva sube o baja pegada a esa recta vertical sin tocarla).</p>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="14" y1="100" x2="346" y2="100" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="185" y1="14" x2="185" y2="188" stroke="#ffc24b" stroke-width="1.8" stroke-dasharray="5 4"/>
      <text x="179" y="186" fill="#ffc24b" font-size="13">a</text>
      <path d="M 55 78 Q 150 80 176 182" fill="none" stroke="#6c8cff" stroke-width="2.5"/>
      <path d="M 194 18 Q 230 120 325 122" fill="none" stroke="#6c8cff" stroke-width="2.5"/>
      <text x="225" y="50" fill="#aab4c8" font-size="11">→ +∞</text>

    </svg>
    <div style="color:#7a8499;font-size:.8rem">Cerca de x = a la función se dispara (por un lado a −∞, por el otro a +∞), <b>pegándose a la recta vertical x = a</b> sin tocarla: esa es la asíntota vertical.</div>
    </div>

    <h4>El límite no mira el punto, mira los alrededores</h4>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">

      <line x1="180" y1="105" x2="180" y2="160" stroke="#7a8499" stroke-width="1.2" stroke-dasharray="4 3"/>
      <line x1="180" y1="105" x2="40" y2="105" stroke="#7a8499" stroke-width="1.2" stroke-dasharray="4 3"/>
      <circle cx="180" cy="105" r="5.5" fill="#161d2e" stroke="#ffc24b" stroke-width="2.5"/>
      <text x="175" y="177" fill="#aab4c8" font-size="13">a</text>
      <text x="22" y="110" fill="#ffc24b" font-size="14">L</text>
      <text x="193" y="99" fill="#ffc24b" font-size="11">hueco en a</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">La función se acerca a <b>L</b> por los dos lados, aunque en x = a tenga un "agujero" (no esté definida). Eso es justo lo que mide el límite.</div>
    </div>

    <h4>📐 Hoja de fórmulas — Unidad 5</h4>
    <div class="formula-grid">
      <div class="fbox"><div class="big">lím_(x→a) f(x) = L</div><small>Hacia qué valor se acerca f(x) cerca de a</small></div>
      <div class="fbox"><div class="big">Existe ⟺ lím_(x→a⁻) = lím_(x→a⁺)</div><small>Los dos laterales deben coincidir</small></div>
      <div class="fbox"><div class="big">0/0 → factorizo y simplifico (x−a)</div><small>Bhaskara (grado 2) o Ruffini (grado &gt;2)</small></div>
      <div class="fbox"><div class="big">denom→0, numer≠0 → ±∞</div><small>Asíntota vertical en x = a</small></div>
    </div>

    <h4>Ejercicios resueltos de esta unidad (de fácil a difícil)</h4>
    <details class="ex" open><summary>① Básico · Límite 0/0 con factorización (Bhaskara)</summary>
      <div class="body">
        <p><b>Letra:</b> Calculá lím_(x→3) (x² − 9)/(x − 3).</p>
        <ol class="steps">
          <li>Sustituyo x=3: (9−9)/(3−3) = 0/0 → indeterminación.</li>
          <li>Factorizo: x² − 9 = (x − 3)(x + 3).</li>
          <li>Simplifico (x − 3): queda (x + 3). Sustituyo: 3 + 3 = <b>6</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>② Medio · Límite 0/0 con Ruffini (grado 3)</summary>
      <div class="body">
        <p><b>Letra:</b> Calculá lím_(x→1) (x³ − 2x² + x)/(x² − 1).</p>
        <ol class="steps">
          <li>Sustituyo x=1: numerador 1−2+1=0, denominador 0 → 0/0.</li>
          <li>Numerador: x³−2x²+x = x(x²−2x+1) = x(x−1)². Denominador: x²−1 = (x−1)(x+1).</li>
          <li>Simplifico un (x−1): queda x(x−1)/(x+1). Sustituyo x=1: 1·0/2 = <b>0</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>③ Medio · Límites laterales (¿existe el límite?)</summary>
      <div class="body">
        <p><b>Letra:</b> Sea f(x) = { x + 1 si x &lt; 2 ; 5 si x ≥ 2 }. ¿Existe lím_(x→2) f(x)?</p>
        <ol class="steps">
          <li>Por izquierda (x→2⁻, uso x+1): lím = 2 + 1 = 3.</li>
          <li>Por derecha (x→2⁺, uso 5): lím = 5.</li>
          <li>Como 3 ≠ 5, los laterales no coinciden → el límite <b>no existe</b> (hay un salto).</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>④ Difícil (tipo revisión) · Hallar un parámetro para que el límite dé un valor</summary>
      <div class="body">
        <p><b>Letra:</b> Hallá a para que lím_(x→2) (x² − a·x + 4)/(x − 2) sea finito, y calculá el límite.</p>
        <ol class="steps">
          <li>El denominador → 0. Para que el límite sea finito (no ±∞), el numerador <b>también</b> debe → 0 en x=2 (así da 0/0, que sí se puede levantar).</li>
          <li>Numerador en x=2: 4 − 2a + 4 = 0 → 8 − 2a = 0 → <b>a = 4</b>.</li>
          <li>Con a=4: (x² − 4x + 4)/(x − 2) = (x − 2)²/(x − 2) = (x − 2). Límite: 2 − 2 = <b>0</b>.</li>
        </ol>
      </div>
    </details>
  </section>

  <!-- UNIDAD 6: LÍMITES AL INFINITO -->
  <section class="sec" id="c-u6">
    <h3>Unidad 6 · Límites para x → ±∞ (Cap. 6)</h3>
    <div class="idea">✓ <b>Idea madre:</b> en la Unidad 5 me acercaba a un punto concreto. Acá pregunto otra cosa: ¿qué hace la función <b>a lo lejos</b>, cuando x se vuelve enorme (o muy negativo)? Sirve para encontrar las <b>asíntotas horizontales</b>.</div>

    <h4>Qué significa x → ±∞</h4>
    <p>Acá la pregunta cambia: ya no me acerco a un punto, sino que me voy <b>cada vez más a la derecha (x→+∞) o a la izquierda (x→−∞)</b> y miro hacia dónde va la función. Si tiende a un número fijo L, hay una <b>asíntota horizontal</b> y = L (una recta horizontal a la que la curva se arrima sin tocar).</p>
    <p>El caso típico es un cociente de polinomios que da <span class="fml">∞/∞</span> (otra indeterminación). ¿Cómo lo resuelvo? <b>Me quedo con el término de mayor grado</b> de arriba y de abajo, porque cuando x es enorme, ese término es tan grande que aplasta a todos los demás (los demás se vuelven despreciables). Ejemplo: (3x² + 2x)/(x² − 5) → para x enorme se comporta como 3x²/x² = 3.</p>

    <h4>Órdenes de infinito (¿quién crece más rápido?)</h4>
    <p>Cuando varias cosas se van a infinito, gana la que crece más rápido. El orden, de más fuerte a más débil, es:</p>
    <div class="key"><span class="tag">Jerarquía (x→+∞)</span> <span class="fml">eˣ</span> ≫ <span class="fml">xⁿ</span> ≫ <span class="fml">ln x</span>. La exponencial le gana a cualquier potencia, y cualquier potencia le gana al logaritmo. El más fuerte manda el resultado.</div>
    <div class="eli"><span class="tag">ELI5</span> Es una carrera hacia el infinito: la exponencial es un cohete, las potencias (x², x³…) son autos, y el logaritmo va caminando. A la larga, gana el cohete por lejos.</div>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="40" y1="12" x2="40" y2="175" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="14" y1="165" x2="346" y2="165" stroke="#7a8499" stroke-width="1.5"/>
      <text x="349" y="170" fill="#aab4c8" font-size="13">x</text>
      <path d="M 45 162 Q 235 162 298 22" fill="none" stroke="#6c8cff" stroke-width="2.5"/>
      <text x="300" y="30" fill="#6c8cff" font-size="12">eˣ</text>
      <path d="M 45 162 Q 205 138 332 58" fill="none" stroke="#ffc24b" stroke-width="2.5"/>
      <text x="335" y="60" fill="#ffc24b" font-size="12">xⁿ</text>
      <path d="M 48 150 Q 180 120 335 108" fill="none" stroke="#36d399" stroke-width="2.5"/>
      <text x="335" y="104" fill="#36d399" font-size="12">L x</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">La carrera al infinito: <b>eˣ</b> (cohete) sube más rápido que cualquier potencia <b>xⁿ</b> (auto), y la potencia más rápido que el logaritmo <b>L x</b> (a pie).</div>
    </div>

    <h4>Asíntota horizontal (la curva se arrima a una recta)</h4>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="40" y1="12" x2="40" y2="180" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="14" y1="170" x2="346" y2="170" stroke="#7a8499" stroke-width="1.5"/>
      <text x="349" y="175" fill="#aab4c8" font-size="13">x</text>
      <line x1="40" y1="70" x2="345" y2="70" stroke="#ffc24b" stroke-width="1.5" stroke-dasharray="5 4"/>
