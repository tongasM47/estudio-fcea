  <!-- P1-A -->
  <section class="sec" id="k-p1a">
    <h3>1er Parcial · Patrimonio, hechos económicos y la ecuación (U1–U3)</h3>
    <div class="eli"><span class="tag">ELI5</span> La contabilidad es el tablero del barco: no maneja la empresa, pero te muestra qué tenés, qué debés y si el rumbo viene bien.</div>
    <p>Todo arranca con el <b>patrimonio</b>: el conjunto de bienes, derechos y obligaciones de la empresa en un momento dado. Para entenderlo se parte en tres piezas. El <b>Activo</b> es <b>todo lo que la empresa tiene y le sirve</b>: plata en caja, mercadería, máquinas, lo que le deben los clientes. Para ser activo, el recurso tiene que estar <b>controlado</b> por la empresa y tener <b>utilidad económica</b> (servir para generar plata). El <b>Pasivo</b> es <b>todo lo que la empresa debe a terceros</b>: a proveedores, al banco, al Estado. Y el <b>Patrimonio Neto</b> es <b>lo que realmente es del dueño</b>: lo que quedaría si vendieras todo el activo y pagaras todas las deudas. Por eso se define como una <b>resta</b>: Patrimonio Neto = Activo − Pasivo.</p>
    <table>
      <tr><th>Concepto</th><th>Definición</th></tr>
      <tr><td>Activo</td><td>Recursos controlados por la empresa con utilidad económica (lo que tiene)</td></tr>
      <tr><td>Pasivo</td><td>Obligaciones con terceros (lo que debe)</td></tr>
      <tr><td>Patrimonio Neto</td><td>Diferencia Activo − Pasivo (lo que queda para el dueño)</td></tr>
    </table>
    <p>La cátedra es exigente con la definición de <b>Activo</b>: para que algo sea activo tiene que cumplir <b>las 4 características a la vez</b>: (1) tener <b>utilidad económica</b> (valor de uso o cambio — una máquina rota no la tiene); (2) que el acceso a sus beneficios esté bajo el <b>control</b> de la empresa; (3) que ese control haya nacido de <b>un hecho ya ocurrido</b>; y (4) que se le pueda <b>asignar un valor en dinero sobre bases objetivas</b>. Por esta última, <b>los recursos humanos NO son activo</b> (no se pueden valuar objetivamente) — trampa clásica.</p>
    <p>La cátedra llega a la ecuación por otro camino que conviene saber: toda empresa tiene <b>recursos</b> (lo que usa) que salieron de <b>fuentes</b> (de dónde se obtuvieron). Las fuentes son <b>propias</b> (aporte del dueño, ganancias reinvertidas) o <b>ajenas</b> (deudas con terceros). Como todo recurso salió de alguna fuente, <b>Recursos = Fuentes</b>, que es exactamente la <b>ecuación contable</b>: <b>Activo = Pasivo + Patrimonio Neto</b>. Leída en criollo: <b>todo lo que la empresa tiene</b> (izquierda) <b>salió de algún lado</b> (derecha): o lo financió un tercero (pasivo) o lo puso el dueño (patrimonio). Por eso los dos lados <b>siempre dan igual</b> y cada registración tiene que <b>balancear</b>.</p>
    <div class="key"><span class="tag">Ecuación contable</span> <span class="fml">Activo = Pasivo + Patrimonio Neto</span></div>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <rect x="68" y="30" width="92" height="140" fill="rgba(108,140,255,.18)" stroke="#6c8cff" stroke-width="2"/>
      <text x="114" y="104" fill="#6c8cff" font-size="14" text-anchor="middle" font-weight="bold">ACTIVO</text>
      <text x="114" y="186" fill="#aab4c8" font-size="10" text-anchor="middle">lo que tiene</text>
      <text x="180" y="108" fill="#e8ecf5" font-size="24" text-anchor="middle">=</text>
      <rect x="200" y="30" width="92" height="58" fill="rgba(255,107,107,.16)" stroke="#ff6b6b" stroke-width="2"/>
      <text x="246" y="64" fill="#ff6b6b" font-size="13" text-anchor="middle" font-weight="bold">PASIVO</text>
      <rect x="200" y="88" width="92" height="82" fill="rgba(54,211,153,.16)" stroke="#36d399" stroke-width="2"/>
      <text x="246" y="124" fill="#36d399" font-size="12" text-anchor="middle" font-weight="bold">PATRIMONIO</text>
      <text x="246" y="139" fill="#36d399" font-size="12" text-anchor="middle" font-weight="bold">NETO</text>
      <text x="246" y="186" fill="#aab4c8" font-size="10" text-anchor="middle">debe + es del dueño</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">El Activo (lo que tiene) siempre iguala al Pasivo (lo que debe) más el Patrimonio Neto (lo del dueño). Por eso los dos lados <b>balancean</b>.</div>
    </div>
    <h4>Actos administrativos vs hechos económicos</h4>
    <p>La contabilidad <b>no registra todo lo que pasa</b> en la empresa, solo lo que toca el patrimonio. Por eso distingue dos cosas. Un <b>acto administrativo</b> es un paso de gestión que <b>todavía no movió plata ni bienes</b>: pedir un presupuesto, firmar un contrato, contratar a alguien que arranca el mes que viene. No se registra porque el patrimonio no cambió. Un <b>hecho económico</b>, en cambio, <b>sí modifica el patrimonio</b>: comprar, vender, pagar, cobrar. Ese es el que entra a los libros. Y los hechos económicos se clasifican según <b>qué le hacen al patrimonio</b>: el <b>permutativo</b> cambia solo la <b>composición</b> sin tocar el monto total (pago una deuda con caja: baja caja, baja la deuda, el neto queda igual); el <b>modificativo</b> cambia el <b>monto</b> generando ganancia o pérdida (pago un gasto de luz: el patrimonio se achica); y el <b>mixto</b> hace las dos cosas a la vez (vendo con ganancia: cambia qué tengo y además crece el patrimonio).</p>
    <table>
      <tr><th>Tipo</th><th>¿Afecta el patrimonio?</th><th>Ejemplo</th></tr>
      <tr><td>Acto administrativo</td><td>No</td><td>Emitir una orden de compra, contratar personal</td></tr>
      <tr><td>Hecho económico</td><td>Sí</td><td>Comprar, vender, pagar, cobrar</td></tr>
    </table>
    <table>
      <tr><th>Hecho económico</th><th>Qué modifica</th><th>Efecto</th></tr>
      <tr><td>Permutativo</td><td>La composición</td><td>No cambia el monto del patrimonio (compra al contado)</td></tr>
      <tr><td>Modificativo</td><td>El monto</td><td>Genera ganancia o pérdida (pagar un gasto)</td></tr>
      <tr><td>Mixto</td><td>Composición y monto</td><td>Venta con utilidad</td></tr>
    </table>
    <div class="key"><span class="tag">Regla del modificativo (clave)</span> Si <b>solo aumenta el Activo</b> o <b>solo disminuye el Pasivo</b> → el PN sube → <b>GANANCIA</b>. Si <b>solo disminuye el Activo</b> o <b>solo aumenta el Pasivo</b> → el PN baja → <b>PÉRDIDA</b>. (El permutativo, en cambio, mueve dos cuentas por igual importe y deja el PN igual.)</div>
    <div class="trap"><span class="tag">Ojo con la trampa</span> El <b>acto administrativo</b> no tiene naturaleza jurídica ni económica (solo prepara/controla); el <b>hecho económico</b> tiene las dos y crea, modifica o extingue un derecho u obligación valuable en dinero. Si solo se "prepara" algo, es acto administrativo.</div>
    <h4>El proceso contable: de los datos a la información</h4>
    <p>La contabilidad es un <b>sistema de información</b> que transforma datos del patrimonio en información para decidir y controlar. Lo hace en <b>3 etapas</b> que conviene tener claras (reaparecen todo el curso): <b>1) captación de datos</b> (se recogen los hechos económicos mediante <b>comprobantes</b>); <b>2) procesamiento</b> (se clasifican y registran — la "teneduría de libros": Diario y Mayor); <b>3) preparación de la información</b> (se arman los <b>informes</b>: internos para la gestión, y externos como los <b>Estados Financieros</b>, según las Normas Contables Adecuadas — en Uruguay, marco del Decreto 291/014 y NIIF para PYMES).</p>
  </section>

  <!-- P1-B -->
  <section class="sec" id="k-p1b">
    <h3>1er Parcial · Cuentas, Debe/Haber y asientos (U4–U6)</h3>
    <div class="idea">✓ <b>Idea madre:</b> cada cuenta tiene dos lados. <b>Debe</b> es la izquierda, <b>Haber</b> la derecha. La <b>regla de registración</b> es el corazón de todo asiento.</div>
    <p>Una <b>cuenta</b> es simplemente el "cajón" donde anoto los movimientos de algo concreto: hay una cuenta Caja, una cuenta Mercaderías, una cuenta Proveedores, etc. Cada cuenta tiene dos columnas: el <b>Debe</b> (la izquierda) y el <b>Haber</b> (la derecha). Ojo, que acá está la trampa más grande de toda la materia: <b>Debe y Haber NO significan "lo que se debe" ni "lo que se tiene"</b>. Son solo nombres para la <b>izquierda</b> y la <b>derecha</b>. Anotar en el Debe se dice <b>debitar</b>; anotar en el Haber, <b>acreditar</b>.</p>
    <p>¿Y cómo sé de qué lado anotar? Con la <b>regla madre</b>, que sale directo de la ecuación contable. Las cuentas que están a la <b>izquierda</b> de la ecuación (Activo, y las Pérdidas que lo consumen) <b>aumentan por el Debe</b>. Las que están a la <b>derecha</b> (Pasivo, Patrimonio y Ganancias) <b>aumentan por el Haber</b>. Para <b>disminuir</b>, va al revés. Memorizá esta sola frase y resolvés casi cualquier asiento.</p>
    <div class="eli"><span class="tag">ELI5</span> Pensalo como una balanza con dos platos: Debe a la izquierda, Haber a la derecha. Cada operación pone peso en los dos platos por el <b>mismo monto</b> (eso es la <b>partida doble</b>), así la balanza nunca se desnivela. Si sumás todos los Debe y todos los Haber, tienen que dar igual.</div>
    <p>El <b>saldo</b> de una cuenta es la diferencia entre sus dos lados: si el Debe es mayor, queda <b>saldo deudor</b> (típico de los activos); si el Haber es mayor, <b>saldo acreedor</b> (típico de pasivos y patrimonio). Y para ordenar todo esto la empresa arma un <b>plan de cuentas</b> (la lista codificada de todas sus cuentas) y un <b>manual de cuentas</b> (que explica cuándo y cómo usar cada una).</p>
    <table>
      <tr><th>Término</th><th>Significado</th></tr>
      <tr><td>Debitar / Acreditar</td><td>Anotar en el Debe / en el Haber</td></tr>
      <tr><td>Saldo deudor</td><td>Debe &gt; Haber</td></tr>
      <tr><td>Saldo acreedor</td><td>Haber &gt; Debe</td></tr>
      <tr><td>Plan de cuentas</td><td>Lista ordenada y codificada de cuentas (organiza)</td></tr>
      <tr><td>Manual de cuentas</td><td>Explica cómo se usa cada cuenta (guía)</td></tr>
    </table>
    <h4>Asientos tipo</h4>
    <p>Un <b>asiento</b> es el registro de un hecho económico en el Diario, siempre con su lado Debe y su lado Haber cuadrando. La lógica para armarlo es: pregunto <b>qué cuentas se mueven</b>, miro si cada una <b>aumenta o disminuye</b>, y aplico la regla madre para ubicarla en el Debe o el Haber. Estos son los cuatro que más caen, y conviene tenerlos automatizados:</p>
    <table>
      <tr><th>Operación</th><th>Debe</th><th>Haber</th></tr>
      <tr><td>Compra de mercadería a crédito</td><td>Mercaderías</td><td>Proveedores</td></tr>
      <tr><td>Venta a crédito (con su costo)</td><td>Deudores / Costo de vtas</td><td>Ventas / Mercaderías</td></tr>
      <tr><td>Cobro de deudor en efectivo</td><td>Caja</td><td>Deudores</td></tr>
      <tr><td>Pago a proveedor con cheque</td><td>Proveedores</td><td>Banco</td></tr>
    </table>
    <div class="trap"><span class="tag">Ojo con la trampa</span> En toda venta con costo van <b>dos</b> efectos: el ingreso (Ventas) y la baja de mercadería (Costo de ventas). No te olvides del costo.</div>
    <h4>Clasificación de cuentas (la que importa: integrales vs diferenciales)</h4>
    <p>La cátedra clasifica las cuentas de varias formas, pero hay <b>una que es la llave del 2º parcial</b>: <b>integrales</b> vs. <b>diferenciales</b>. Las <b>integrales</b> integran el Activo y el Pasivo (bienes, derechos, obligaciones — incluye la patrimonial Capital); las <b>diferenciales</b> representan las variaciones del patrimonio, o sea los <b>Resultados</b> (Pérdidas y Ganancias). Guardá esta distinción: en los <b>ajustes</b> (U8), las integrales se ajustan "por realidad" y las diferenciales "por ejercicio económico". Otras clasificaciones que da el curso: por su <b>extensión</b> (colectivas vs. analíticas — la suma de las analíticas debe igualar a su colectiva), por el <b>objeto</b> (patrimoniales, de resultados, de orden, de movimiento) y por el <b>saldo</b> (acumulativas vs. residuales).</p>
    <div class="key"><span class="tag">De la ecuación a la partida doble</span> La regla de registración sale de despejar la ecuación: <b>Activo + Pérdidas = Pasivo + Capital + Resultados anteriores + Ganancias</b>. Por eso Activo y Pérdidas tienen saldo <b>deudor</b> (aumentan por el Debe) y Pasivo, Patrimonio y Ganancias tienen saldo <b>acreedor</b> (aumentan por el Haber).</div>
    <h4>Los libros (Código de Comercio)</h4>
    <p>Los registros se clasifican por <b>orden de entrada</b> en <b>cronológicos</b> (de 1ª entrada, anotan por fecha → los <b>Diarios</b>) y <b>sistemáticos</b> (de 2ª entrada, por cuenta → los <b>Mayores</b>); y por importancia en <b>principales</b> (Diario y Mayor) y <b>auxiliares</b>. El <b>Código de Comercio</b> (art. 55) obliga a llevar <b>3 libros</b>: <b>Diario</b> (art. 56: día por día, cronológico), <b>Inventarios</b> (arts. 59-61: el balance al inicio y cierre) y <b>Copiador de Cartas</b>. El <b>Libro Mayor NO es obligatorio</b> legalmente, pero es imprescindible en la práctica. Y ojo con las <b>prohibiciones</b> (art. 66): no se puede dejar blancos, raspar ni enmendar — los errores se corrigen con <b>un nuevo asiento</b> (contracara: art. 67, los libros sin las formalidades no valen como prueba en juicio).</p>
  </section>

  <!-- P1-C -->
  <section class="sec" id="k-p1c">
    <h3>1er Parcial · Comprobantes, IVA y sueldos</h3>
    <div class="idea">✓ <b>Idea madre:</b> ningún asiento se registra "de palabra": cada hecho económico necesita un <b>comprobante</b> que lo respalde. Y dos cálculos —<b>IVA</b> y <b>utilidad</b>— aparecen en casi todos los ejercicios.</div>
    <h4>Comprobantes</h4>
    <p>El <b>comprobante</b> es el papel (o documento) que prueba que el hecho económico ocurrió: es el respaldo legal y contable de cada registración. Cada tipo de operación tiene el suyo, y en el parcial te pueden dar el comprobante y pedirte el asiento, así que conviene reconocerlos. La <b>factura</b> documenta una <b>venta</b> (a crédito o contado); el <b>recibo</b> documenta un <b>movimiento de plata</b> (un cobro o un pago); el <b>remito</b> acompaña la <b>entrega de mercadería</b> y por eso va <b>sin precio</b>; y las <b>notas de crédito y débito</b> corrigen una factura ya emitida (la nota de crédito <b>baja</b> la deuda del cliente —típico de una devolución— y la de débito la <b>sube</b>).</p>
    <table>
      <tr><th>Comprobante</th><th>Qué documenta</th></tr>
      <tr><td>Factura / Boleta</td><td>Una venta (a crédito / al contado)</td></tr>
      <tr><td>Recibo</td><td>Un cobro o pago de dinero</td></tr>
      <tr><td>Nota de crédito / débito</td><td>Disminuye / aumenta una deuda ya facturada (devoluciones, ajustes)</td></tr>
      <tr><td>Remito</td><td>Entrega de mercadería (sin precio)</td></tr>
      <tr><td>Cheque / Vale / Conforme</td><td>Medios de pago y documentos a pagar</td></tr>
    </table>
    <p>La cátedra hace dos distinciones que caen en múltiple opción. Por su <b>autonomía</b>: los <b>documentos probatorios</b> son prueba del hecho económico (dependen de la operación que los originó: factura, boleta, recibo, notas), mientras que los <b>títulos de crédito</b> son <b>autónomos</b>, valen por sí mismos sin depender de la operación (el <b>conforme</b> —deuda por compra de mercadería—, el <b>vale</b> —deuda por préstamo de dinero— y el <b>cheque</b>). Y por su <b>forma de emisión</b>: manual, electrónica clásica o <b>comprobantes electrónicos en línea con la DGI (CFE)</b>: e-Factura (a contribuyentes), e-Ticket (a consumidor final), e-Remito, e-Resguardo. El comprobante cumple <b>4 funciones</b>: contable, de control, jurídica e impositiva.</p>
    <div class="trap"><span class="tag">Ojo con la trampa</span> El <b>remito</b> prueba un <b>acto administrativo</b> (movimiento físico de mercadería), no un hecho económico. Y el conforme/vale/cheque son <b>títulos de crédito</b> (autónomos), no documentos probatorios.</div>
    <h4>IVA y utilidad</h4>
    <p>El <b>IVA</b> (Impuesto al Valor Agregado) es un impuesto que la empresa le <b>cobra al cliente</b> por cuenta del Estado: lo suma al precio, lo guarda y después se lo paga a la DGI. No es ni ganancia ni gasto de la empresa, es <b>plata de paso</b> (por eso va a una cuenta de pasivo: "IVA ventas"). Se calcula sobre el precio <b>sin</b> IVA: tasa básica <b>22%</b>, tasa mínima <b>10%</b> para algunos productos. La <b>utilidad</b> (lo que la empresa gana en la operación) se puede medir de dos formas que dan números distintos: <b>sobre el costo</b> (gano respecto de lo que me costó) o <b>sobre la venta</b> (gano respecto del precio final). Tenés que leer bien cuál te pide la letra, porque confundirlas es el error de múltiple opción más frecuente.</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">IVA = Precio sin IVA × tasa</div><small>Tasa básica 22% / mínima 10% (ojo con la del ejercicio)</small></div>
      <div class="fbox"><div class="big">Utilidad sobre costo = U / Costo</div><small>El margen se calcula sobre el costo</small></div>
      <div class="fbox"><div class="big">Utilidad sobre venta = U / Venta</div><small>El margen se calcula sobre el precio de venta</small></div>
    </div>
    <div class="trap"><span class="tag">Ojo con la trampa</span> "Sobre costo" y "sobre venta" dan números distintos: fijate bien cuál pide la letra. Es el error de múltiple opción más común.</div>
    <h4>Sueldos y leyes sociales</h4>
    <p>El sueldo tiene dos números que no hay que confundir. El <b>sueldo nominal</b> es el sueldo "de bruto", el total pactado. De ahí se le <b>descuentan los aportes del trabajador</b> (BPS jubilatorio, FONASA para la salud, etc.), y lo que queda es el <b>líquido</b>, que es la plata que la persona efectivamente cobra. Esos descuentos no se los queda la empresa: los retiene y se los paga al Estado. Pero además la <b>empresa pone de su bolsillo</b> sus propios aportes (las <b>leyes sociales patronales</b>): eso es un <b>costo extra</b> para ella, por encima del nominal. Por eso emplear a alguien le sale a la empresa <b>más</b> que el sueldo nominal, y el trabajador cobra <b>menos</b> que el nominal.</p>
    <div class="eli"><span class="tag">ELI5</span> Nominal es el precio de lista; líquido es lo que te queda en la mano después de los descuentos. Y la empresa, encima del nominal, paga un "recargo" (las cargas patronales) que el trabajador ni ve.</div>
  </section>

  <!-- P2-A -->
  <section class="sec" id="k-p2a">
    <h3>2º Parcial · Proceso contable y estructura de resultados (U7)</h3>
    <div class="idea">✓ <b>Idea madre:</b> el proceso contable transforma los datos en información: <b>Diario → Mayor → Balance</b>. Y el resultado del ejercicio sale de enfrentar las cuentas de <b>ganancia</b> contra las de <b>pérdida</b>.</div>
    <div class="eli"><span class="tag">ELI5</span> Primero anoto todo por fecha (Diario), después agrupo por cuenta (Mayor), y al final ordeno todo para ver cómo terminé (Balance) y cuánto gané o perdí.</div>
    <p>El <b>proceso contable</b> es la cadena de pasos que convierte hechos sueltos en información ordenada, y siempre va en el mismo orden: <b>Diario → Mayor → Balance</b>. En el <b>Libro Diario</b> registro cada operación <b>en orden de fecha</b>, con su asiento (Debe y Haber). El problema es que así no sé cuánto tengo en cada cuenta, porque los movimientos de Caja, por ejemplo, están desparramados por todo el libro. Para eso está el <b>Libro Mayor</b>: <b>agrupa todos los movimientos de cada cuenta</b> en un solo lugar y me da su <b>saldo</b>. Finalmente, el <b>Balance de saldos</b> junta los saldos de <b>todas</b> las cuentas en una lista, y sirve de <b>control</b>: como cada asiento balanceaba, la suma de saldos deudores tiene que ser igual a la de acreedores.</p>
    <table>
      <tr><th>Registro</th><th>Qué hace</th></tr>
      <tr><td>Libro Diario</td><td>Registra las operaciones por fecha (asientos)</td></tr>
      <tr><td>Libro Mayor</td><td>Agrupa los movimientos por cuenta y da su saldo</td></tr>
      <tr><td>Balance de saldos</td><td>Lista todas las cuentas con su saldo para controlar</td></tr>
    </table>
    <h4>Cuentas patrimoniales vs de resultado</h4>
    <p>Acá viene la distinción clave del 2º parcial, porque define <b>a qué estado va cada cuenta</b> al cierre. Las cuentas <b>patrimoniales</b> son las que representan <b>cosas que perduran</b>: el Activo, el Pasivo y el Patrimonio (Caja, Mercaderías, Proveedores, Capital). Estas van al <b>Balance General</b>, que es una "foto" de cómo está parada la empresa a una fecha. Las cuentas de <b>resultado</b> son las que miden <b>cómo me fue durante el período</b>: las <b>Ganancias</b> (ingresos, como Ventas) y las <b>Pérdidas</b> (gastos, como Sueldos o Alquileres). Estas van al <b>Estado de Resultados</b>, que es como una "película" de lo que pasó en el año. La diferencia entre ganancias y pérdidas me da el <b>resultado del ejercicio</b>, y ese número se traslada al Patrimonio: si gané, el patrimonio del dueño crece; si perdí, se achica.</p>
    <div class="eli"><span class="tag">ELI5</span> Las patrimoniales son una <b>foto</b> (qué tengo y qué debo hoy); las de resultado son una <b>película</b> (cuánto gané y gasté durante el año). La película termina y su resultado se suma a la foto.</div>
    <table>
      <tr><th>Tipo</th><th>Qué son</th><th>A dónde van</th></tr>
      <tr><td>Patrimoniales</td><td>Activo, Pasivo y Patrimonio</td><td>Al Balance General</td></tr>
      <tr><td>De resultado</td><td>Ganancias (ingresos) y Pérdidas (gastos)</td><td>Al Estado de Resultados</td></tr>
    </table>
    <div class="key"><span class="tag">Resultado del ejercicio</span> <span class="fml">Resultado = Ganancias − Pérdidas</span>. Si es positivo hay utilidad (aumenta el Patrimonio); si es negativo hay pérdida.</div>

    <h4>Los Estados Financieros (lo que la empresa muestra al mundo)</h4>
    <p>La información patrimonial se entrega a los usuarios <b>externos</b> al menos una vez al año mediante los <b>Estados Financieros</b> (que, a diferencia de los informes internos, <b>no son confidenciales</b> y son obligatorios según las normas — en Uruguay, NIIF para PYMES). Ojo con los nombres, que la cátedra cambió y le gusta preguntar:</p>
    <table>
      <tr><th>Estado Financiero</th><th>(Ex nombre)</th><th>Qué muestra</th></tr>
      <tr><td>Estado de Situación Financiera</td><td>Ex Situación Patrimonial</td><td>La "foto": recursos, obligaciones y PN a una fecha</td></tr>
      <tr><td>Estado de Resultados</td><td>—</td><td>El rendimiento (resultado) del ejercicio</td></tr>
      <tr><td>Estado del Resultado Integral</td><td>—</td><td>El ER + los "otros resultados integrales"</td></tr>
      <tr><td>Estado de Cambios en el Patrimonio</td><td>Ex Evolución del Patrimonio</td><td>Cómo variaron los rubros patrimoniales</td></tr>
      <tr><td>Estado de Flujo de Efectivo</td><td>Ex Origen y Aplicación de Fondos</td><td>De dónde salió y en qué se usó el efectivo</td></tr>
      <tr><td>Notas</td><td>—</td><td>Aclaraciones para interpretar los estados</td></tr>
    </table>

    <h4>Los dos supuestos que sostienen todo (clave para U8)</h4>
    <p>Los Estados Financieros se preparan sobre <b>dos supuestos fundamentales</b> que vas a usar todo el tiempo en los ajustes. El <b>principio de lo devengado</b>: los efectos de las operaciones se reconocen en <b>el período en que ocurren, independientemente de cuándo se cobran o pagan</b>. Y la <b>empresa en marcha</b>: se asume que la empresa <b>está en actividad y va a seguir</b> en el futuro previsible (no se va a liquidar). Además, el <b>Marco Conceptual 2010</b> pide que la información tenga <b>2 características fundamentales</b> —<b>relevancia</b> (si la omito, el usuario decide mal) y <b>representación fiel</b> (completa, neutra y sin errores)— y <b>4 de mejora</b>: <b>comprensibilidad, comparabilidad, verificabilidad y oportunidad</b>.</p>
    <div class="eli"><span class="tag">ELI5</span> Devengado = anoto la cuenta de la luz de diciembre en diciembre, aunque la pague en enero. Empresa en marcha = armo los números asumiendo que la empresa sigue abierta el año que viene (si fuera a cerrar mañana, todo se valuaría distinto).</div>
  </section>

  <!-- P2-B -->
  <section class="sec" id="k-p2b">
    <h3>2º Parcial · Ajustes por balance y hoja de trabajo (U8)</h3>
    <div class="idea">✓ <b>Idea madre:</b> antes de cerrar, <b>ajusto</b> las cuentas para que reflejen la realidad (criterio de lo <b>devengado</b>: lo que corresponde al período, se haya cobrado/pagado o no). La <b>hoja de trabajo</b> ordena todo el cierre paso a paso.</div>
    <div class="eli"><span class="tag">ELI5</span> Ajustar es "poner las cuentas al día": reconocer lo que ya pasó aunque la plata todavía no se haya movido (un alquiler que debo, una máquina que se gastó un año).</div>
    <p>Durante el año registré las operaciones a medida que pasaban, pero al cierre las cuentas <b>no reflejan del todo la realidad</b>, y antes de armar los estados tengo que <b>ajustarlas</b>. El principio que manda acá es el de lo <b>devengado</b>: una ganancia o un gasto se reconoce <b>en el período al que corresponde</b>, se haya cobrado o pagado o no. Es lo contrario de lo "percibido" (que miraría solo cuándo se movió la plata). Ejemplo clásico: si en diciembre uso luz pero la factura me llega en enero, ese gasto es de <b>diciembre</b>, así que lo tengo que reconocer aunque todavía no lo pagué.</p>
    <h4>La llave de toda la unidad: ajustar por realidad vs. por ejercicio económico</h4>
    <p>La definición textual de la cátedra: ajustar es el <b>procedimiento de Teneduría de Libros que permite adecuar la contabilidad <i>a la realidad</i> o <i>al ejercicio económico</i></b>. Y acá engancha con la clasificación de cuentas de U4: <b>integrales</b> (Activo y Pasivo) vs. <b>diferenciales</b> (Resultados). Esa es la dicotomía que ordena todo:</p>
    <table>
      <tr><th>Tipo de ajuste</th><th>Sobre qué cuentas</th><th>Por qué se hace</th></tr>
      <tr><td><b>Por consideración de la REALIDAD</b></td><td><b>Integrales</b> (A y P)</td><td>El saldo contable no coincide con la realidad: corrección de errores/omisiones (arqueo, conciliación) y corrección de valores (deudores en gestión, concurso, incobrables, adelantos)</td></tr>
      <tr><td><b>Por consideración al EJERCICIO ECONÓMICO</b></td><td><b>Diferenciales</b> (Resultados)</td><td>Hay que dejar en el ejercicio <b>solo</b> sus ingresos y gastos (criterio de lo devengado): devengamiento y diferimiento</td></tr>
    </table>
    <p>Los ajustes <b>por ejercicio económico</b> (los que más caen) se ordenan en <b>3 grupos</b>. <b>Grupo 1 — registré de MENOS</b>: faltan gastos o ingresos del ejercicio (un gasto a pagar, un ingreso a cobrar) → los reconozco y creo el pasivo/activo correspondiente. <b>Grupo 2 — registré de MÁS</b>: cargué como gasto o ganancia algo que excede el ejercicio (alquiler pagado o cobrado por adelantado) → posterga el resultado y lo llevo a un activo (gasto adelantado) o pasivo (ingreso adelantado). <b>Grupo 3 — casos especiales</b>: <b>intereses perdidos, intereses ganados y seguros</b>, que se ajustan con <b>cuentas regularizadoras</b> ("a vencer").</p>
    <div class="key"><span class="tag">Cuentas regularizadoras y extornos</span> Las cuentas "<b>a vencer</b>" regularizan: <i>Intereses perdidos a vencer</i> y <i>Seguros a vencer</i> regularizan un <b>pasivo</b>; <i>Intereses ganados a vencer</i> y la <i>Provisión para incobrables</i> regularizan un <b>activo</b>. Los ajustes de los Grupos 2 y 3 se <b>extornan</b> el <b>primer día del ejercicio siguiente</b> (tras la reapertura). Trampa: en el Grupo 1 las cuentas de resultado quedan en <b>cero</b> tras el extorno; en los Grupos 2 y 3 <b>no</b> — el saldo trasladado se vuelve pérdida/ganancia del <b>nuevo</b> ejercicio.</div>
    <div class="trap"><span class="tag">Ojo con la trampa</span> <b>No compensar</b> saldos deudores y acreedores de una misma cuenta: si un deudor te dejó una seña, eso es un <b>pasivo</b> (Adelanto de clientes), no se "netea" contra Deudores. Lo mismo con Anticipo a proveedores (activo).</div>
    <h4>Hoja de Trabajo (U9): la planilla que cierra el ejercicio</h4>
    <p>La <b>Hoja de Trabajo</b> es un elemento <b>extracontable y no obligatorio</b> (ojo, los ajustes <b>sí</b> van al Diario y al Mayor; la hoja es solo el borrador que ordena todo). Sirve para <b>determinar el resultado</b> y armar los asientos de cierre. Tiene <b>6 pares de columnas</b> que se llenan de izquierda a derecha, cada una arrastrando a la siguiente:</p>
    <ol class="steps">
      <li><b>Números</b> (Débitos / Créditos): las sumas del Mayor.</li>
      <li><b>Saldos</b> (Deudor / Acreedor): el balancete de saldos. Σ deudores = Σ acreedores.</li>
      <li><b>Ajustes</b> (Debe / Haber): los débitos y créditos de los asientos de ajuste (si nace una cuenta nueva, entra con saldo inicial cero).</li>
      <li><b>Saldos ajustados</b> (Deudor / Acreedor): saldos ± ajustes.</li>
      <li><b>Estado de Resultados</b> (Pérdidas / Ganancias): van las cuentas <b>diferenciales</b>.</li>
      <li><b>Estado de Situación</b> (Activo / Pasivo y Patrimonio): van las <b>integrales</b>.</li>
    </ol>
    <p>Cada cuenta se clasifica en <b>una sola</b> columna (no se reparte). El <b>Resultado del Ejercicio</b> es la diferencia entre Ganancias y Pérdidas, y se anota —acá está la trampa— en la columna del ER con el <b>menor valor</b> (para que los totales cuadren): si hubo <b>ganancia</b>, el resultado va en la columna de <b>Pérdidas</b>; si hubo <b>pérdida</b>, en la de <b>Ganancias</b>. En el Estado de Situación va siempre en <b>Pasivo y Patrimonio</b> (es una cuenta de Patrimonio): positivo si ganancia, negativo si pérdida.</p>
    <h4>Los 3 asientos de resultados (con la cuenta puente)</h4>
    <p>Para cerrar las cuentas de resultado (que son acumulativas y tienen que arrancar de cero el año siguiente) se usa una <b>cuenta puente / de movimiento: "Pérdidas y Ganancias"</b>. Son <b>3 asientos</b>: (1) <b>cierro las pérdidas</b> contra Pérdidas y Ganancias (debito P y G, acredito cada pérdida); (2) <b>cierro las ganancias</b> contra Pérdidas y Ganancias (debito cada ganancia, acredito P y G); (3) <b>registro el resultado</b> pasando el saldo de Pérdidas y Ganancias a la cuenta patrimonial <b>Resultado del Ejercicio</b>. Después de los tres, <b>Pérdidas y Ganancias queda saldada (en cero)</b>. Por último, el <b>asiento de cierre de libros</b> cancela todas las cuentas de Activo, Pasivo y Patrimonio (¡sin olvidar incluir Resultado del Ejercicio!), y el primer día del año siguiente se reabre extornándolo.</p>
    <div class="eli"><span class="tag">ELI5</span> "Pérdidas y Ganancias" es un <b>balde</b> donde volcás todas las pérdidas y todas las ganancias del año. Lo que queda en el balde es tu resultado, y lo vaciás en "Resultado del Ejercicio". El balde tiene que quedar <b>vacío</b>.</div>

    <h3>1er Parcial · Organizaciones y administradores (Módulo I)</h3>

    <h4>¿De qué se trata esta materia?</h4>
    <p>AYGO estudia <b>cómo funcionan las organizaciones y cómo se las administra</b>. Vivimos rodeados de ellas: la facultad, un club, un supermercado, el Estado. Administrar bien es lo que hace que una organización <b>logre sus objetivos sin desperdiciar recursos</b>. Es una materia sobre todo <b>conceptual</b>: se aprueba entendiendo las ideas y, clave, sabiendo <b>a qué autor pertenece cada una</b> (porque muchas preguntas son justamente "¿de quién es este modelo?").</p>

    <h4>¿Qué es una organización? (definición de la cátedra)</h4>
    <p>La definición que usa el curso es la de <b>Robbins (1990)</b>: una organización es <b>"una entidad social coordinada de forma consciente, con un límite relativamente identificable, que funciona sobre bases relativamente continuas para lograr un objetivo o conjunto de objetivos comunes"</b>. De ahí se desprende que toda organización es un <b>sistema</b> (elementos relacionados entre sí y con el entorno), es una <b>entidad social</b> (personas), está <b>coordinada conscientemente</b>, tiene <b>límites identificables</b> (se sabe quién está adentro y quién no), tiene <b>carácter permanente</b> (voluntad de permanencia) y persigue <b>objetivos</b> ligados a su misión y visión.</p>

    <h4>Los 4 elementos de una organización (esquema de Jorge Xavier)</h4>
    <p>El profesor Xavier desarma toda organización en <b>cuatro elementos</b>. Sabérselos ordena media materia:</p>
    <p><b>1) Entidad social (la Gente).</b> Cada persona ocupa un lugar con un <b>status</b> (la posición, que trae derechos y obligaciones) y cumple un <b>rol</b> (el comportamiento que se espera de ella). La gente forma <b>grupos</b>: <b>formales</b> (definidos por la estructura, con tareas asignadas) e <b>informales</b> (surgen solos por afinidad — los cinco que almuerzan juntos). Y todo eso está bañado por la <b>cultura organizacional</b>: los valores, tradiciones y "formas de hacer las cosas acá" que comparten los miembros (Robbins & Coulter). La cultura es una <b>percepción</b>, es <b>descriptiva</b> y es <b>compartida</b>.</p>
    <p><b>2) Estructura deliberada.</b> Acá va una igualdad que la cátedra remarca: <b>Estructura real = Estructura Formal + Estructura Informal</b>. La formal es cómo se divide el trabajo y se coordina; tiene <b>tres dimensiones</b>: <b>formalización</b> (cuán definidos están los procesos), <b>centralización</b> (cuán concentrada está la autoridad) y <b>complejidad</b> (cuán difíciles y especializadas son las actividades).</p>
    <p><b>3) Finalidad definida.</b> El para qué, según su <b>misión</b> ("¿por qué existimos?", la razón de ser) y su <b>visión</b> ("¿hacia dónde vamos?"). Cuidado con otra distinción que cae: <b>objetivos formales</b> (los declarados en estatutos e informes) vs. <b>objetivos reales</b> (los que de hecho persigue). En las empresas el fin es el <b>lucro</b>; en las sin fines de lucro, satisfacer a un grupo social. Ejemplos del curso para contrastar: la misión/visión de <b>CONAPROLE</b> (con fines de lucro) vs. la del <b>Movimiento Tacurú</b> (sin fines de lucro).</p>
    <p><b>4) Recursos usados según tecnologías.</b> Toda organización transforma <b>insumos</b> (personal, tecnología, capital, equipo, materiales, información) en <b>bienes o servicios</b> mediante un <b>proceso de transformación</b> (Administración de Operaciones).</p>
    <div class="eli"><span class="tag">ELI5</span> Una organización = gente (con su lugar y su cultura) + una estructura (formal e informal) + un para qué (misión/visión) + recursos que se transforman en algo. Una <b>empresa</b> es la organización que hace todo eso buscando <b>lucro</b>: toda empresa es organización, pero no toda organización es empresa (un club o una ONG, no).</div>

    <h4>Mecanicista vs. orgánica (Burns y Stalker)</h4>
    <p>Según cómo sea su estructura, una organización tiende a uno de dos modelos, y cuál conviene <b>depende del entorno</b>. La <b>mecanicista</b> es rígida y controlada (alta especialización, cadena de mando clara, centralización, mucha formalización); busca la <b>eficiencia</b> y sirve para entornos <b>estables</b> y producción masiva. La <b>orgánica</b> es flexible y adaptable (equipos interfuncionales, info que fluye, descentralización, poca formalización); sirve para entornos de <b>incertidumbre</b>. Las <b>variables de contingencia</b> que definen cuál usar son <b>estrategia, ambiente, tecnología y personas</b> (Woodward sumó que la tecnología pesa: producción por unidades/procesos → orgánica; masiva → mecanicista).</p>

    <h4>Productividad, eficiencia, eficacia, efectividad y sostenibilidad</h4>
    <p>La cátedra encadena <b>cinco</b> conceptos (no solo dos). <b>Productividad</b> es la capacidad de producir, medida por unidad de factor (ej.: una hectárea que rinde 8 toneladas de arroz). <b>Eficiencia</b> (Drucker) es <b>"hacer bien las cosas"</b>: la mejor relación entre recursos y resultados — tiene que ver con el <b>cómo</b> (producir a $1,5 en vez de $2). <b>Eficacia</b> es <b>"hacer las cosas correctas"</b>: las que conducen a los objetivos — tiene que ver con el <b>qué</b>. <b>Efectividad</b> es <b>"hacer bien las cosas correctas"</b> = eficiente <b>y</b> eficaz a la vez. Y la cátedra suma la <b>sostenibilidad</b>: la capacidad del sistema de mantenerse en el tiempo afrontando restricciones ecológicas y presiones socioeconómicas (sus tres aspectos: medio ambiente, diversidad cultural y derechos humanos; marcos: los Objetivos de Desarrollo del Milenio de la ONU y el Pacto Mundial de RSC).</p>
    <table>
      <tr><th>Concepto</th><th>Idea</th><th>Pregunta</th></tr>
      <tr><td>Eficiencia (Drucker)</td><td>Hacer bien las cosas — mejor uso de recursos</td><td>¿el <b>cómo</b>?</td></tr>
      <tr><td>Eficacia</td><td>Hacer las cosas correctas — lograr el objetivo</td><td>¿el <b>qué</b>?</td></tr>
      <tr><td>Efectividad</td><td>Hacer bien las cosas correctas</td><td>eficiente <b>+</b> eficaz</td></tr>
      <tr><td>Sostenibilidad</td><td>Mantenerse en el tiempo (ambiente, cultura, DDHH)</td><td>¿perdura?</td></tr>
    </table>
    <div class="eli"><span class="tag">ELI5</span> Eficaz = llegaste a destino. Eficiente = llegaste sin gastar nafta de más. Efectivo = las dos. Sostenible = podés seguir haciéndolo años sin fundirte ni fundir el planeta.</div>

    <h4>Clasificación de organizaciones (las taxonomías)</h4>
    <p>La cátedra llama <b>taxonomías</b> a las clasificaciones, y aclara algo clave: cada una toma <b>una sola característica</b> (la más destacada). Son <b>seis</b>, y varias tienen autor o norma con nombre y apellido — eso es justo lo que preguntan:</p>
    <table>
      <tr><th>Criterio</th><th>Categorías</th><th>Autor / norma</th></tr>
      <tr><td>Deseo de lucro</td><td>Con fines de lucro / Sin fines de lucro</td><td>— (ej.: Salus vs. Teletón)</td></tr>
      <tr><td>Beneficiarios principales</td><td>Miembros / Propietarios / Clientes / Población</td><td><b>Blau y Scott</b></td></tr>
      <tr><td>Propiedad</td><td>Privada / Pública / Mixta</td><td>— (Pública: UTE, ANTEL. Mixta: Cementos del Plata)</td></tr>
      <tr><td>Forma de adhesión (control)</td><td>Coercitiva / Normativa / Utilitaria</td><td><b>Etzioni</b></td></tr>
      <tr><td>Origen de los productos</td><td>Sector Primario / Secundario / Terciario</td><td>—</td></tr>
      <tr><td>Dimensión (tamaño)</td><td>Micro / Pequeña / Mediana / Grande</td><td><b>Decreto 504/007</b> (Uruguay)</td></tr>
    </table>
    <p>Las dos que más caen con autor: <b>Etzioni</b> clasifica por cómo se logra la obediencia — <b>coercitiva</b> (cárceles, servicio militar), <b>normativa</b> (clubes, partidos, iglesias) y <b>utilitaria</b> (empresas, que mueven con incentivos económicos). Y <b>Blau y Scott</b> por quién es el beneficiario principal: los <b>miembros</b> (cooperativas, sindicatos), los <b>propietarios</b> (sociedades comerciales), los <b>clientes</b> (hospitales, universidades) o la <b>población</b> (organismos militares, salud pública). La de <b>dimensión</b> es uruguaya y muy concreta: el <b>Decreto 504/007</b> mide personal ocupado y facturación (Micro ≤4 personas; Pequeña ≤19; Mediana ≤99; Grande supera esos límites), y el organismo competente es <b>DINAPYME</b> (MIEM).</p>
    <div class="trap"><span class="tag">Ojo con la trampa</span> <b>Etzioni = adhesión/control</b> (coercitiva/normativa/utilitaria); <b>Blau y Scott = beneficiarios</b> (miembros/propietarios/clientes/población). Son las dos que se confunden.</div>

    <h4>El entorno: nada vive aislado</h4>
    <p>Ninguna organización existe sola: es <b>un subsistema social inserto en su medio</b> (Cúneo). El <b>medio ambiente externo</b> son "todas las fuerzas e instituciones que pueden influir en su desempeño" (Daft), y se divide en dos (Robbins & Coulter):</p>
    <table>
      <tr><th>Entorno</th><th>Qué es</th><th>Componentes</th></tr>
      <tr><td><b>Específico / directo</b></td><td>Fuerzas con efecto <b>directo e inmediato</b> en las decisiones; es único de cada organización y cambia</td><td>Clientes, proveedores, gobierno, medios, sindicatos, grupos de presión, competidores · (internos: empleados, accionistas)</td></tr>
      <tr><td><b>General / indirecto</b></td><td>Fuerzas amplias que afectan el "clima" y tienen potencial de volverse acción directa</td><td>Variables sociales, políticas, económicas y tecnológicas</td></tr>
    </table>
    <p>Dentro de las <b>variables sociales</b> el curso enfatiza las <b>generaciones</b> (hoy conviven hasta cuatro en una empresa: baby boomers, X, Y/millennials, Z) y en las <b>tecnológicas</b>, la <b>disrupción digital</b> (todo se vuelve "ceros y unos"). La <b>incertidumbre ambiental</b> (Robbins & Coulter) combina dos factores: el <b>grado de cambio</b> (estable ↔ dinámico) y el <b>grado de complejidad</b> (cuántos componentes hay y cuánto los conozco). Y para mirar el entorno indirecto se usa la <b>visión periférica</b> (Day y Schoemaker): detectar las <b>señales débiles</b> de la "periferia" antes de que sea tarde.</p>

    <h4>Administración y administradores: qué es y los autores clave</h4>
    <p>La <b>Administración</b>, en la definición que el curso prioriza (<b>Robbins & Coulter</b>), es <b>"la coordinación y supervisión de las actividades laborales de otras personas, de tal manera que se realicen de forma eficiente y eficaz"</b>. Administrar = cumplir las <b>4 funciones</b>: planificar, organizar, dirigir y controlar. Un <b>gerente</b> es quien las lleva adelante asignando recursos humanos, materiales, financieros y de información para alcanzar las metas; el detalle que da carácter de gerente es que <b>su éxito se mide por cómo se desempeñan quienes él dirige</b>.</p>
    <p><b>Tipos de gerente</b> (Robbins & Coulter): por nivel, de <b>primera línea/operativos</b> (encargado, supervisor, capataz), de <b>nivel medio</b> y de <b>alto nivel</b>; por ámbito, <b>generales</b> (toda la operación) y <b>funcionales</b> (una sola función: producción, ventas, finanzas, RRHH).</p>
    <p><b>Katz (1955)</b> dice que un gerente necesita <b>3 habilidades</b>: <b>técnicas</b> (saber hacer la tarea — pesan más en la <b>primera línea</b>), <b>humanas</b> (trabajar con personas — las necesitan <b>todos</b> por igual) y <b>conceptuales</b> (ver el panorama y diseñar soluciones — pesan más en la <b>alta dirección</b>).</p>
    <p><b>Mintzberg</b> observó qué hacen <i>de verdad</i> los gerentes y lo resumió en <b>10 roles</b> en 3 categorías: <b>interpersonales</b> (representación, liderazgo, enlace), <b>informativos</b> (monitor/vigilancia, difusión, portavoz) y <b>decisorios</b> (emprendedor, gestor de conflictos, asignador de recursos, negociador).</p>
    <p>Y los <b>clásicos</b> que fundaron la disciplina, en orden histórico: <b>Taylor</b> ("padre de la administración científica", 4 principios, tiempos y movimientos), <b>Fayol</b> (la Escuela Clásica: definió el <b>proceso administrativo</b> y sus <b>14 principios</b>), <b>Weber</b> (la <b>burocracia</b>: distingue autoridad <b>tradicional, carismática y legal/racional</b>) y <b>Mayo</b> (experimentos de <b>Hawthorne</b> → la Escuela de <b>Relaciones Humanas</b>: el factor humano importa tanto como la tarea). Después vienen los <b>comportamentales</b> (Maslow en adelante), la <b>Neoclásica</b> (Drucker) y la <b>estrategia</b> (Porter).</p>
    <div class="key"><span class="tag">Dato fino de la cátedra</span> Según <b>Bunge</b>, la administración es una <b>técnica científica</b>: usa el método científico pero <b>no es una ciencia</b> (no busca conocimiento desinteresado, busca controlar/ser útil). Para <b>Koontz</b>, la práctica es un <b>arte</b> y el conocimiento que la sostiene es <b>ciencia</b>: son complementarios.</div>
    <table>
      <tr><th>Autor</th><th>Lo que tenés que asociarle</th></tr>
      <tr><td>Katz</td><td>3 habilidades: técnicas, humanas y conceptuales</td></tr>
      <tr><td>Mintzberg</td><td>10 roles (interpersonales, informativos, decisorios)</td></tr>
      <tr><td>Taylor</td><td>Administración científica (eficiencia en la tarea)</td></tr>
      <tr><td>Fayol</td><td>Proceso administrativo y principios</td></tr>
      <tr><td>Weber</td><td>Burocracia (autoridad y reglas)</td></tr>
      <tr><td>Mayo</td><td>Relaciones humanas (el factor humano)</td></tr>
    </table>
    <div class="trap"><span class="tag">Ojo con la trampa</span> No mezcles los autores: Katz = <b>habilidades</b>; Mintzberg = <b>roles</b>; Taylor/Fayol/Weber/Mayo = las escuelas clásicas. Es lo que más se confunde.</div>
  </section>

  <!-- P1-B -->
  <section class="sec" id="a-p1b">
    <h3>1er Parcial · Planificación y organización (Módulo II, parte 1)</h3>
    <div class="idea">✓ <b>Idea madre:</b> el proceso administrativo es <b>Planificar → Organizar → Dirigir → Controlar</b>. Son las 4 cosas que hace un gerente, en orden. Acá van las dos primeras.</div>
    <h4>Planificación</h4>
    <p><b>Planificar</b> es la primera función: definir <b>a dónde quiero llegar</b> (los objetivos) y <b>cómo</b> (los planes). Antes de actuar, la organización mira para adentro y para afuera con el <b>FODA</b>: Fortalezas y Debilidades (que son <b>internas</b>, dependen de ella) y Oportunidades y Amenazas (que son <b>externas</b>, vienen del entorno) — está en el cuadro de abajo. De ese análisis salen la <b>misión</b> (la razón de ser: qué hace, para quién y cómo), los <b>objetivos</b> (que, según Robbins, tienen que ser concretos: específicos, medibles y con plazo) y los distintos <b>tipos de planes</b> según su alcance y duración.</p>
    <table>
      <tr><th>Herramienta</th><th>Qué es</th></tr>
      <tr><td>FODA</td><td>Fortalezas y Debilidades (internas) · Oportunidades y Amenazas (externas)</td></tr>
      <tr><td>Misión</td><td>Razón de ser de la organización (qué hace, para quién, cómo)</td></tr>
      <tr><td>Objetivos (Robbins)</td><td>Bien redactados: específicos, medibles, con plazo</td></tr>
      <tr><td>Tipos de planes</td><td>Estratégicos/operativos, corto/largo plazo, específicos/direccionales, únicos/permanentes</td></tr>
    </table>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 205" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">

      <text x="30" y="76" fill="#aab4c8" font-size="10" text-anchor="middle" transform="rotate(-90 30 76)">Internas</text>
      <text x="30" y="152" fill="#aab4c8" font-size="10" text-anchor="middle" transform="rotate(-90 30 152)">Externas</text>
      <rect x="62" y="38" width="126" height="74" fill="rgba(54,211,153,.12)" stroke="#36d399" stroke-width="1.5"/>
      <rect x="190" y="38" width="126" height="74" fill="rgba(255,107,107,.10)" stroke="#ff6b6b" stroke-width="1.5"/>
      <rect x="62" y="114" width="126" height="74" fill="rgba(54,211,153,.08)" stroke="#36d399" stroke-width="1.5"/>
      <rect x="190" y="114" width="126" height="74" fill="rgba(255,107,107,.08)" stroke="#ff6b6b" stroke-width="1.5"/>
      <text x="125" y="72" fill="#e8ecf5" font-size="13" text-anchor="middle" font-weight="bold">Fortalezas</text>
      <text x="125" y="90" fill="#7a8499" font-size="10" text-anchor="middle">(F)</text>
      <text x="253" y="72" fill="#e8ecf5" font-size="13" text-anchor="middle" font-weight="bold">Debilidades</text>
      <text x="253" y="90" fill="#7a8499" font-size="10" text-anchor="middle">(D)</text>
      <text x="125" y="148" fill="#e8ecf5" font-size="13" text-anchor="middle" font-weight="bold">Oportunidades</text>
      <text x="125" y="166" fill="#7a8499" font-size="10" text-anchor="middle">(O)</text>
      <text x="253" y="148" fill="#e8ecf5" font-size="13" text-anchor="middle" font-weight="bold">Amenazas</text>

    <div style="color:#7a8499;font-size:.8rem">Matriz FODA: Fortalezas y Debilidades son <b>internas</b> (de la empresa); Oportunidades y Amenazas son <b>externas</b> (del entorno).</div>
    </div>
    <p>Pero el FODA no se queda en el cuadro: la cátedra (Gallardo) lo usa como <b>matriz de doble entrada</b> que cruza lo interno con lo externo y genera <b>4 estrategias</b>. La <b>FO (maxi-maxi)</b> usa fortalezas para aprovechar oportunidades (la más exitosa); la <b>DO (mini-maxi)</b> supera debilidades para aprovechar oportunidades; la <b>FA (maxi-mini)</b> usa fortalezas para enfrentar amenazas; y la <b>DA (mini-mini)</b> reduce debilidades y evita amenazas.</p>
    <p>Antes de planificar, el administrador tiene una <b>actitud</b> frente al futuro (Gallardo): el <b>inactivo</b> no planea, el <b>reactivo</b> repite soluciones del pasado, el <b>preactivo</b> proyecta el futuro desde el pasado y el <b>interactivo (proactivo)</b> se adelanta y <b>diseña el futuro</b> — es el ideal. Y los <b>objetivos</b> bien hechos (Robbins & Coulter) van en términos de <b>resultados</b> (no acciones), son <b>medibles</b>, con <b>plazo</b>, <b>desafiantes pero logrables</b>, <b>por escrito</b> y <b>comunicados</b>.</p>
    <h4>Tipos de planes y herramientas</h4>
    <p>Hay una <b>regla mnemotécnica</b> del curso para clasificar planes según a qué refieren: <b>dinero → Presupuestos</b>, <b>tiempos → Programas</b>, <b>métodos → Procedimientos</b>, <b>comportamientos → Reglamentos</b>. Y Robbins los clasifica por <b>alcance</b> (estratégicos/operativos), <b>marco temporal</b> (largo/corto plazo), <b>especificidad</b> (direccionales/específicos) y <b>frecuencia de uso</b> (un solo uso/permanentes). Para ordenar la ejecución en el tiempo se usan el <b>Gráfico de Gantt</b> (actividades vs. tiempo) y el <b>PERT / camino crítico</b> (red que marca holguras y la ruta que no admite demoras). Y para controlar la estrategia, el <b>Cuadro de Mando Integral (Balanced Scorecard</b>, Kaplan y Norton) con sus <b>4 perspectivas</b>: financiera, del cliente, de procesos internos, y de aprendizaje y crecimiento.</p>
    <table>
      <tr><th>Plan</th><th>Refiere a…</th><th>Frecuencia</th></tr>
      <tr><td>Presupuesto</td><td>Dinero (expresión numérica del plan)</td><td>—</td></tr>
      <tr><td>Programa</td><td>Tiempos / secuencia</td><td>Una vez</td></tr>
      <tr><td>Procedimiento</td><td>Métodos (instrucciones detalladas)</td><td>Recurrente</td></tr>
      <tr><td>Política</td><td>Guía para decidir</td><td>Permanente</td></tr>
      <tr><td>Reglamento</td><td>Comportamientos (categórico)</td><td>Recurrente</td></tr>
    </table>
    <h4>Organización (estructura)</h4>
    <p><b>Organizar</b> es la segunda función. Stoner lo resume en <b>3 pasos</b>: <b>dividir el trabajo</b>, <b>departamentalizar</b> (agrupar) y <b>coordinar</b>. Para entender la estructura por dentro, la cátedra (Pini) encadena cuatro conceptos: una <b>función</b> es un grupo de actividades homogéneas; un <b>órgano</b> es la parte especializada que las realiza (gerencia, departamento, sección); las <b>tareas</b> de una persona definen un <b>puesto</b>; y los puestos con las mismas tareas forman un <b>cargo</b>. Regla fina: los <b>puestos</b> son el aspecto <b>cuantitativo</b> (cuántas personas), los <b>cargos</b> el <b>cualitativo</b> (qué se hace). Ejemplo del curso: la Oficina de Compras es un <b>órgano</b> con 3 cargos (Jefe, Auxiliar, Dactilógrafo) y 4 puestos (porque hay 2 Auxiliares).</p>
    <p>Esa estructura se dibuja en el <b>organigrama</b>, y la <b>departamentalización</b> puede ser por <b>función</b>, <b>producto</b>, <b>geografía</b>, <b>cliente</b>, <b>proceso</b> o <b>matricial</b> (esta última rompe la unidad de mando: tenés <b>dos jefes</b>). El <b>tramo de control</b> (cuántos subordinados por jefe) define la forma: tramos <b>reducidos</b> → muchos niveles (estructura <b>empinada</b>); tramos <b>amplios</b> → pocos niveles (estructura <b>achatada</b>).</p>
    <p><b>Mintzberg</b> dice que toda organización tiene <b>5 partes</b>: la <b>cumbre/ápice estratégico</b> (la cúpula que decide), la <b>línea media</b> (los mandos que conectan la cúpula con el piso), el <b>núcleo operativo</b> (los que hacen el trabajo real — "el corazón"), la <b>tecnoestructura</b> (analistas que estandarizan y planifican el trabajo de los demás) y el <b>staff de apoyo</b> (servicios fuera del flujo central, como legal o cafetería).</p>
    <p>Y la gente se coordina con <b>5 mecanismos</b> (Mintzberg los llama "el adhesivo de la estructura"). A medida que la organización se complejiza, se pasa de uno al siguiente: <b>1) ajuste mutuo</b> (dos pares se coordinan hablando, informal); <b>2) supervisión directa</b> (un jefe da las órdenes y controla); <b>3) estandarización de procesos</b> (se especifica <i>cómo</i> hacer la tarea, para trabajos simples y rutinarios); <b>4) estandarización de resultados</b> (se especifica el <i>producto</i> y el operario elige el método); <b>5) estandarización de calificaciones</b> (se especifica la <i>formación</i> del que ejecuta, adquirida afuera — universidades). Y cuando todo se vuelve <b>muy</b> complejo, se vuelve al <b>ajuste mutuo</b>.</p>
    <p>Por último, <b>Burns y Stalker</b> distinguen dos tipos de estructura según el entorno: la <b>mecanicista</b> (rígida, jerárquica, con reglas claras — ideal para entornos <b>estables</b>) y la <b>orgánica</b> (flexible, con poca jerarquía y mucha comunicación — ideal para entornos <b>cambiantes</b>).</p>
    <div class="eli"><span class="tag">ELI5</span> Pensá la organización como un equipo de fútbol. El <b>organigrama</b> es la alineación en la pizarra; la <b>departamentalización</b> es agrupar por puestos (defensores, mediocampistas, delanteros); las <b>5 partes de Mintzberg</b> son DT (ápice), ayudantes de campo (línea media), jugadores (núcleo operativo), preparador físico (tecnoestructura) y utilero/médico (staff). Si el rival juega siempre igual, te alcanza un esquema fijo (<b>mecanicista</b>); si cambia todo el tiempo, necesitás un equipo que se reacomode solo (<b>orgánica</b>).</div>
    <table>
      <tr><th>Concepto</th><th>Clave</th></tr>
      <tr><td>Órganos / cargos / puestos (Pini)</td><td>Órgano = parte especializada · Cargo = qué se hace (cualitativo) · Puesto = cuántas personas (cuantitativo)</td></tr>
      <tr><td>Departamentalización</td><td>Funcional, por producto, geográfica, por cliente, por proceso, matricial (doble mando)</td></tr>
      <tr><td>Tramo de control</td><td>Reducido → estructura empinada (+niveles) · Amplio → achatada (−niveles)</td></tr>
      <tr><td>Mintzberg · 5 partes</td><td>Ápice estratégico, línea media, núcleo operativo, tecnoestructura, staff de apoyo</td></tr>
      <tr><td>Mintzberg · 5 mecanismos</td><td>Ajuste mutuo, supervisión directa, estandarización de procesos / de resultados / de calificaciones</td></tr>
      <tr><td>Burns & Stalker</td><td>Estructura mecanicista (estable) vs orgánica (flexible)</td></tr>
    </table>
  </section>

  <!-- P1-C -->
  <section class="sec" id="a-p1c">
    <h3>1er Parcial · Dirección y control (Módulo II, parte 2)</h3>
    <div class="idea">✓ <b>Idea madre:</b> ya planifiqué y organicé; ahora tengo que hacer que la gente trabaje (<b>dirigir</b>) y verificar que las cosas salgan como las planeé (<b>controlar</b>). Dirigir se apoya en dos patas: <b>liderazgo</b> y <b>motivación</b>.</div>
    <h4>Dirección: liderazgo</h4>
    <p><b>Dirigir</b> es influir en las personas para que pongan su esfuerzo en los objetivos. Acá aparece la diferencia clásica: el <b>gerente</b> tiene autoridad porque ocupa el cargo, mientras que el <b>líder</b> consigue que lo sigan por su capacidad de movilizar e inspirar (los mejores son las dos cosas a la vez). Sobre cómo liderar, hay dos modelos que tenés que distinguir bien. <b>Blake y Mouton</b> arman una <b>grilla</b> de dos ejes —cuánto te importan las <b>personas</b> y cuánto la <b>producción</b>— y de ahí salen 5 estilos, siendo el ideal el (9,9), el líder de <b>equipo</b> que cuida ambas cosas al máximo. <b>Hersey y Blanchard</b>, en cambio, dicen que <b>no hay un estilo ideal fijo</b>: el estilo correcto <b>depende de la madurez del seguidor</b> (de cuánto sabe y quiere). Con alguien nuevo conviene <b>decir</b> (dar instrucciones); a medida que madura, pasás a <b>vender</b>, después a <b>participar</b> y finalmente a <b>delegar</b>.</p>
    <p>La cátedra ordena los enfoques de liderazgo como una <b>evolución</b>: primero las <b>teorías de los rasgos</b> ("el líder nace", el Gran Hombre), después las <b>conductuales</b> (qué <b>hace</b> el líder — ahí entran Blake & Mouton y la idea clave de que <b>el liderazgo se aprende</b>), luego las <b>situacionales</b> (Hersey & Blanchard) y finalmente, ya para el siglo XXI, el modelo de <b>Bass</b>: distingue el líder <b>transaccional</b> (conduce con recompensas y castigos) del <b>transformacional</b>, que es el más adecuado para el <b>cambio y la innovación</b> y se define por <b>4 "íes"</b>: <b>Influencia idealizada, Motivación inspiradora, Estimulación intelectual y Consideración individualizada</b>.</p>
    <table>
      <tr><th>Modelo</th><th>Idea</th></tr>
      <tr><td>Líder vs gerente</td><td>El gerente administra por el cargo (poder de posición); el líder influye por su poder personal y mira el cambio</td></tr>
      <tr><td>Blake & Mouton (Grid 9×9)</td><td>Cruza interés por personas y por producción → 5 estilos (ideal: 9,9 equipo)</td></tr>
      <tr><td>Hersey & Blanchard (situacional)</td><td>El estilo depende de la madurez del seguidor (R1–R4: decir, vender, participar, delegar)</td></tr>
      <tr><td>Bass (transformacional)</td><td>Transaccional (recompensas) vs transformacional (las 4 íes) → para el cambio</td></tr>
    </table>
    <h4>Dirección: motivación</h4>
    <p>Liderar no alcanza si la gente no tiene ganas: la otra pata es la <b>motivación</b>, eso que empuja a una persona a esforzarse. El modelo más famoso es la <b>pirámide de Maslow</b>: las necesidades humanas se ordenan en niveles y se van cubriendo <b>de abajo hacia arriba</b>. Primero las <b>fisiológicas</b> (comer, dormir), después la <b>seguridad</b> (un trabajo estable), las <b>sociales</b> (pertenecer, tener compañeros), la <b>estima</b> (que me reconozcan) y arriba de todo la <b>autorrealización</b> (desarrollar mi potencial). La idea clave: un nivel <b>solo motiva si los de abajo ya están cubiertos</b> — de nada sirve ofrecerle un premio al orgullo a alguien que no llega a fin de mes. <b>McClelland</b> agrega otra mirada: tenemos 3 necesidades <b>aprendidas</b> —de <b>logro</b> (superarse), de <b>poder</b> (influir en otros) y de <b>afiliación</b> (caer bien y tener vínculos)— y cada persona tiene una predominante.</p>
    <p>La cátedra separa las teorías de motivación en dos familias. Las <b>de contenido</b> (con <b>qué</b> se motiva): Maslow, McClelland y sobre todo <b>Herzberg</b>, con su <b>teoría de los dos factores</b>. Herzberg distingue los <b>motivadores</b> o intrínsecos (logro, reconocimiento, responsabilidad → generan <b>satisfacción</b>) de los <b>factores de higiene</b> o extrínsecos (salario, supervisión, condiciones → solo evitan la <b>insatisfacción</b>). La conclusión que más cae: <b>el salario no motiva</b>, solo evita que la gente esté disconforme; lo opuesto de la satisfacción no es la insatisfacción sino la <b>ausencia de satisfacción</b>. Las <b>de proceso</b> (<b>cómo</b> opera la motivación): la <b>teoría de las metas</b> de Locke (metas específicas y difíciles motivan más) y la <b>teoría de las expectativas de Vroom</b> (mi esfuerzo depende de tres relaciones encadenadas: esfuerzo→desempeño, desempeño→recompensa, recompensa→mis metas personales).</p>
    <table>
      <tr><th>Autor</th><th>Modelo</th></tr>
      <tr><td>Maslow (contenido)</td><td>Jerarquía: fisiológicas → seguridad → sociales → estima → autorrealización</td></tr>
      <tr><td>Herzberg (contenido)</td><td>2 factores: motivadores (satisfacción) vs higiene (el salario no motiva)</td></tr>
      <tr><td>McClelland (contenido)</td><td>3 necesidades aprendidas: logro, poder y afiliación</td></tr>
      <tr><td>Vroom (proceso)</td><td>Expectativas: esfuerzo→desempeño→recompensa→metas personales</td></tr>
    </table>

    <h4>Control</h4>
    <p><b>Controlar</b> (Griffin: "la regulación de las actividades de modo que el desempeño se mantenga dentro de límites aceptables", como el <b>timón de un barco</b>) es la última función y cierra el círculo. La cátedra da <b>4 razones</b> para controlar: adaptarse a los <b>cambios del entorno</b>, limitar la <b>acumulación de errores</b>, hacer frente a la <b>complejidad</b> de la organización y <b>minimizar costos</b>. Tiene <b>4 etapas</b> en orden: <b>fijar estándares</b> (la meta medible) → <b>medir</b> el desempeño real ("si no puedo medir, no puedo gestionar") → <b>comparar</b> con el estándar (definiendo una <b>zona de variación aceptable</b>) → <b>acción correctiva</b>, que puede ser de tres tipos: mantener el status quo, corregir la desviación, o <b>cambiar el estándar</b>. Esto <b>reconecta con la planificación</b>: por eso el proceso administrativo es un <b>ciclo</b>.</p>
    <p>Según <b>cuándo</b> se controla (Robbins), hay <b>3 momentos</b>: <b>preventivo/preliminar</b> (antes, sobre los insumos — anticipa el problema, ej. la selección de personal), <b>concurrente</b> (durante, en tiempo real — busca "cero defecto") y <b>posterior/de retroalimentación</b> (después, sobre los resultados). Y según el <b>nivel</b>, hay una pirámide: control de <b>operaciones</b> y <b>financiero</b> en la base, <b>estructural</b> en el medio y <b>estratégico</b> en la cima (su herramienta es el <b>Balanced Scorecard</b>).</p>
    <div class="eli"><span class="tag">ELI5</span> Controlar es como manejar mirando el velocímetro. El <b>estándar</b> es la velocidad máxima (90), <b>medir</b> es mirar la aguja, <b>comparar</b> es ver si vas a 110, y la <b>acción correctiva</b> es soltar el acelerador. El control <b>preventivo</b> es revisar los frenos antes de salir; el <b>concurrente</b> es mirar el tablero mientras manejás; el <b>posterior</b> es ver la multa que te llegó.</div>
    <div class="trap"><span class="tag">Ojo con la trampa</span> No confundas los modelos de liderazgo: Blake & Mouton es una <b>grilla</b> (dos ejes: personas vs producción), Hersey & Blanchard es <b>situacional</b> (depende de la madurez del seguidor). Y ojo con Maslow: el orden es fisiológicas → seguridad → sociales → estima → autorrealización, y se sube <b>de a uno</b>.</div>
  </section>

  <!-- P2-A -->
  <section class="sec" id="a-p2a">
    <h3>2º Parcial · Gerencias funcionales (Módulo III)</h3>
    <div class="idea">✓ <b>Idea madre:</b> la empresa se organiza en <b>áreas funcionales</b>, cada una con su gerencia. Tengo que saber qué hace cada una y cómo se conectan.</div>
    <p>Hasta acá vimos administración "en general". Ahora bajamos a la empresa concreta: por dentro se divide en <b>áreas funcionales</b>, cada una con su gerencia y su propia planificación estratégica. La idea de fondo del Módulo III es la <b>interdependencia</b>: ninguna decide sola (Producción elige tecnología junto con Finanzas; Comercial define el producto que Producción luego diseña). Son cinco, y la cátedra apoya cada una en autores concretos.</p>
    <h4>Comercial / Marketing (Kotler)</h4>
    <p>El autor central es <b>Kotler</b>, que define marketing como <b>"el proceso por el cual las empresas crean valor para sus clientes y construyen relaciones para captar a cambio valor de ellos"</b>. Ojo: el objetivo no es "vender y hacer publicidad", es <b>lograr clientes satisfechos</b>. Sigue un <b>proceso de 5 pasos</b> (entender el mercado → diseñar la estrategia → armar el programa/4P → crear relaciones y deleite → captar valor). La estrategia se decide en 4 movidas: <b>segmentación → mercado meta → diferenciación → posicionamiento</b> (la posición es el lugar que ocupás en la mente del consumidor). Y el programa son las <b>4 P</b> (concepto de <b>McCarthy</b>): <b>Producto</b> (con sus 3 niveles —básico, real, aumentado— y su <b>ciclo de vida</b>: introducción, crecimiento, madurez, decadencia), <b>Precio</b> (techo = valor percibido, piso = costos; estrategias por valor, por costo o por competencia), <b>Plaza</b> (canales directos/indirectos, distribución intensiva/selectiva/exclusiva) y <b>Promoción</b> (mezcla de 5: publicidad, promoción de ventas, ventas personales, relaciones públicas y marketing directo).</p>
    <h4>Producción / Operaciones (enfoque en procesos)</h4>
    <p>La cátedra usa el <b>"enfoque en procesos"</b> (no separa bienes de servicios): producción es el <b>sistema de transformación</b> que convierte insumos en productos. Distingue <b>eficacia</b> (absoluta: se logra o no el objetivo), <b>eficiencia</b> (relativa: relación costo-resultado) y <b>productividad</b> (lograr la eficacia con cierta eficiencia). Concepto estrella: la <b>cadena de valor de Porter</b> (cada proceso agrega valor hasta el cliente). El diseño del proceso productivo tiene <b>6 etapas</b> e incluye definir <b>tecnología, capacidad y layout</b> (distribución de planta). Tipos de producción: por proceso (lineal, convergente, en lotes, unitario) y por flujo (continua, intermitente, por proyecto). Temas asociados: <b>outsourcing</b>, <b>calidad total</b> y normas <b>UNIT-ISO</b> (UNIT certifica en Uruguay), <b>capacidad ociosa</b> e <b>innovación</b> (Manual de Oslo). Ejemplo del curso: el <b>Antel Arena</b> (capacidad de diseño 10.000 / máxima 15.000).</p>
    <h4>Finanzas (Van Horne, Pascale)</h4>
    <p>Toda la gestión financiera (Van Horne) se reduce a <b>dos tipos de decisión</b>: de <b>inversión</b> (en qué pongo los fondos) y de <b>financiamiento</b> (de dónde los saco). El <b>Estado de Situación Financiera</b> es el "mapa": el <b>activo</b> muestra en qué invirtió la empresa; el <b>pasivo + patrimonio</b>, cómo lo financió. Conceptos clave: <b>flujo de caja</b> (se decide por cuándo se cobra/paga, no cuándo se gana), <b>valor tiempo del dinero</b> (Pascale: 3 razones, la inflación es solo una más), <b>riesgo</b> (variabilidad de los rendimientos) y la regla de que a mayor riesgo se exige mayor rendimiento (se baja <b>diversificando</b>). Para comparar inversiones: período de repago, <b>TIR</b> y <b>valor presente</b>. Fuentes de financiamiento uruguayas: aportes de capital, utilidades no distribuidas, crédito de proveedores, <b>factoring</b>, crédito bancario, <b>leasing</b>, ANII. Análisis con <b>ratios</b> (liquidez, solvencia, rentabilidad, rotación) y el <b>punto de equilibrio</b> (donde no se gana ni se pierde, separando costos fijos de variables).</p>
    <h4>Recursos Humanos (Ulrich, Chiavenato, Robbins)</h4>
    <p>La frase emblema: <b>"nuestra gente es nuestro activo más importante"</b> — el personal como <b>socio</b>, no como costo. La gestión es <b>contingente</b> (Chiavenato: depende de la situación) y es <b>responsabilidad de línea y función de staff</b>. <b>Ulrich</b> define <b>4 roles</b> de RRHH (socio estratégico, experto administrativo, adalid de los empleados, agente de cambio) y <b>8 desafíos</b>. Y hay <b>3 grandes procesos</b> (Robbins-Coulter): <b>planeación</b> (de la que salen la <b>descripción de cargo</b> —las tareas— y la <b>especificación de cargo</b> —las calificaciones mínimas—), <b>orientación</b> (inducción + capacitación) y <b>gestión del desempeño</b>. El reclutamiento atrae candidatos; la <b>selección</b> es un "ejercicio de predicción" y todo instrumento debe tener <b>validez</b> y <b>confiabilidad</b>. Métodos de evaluación: incidentes críticos, escala gráfica, APO y <b>360 grados</b>; y ojo con los <b>5 problemas de Dessler</b> (criterios poco claros, efecto <b>halo</b>, tendencia central, condescendencia/severidad, preferencias/sesgos).</p>
    <h4>Tecnología y Sistemas de Información (Reix, Chiavenato)</h4>
    <p>Estamos en la <b>era de la información</b> (Chiavenato: la 4ª era, donde el recurso clave es el <b>conocimiento</b>). Un <b>sistema de información</b> (Reix) es el conjunto de recursos —hardware, software, personas, datos, procesos— que permite adquirir, tratar, almacenar y comunicar información. Distinción base: el <b>dato</b> es la pieza suelta; la <b>información</b> es el dato con <b>significado</b>. Los sistemas aplicativos se clasifican en <b>operacionales</b> (mucho dato, poco proceso: nómina, facturación), <b>técnicos</b>, <b>gerenciales o estratégicos</b> (apoyan decisiones: <b>MIS</b>) y <b>en red</b>. La herramienta estrella es el <b>ERP</b> (Enterprise Resource Planning): integra toda la empresa en <b>una sola base de datos</b>; sus requisitos son flexibilidad, modularidad, seguridad e integración. Modelos en red: <b>CRM</b> (gestión de la relación con clientes), e-SCM, e-business y comercio electrónico (B2B, B2C, C2C).</p>
    <table>
      <tr><th>Gerencia</th><th>Autor de la cátedra</th><th>Conceptos clave</th></tr>
      <tr><td>Comercial / Marketing</td><td>Kotler · 4P de McCarthy</td><td>Proceso de 5 pasos · segmentación/meta/posicionamiento · 4P · ciclo de vida del producto</td></tr>
      <tr><td>Producción / Operaciones</td><td>Enfoque en procesos · Porter</td><td>Transformación insumos→productos · eficacia/eficiencia/productividad · cadena de valor · UNIT-ISO</td></tr>
      <tr><td>Finanzas</td><td>Van Horne · Pascale</td><td>Inversión vs financiamiento · valor tiempo del dinero · TIR/VP · ratios · punto de equilibrio</td></tr>
      <tr><td>Recursos Humanos</td><td>Ulrich · Chiavenato · Robbins</td><td>4 roles de Ulrich · descripción/especificación de cargo · selección (validez/confiabilidad) · 360° · sesgos de Dessler</td></tr>
      <tr><td>Tecnología y SI</td><td>Reix · Chiavenato</td><td>Era de la información · dato vs información · tipos de SI (MIS) · ERP · CRM/e-business</td></tr>
    </table>
    <div class="key"><span class="tag">Cómo se conecta con P1</span> Cada gerencia aplica el mismo proceso administrativo (planifica, organiza, dirige, controla) pero en su área, y todas dependen entre sí (interdependencia).</div>
  </section>

  <!-- P2-B -->
  <section class="sec" id="a-p2b">
    <h3>2º Parcial · Creación y crecimiento de empresas (Módulo IV)</h3>
    <div class="idea">✓ <b>Idea madre:</b> cómo nace una empresa (el emprendedor detecta una oportunidad y la pone en marcha) y cómo crece con el tiempo.</div>
    <h4>Creación de empresas</h4>
    <p>Arranca con una pregunta provocadora de la cátedra (Martínez): <b>¿el objetivo de la empresa es la rentabilidad?</b> La respuesta del curso es <b>NO</b>: la empresa existe para <b>crear valor y satisfacer necesidades de la sociedad</b>; la rentabilidad llega <b>como consecuencia</b>. La que no agrega valor lo destruye y el mercado la desplaza. El <b>valor lo fija subjetivamente el consumidor</b> (no el producto), poniéndole un precio que el cliente acepta pagando.</p>
    <p>El proceso de creación tiene <b>5 etapas</b> (Comas-Ginesta): identificar oportunidades → desarrollar la idea → desarrollar la oferta → armar el plan de negocio → poner en marcha. La distinción clave es <b>idea ≠ oportunidad</b>: la idea es cualquier ocurrencia; la oportunidad es la que <b>crea más valor que los competidores</b>. Las ideas se generan con técnicas creativas (<b>brainstorming</b>, SCAMPER) y se analizan con herramientas como el <b>Método Walt Disney</b> (soñador-realista-crítico) o los <b>6 sombreros de De Bono</b>; y se validan con el <b>FODA</b> (Debilidades/Fortalezas internas, sobre las que influyo; Oportunidades/Amenazas externas, que solo conozco). El <b>plan de negocios</b> tiene dos partes: un <b>plan estratégico</b> (análisis del mercado, tipo de emprendimiento, producto, localización) y <b>4 planes operativos</b> (de Marketing, de Operaciones, de RRHH y Financiero —este último con proyección de resultados, balance y flujo de caja, y el punto de equilibrio).</p>
    <p>El protagonista es el <b>emprendedor</b>. En la PYME se juntan en una persona el <b>gestor, el propietario y el trabajador</b>. Su éxito se apoya en un <b>"triángulo": saber</b> (conocimientos), <b>querer</b> (actitud/voluntad) y <b>poder</b> (recursos). Ojo con la diferencia <b>emprendedor vs. administrador</b>: el emprendedor está orientado a las <b>oportunidades</b> (usa recursos que no posee, estructura horizontal); el administrador, a los <b>recursos</b> (los posee, jerarquía formal) — el ejemplo del curso es Steve Jobs vs. Sculley en Apple. <b>McClelland</b> identificó las <b>Características Emprendedoras Personales (CEP)</b>. Para financiarse, además de recursos propios y de allegados, hay <b>capital de riesgo</b>: <b>semilla</b> (inicio), <b>de arranque</b> (ya iniciada) y <b>de expansión</b>, más <b>inversores ángeles</b>, <b>crowdfunding</b> e instituciones como <b>ANII</b>.</p>
    <h4>Formas jurídicas en Uruguay</h4>
    <p>Tema bien uruguayo y muy preguntable. La clave es <b>cuánto responde el dueño</b> con su patrimonio: la <b>Empresa Unipersonal</b> y la <b>Sociedad de Hecho</b> tienen responsabilidad <b>ilimitada</b>; la <b>S.A.</b> (capital en acciones) y la <b>S.R.L.</b> tienen responsabilidad <b>limitada</b>. La <b>S.R.L. es la más usada en Uruguay</b>: mezcla lo personal (los socios gestionan, el capital no está en acciones, transferir cuotas necesita aprobación) con lo de capital (responsabilidad limitada). La forma más nueva es la <b>SAS</b> (Ley 19.820, 2019). Y hay figuras especiales: las <b>Cooperativas</b> (Ley 18.407, ej. CONAPROLE) y el <b>Fideicomiso</b> (Ley 17.703: el fideicomitente transfiere bienes al fiduciario para que los administre en beneficio del beneficiario; sirve de garantía o financiamiento).</p>
    <h4>Crecimiento de empresas</h4>
    <p>Una vez en marcha, la empresa atraviesa un <b>ciclo de vida</b>, y la cátedra usa el modelo de <b>Greiner</b>: la empresa crece por <b>etapas</b> y cada una termina en una <b>crisis</b> que hay que resolver para pasar a la siguiente (por eso <b>cada etapa pide otra forma de gestionarla</b>: lo que sirve con 3 personas no sirve con 300). Para crecer hay <b>formas</b>: <b>interna u orgánica</b> (ampliar capacidad propia), <b>externa</b> (fusiones y adquisiciones —F&A—, o <b>alianzas</b> y franquicias). Y hay <b>direcciones</b>: <b>integración vertical</b> (controlar etapas de la cadena, p. ej. comprar a tu proveedor), <b>integración horizontal</b> (sumar competidores del mismo rubro) o <b>diversificación</b>.</p>
    <p>La herramienta estrella es la <b>matriz de Ansoff</b>, que cruza <b>productos</b> (actuales/nuevos) con <b>mercados</b> (actuales/nuevos) y da <b>4 estrategias</b>: <b>penetración de mercado</b> (mismo producto, mismo mercado: vender más a los que ya tengo), <b>desarrollo de mercado</b> (mismo producto, mercado nuevo), <b>desarrollo de producto</b> (producto nuevo, mismo mercado) y <b>diversificación</b> (producto nuevo + mercado nuevo, la más arriesgada).</p>
    <table>
      <tr><th>Matriz de Ansoff</th><th>Mercado actual</th><th>Mercado nuevo</th></tr>
      <tr><td><b>Producto actual</b></td><td>Penetración de mercado</td><td>Desarrollo de mercado</td></tr>
      <tr><td><b>Producto nuevo</b></td><td>Desarrollo de producto</td><td>Diversificación</td></tr>
    </table>
    <div class="trap"><span class="tag">Ojo con la trampa</span> El objetivo de la empresa <b>no</b> es la rentabilidad (es crear valor; la rentabilidad es consecuencia). La <b>S.R.L.</b> es la forma más usada en Uruguay (no la S.A.). Y en la matriz de Ansoff, <b>diversificación</b> = producto nuevo + mercado nuevo (las dos cosas a la vez).</div>
  </section>
