      <text x="295" y="63" fill="#ffc24b" font-size="13">y = L</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">Cuando x → +∞, la curva se <b>arrima</b> a la recta horizontal y = L sin tocarla: esa es la <b>asíntota horizontal</b>.</div>
    </div>

    <h4>📐 Hoja de fórmulas — Unidad 6</h4>
    <div class="formula-grid">
      <div class="fbox"><div class="big">x → +∞ / −∞</div><small>Comportamiento "a lo lejos"</small></div>
      <div class="fbox"><div class="big">∞/∞ → término de mayor grado</div><small>Cociente de polinomios: domina la mayor potencia</small></div>
      <div class="fbox"><div class="big">eˣ ≫ xⁿ ≫ L x</div><small>Órdenes de infinito: gana el más fuerte</small></div>
      <div class="fbox"><div class="big">tiende a L → asíntota horizontal y = L</div><small>Si el límite es un número finito</small></div>
    </div>

    <h4>Ejercicios resueltos de esta unidad (de fácil a difícil)</h4>
    <details class="ex" open><summary>① Básico · ∞/∞ con polinomios del mismo grado</summary>
      <div class="body">
        <p><b>Letra:</b> Calculá lím_(x→+∞) (3x² + 2x)/(x² − 5).</p>
        <ol class="steps">
          <li>Es ∞/∞. Me quedo con el término de mayor grado arriba y abajo: 3x² / x².</li>
          <li>Simplifico: 3x²/x² = 3. Resultado: <b>3</b> (asíntota horizontal y = 3).</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>② Medio · ∞/∞ con grados distintos</summary>
      <div class="body">
        <p><b>Letra:</b> Calculá (a) lím_(x→+∞) (2x + 1)/(x² + 3) y (b) lím_(x→+∞) (x³ + 1)/(x + 2).</p>
        <ol class="steps">
          <li>(a) Mayor grado: 2x / x² = 2/x → cuando x→+∞, tiende a <b>0</b> (gana el de abajo).</li>
          <li>(b) Mayor grado: x³ / x = x² → cuando x→+∞, tiende a <b>+∞</b> (gana el de arriba).</li>
          <li>Regla rápida: si el de arriba tiene grado menor → 0; mayor → ±∞; igual → cociente de coeficientes.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>③ Difícil (tipo revisión) · Órdenes de infinito: x²/eˣ</summary>
      <div class="body">
        <p><b>Letra:</b> Sea f(x) = x²/eˣ. Calculá lím_(x→+∞) f(x) y lím_(x→−∞) f(x). (Este tipo cayó en julio 2025.)</p>
        <ol class="steps">
          <li><b>x→+∞:</b> arriba x² (un "auto"), abajo eˣ (un "cohete"). Gana el cohete → el denominador es mucho más grande → f(x) → <b>0</b>.</li>
          <li><b>x→−∞:</b> x² → +∞ (positivo), y eˣ → 0⁺ (muy chiquito positivo). Entonces +∞ / 0⁺ → <b>+∞</b>.</li>
          <li>Moraleja: la exponencial le gana a cualquier potencia cuando x→+∞.</li>
        </ol>
      </div>
    </details>
  </section>

  <!-- CONTINUIDAD -->
  <section class="sec" id="c-cont">
    <h3>Unidad 7 · Continuidad (Cap. 7)</h3>

    <h4>¿Por qué me importa la continuidad?</h4>
    <p>"Continua" es la versión formal de algo intuitivo: que la función <b>no se corta ni pega saltos</b>. Me importa por dos motivos. Primero, es justo la propiedad que hace que <b>sustituir funcione</b> para calcular límites (en una función continua, "hacia dónde se acerca" = "lo que vale"). Segundo, es el <b>requisito</b> de los dos teoremas más útiles del capítulo (Bolzano y Weierstrass), que dan puntos casi seguros en el parcial.</p>
    <div class="eli"><span class="tag">ELI5</span> Una función continua la dibujo <b>sin levantar el lápiz</b>. Si para dibujarla tengo que levantar la birome (porque hay un agujero o un salto), ahí hay una <b>discontinuidad</b>.</div>

    <h4>La definición formal: 3 condiciones (y por qué cada una)</h4>
    <p>f es continua en el punto a <b>si y solo si</b> se cumplen las tres a la vez:</p>
    <table>
      <tr><th>Condición</th><th>Qué pide</th><th>Qué pasa si falla</th></tr>
      <tr><td>1) Existe f(a)</td><td>La función está definida en a (tiene un valor ahí)</td><td>Hay un <b>agujero</b>: ni siquiera hay punto</td></tr>
      <tr><td>2) Existe lím_(x→a) f(x)</td><td>Los dos límites laterales existen y coinciden</td><td>Hay un <b>salto</b> (por izquierda va a un lado, por derecha a otro)</td></tr>
      <tr><td>3) lím_(x→a) f(x) = f(a)</td><td>Hacia dónde se acerca = lo que realmente vale</td><td>El punto está "<b>despegado</b>" del resto de la curva</td></tr>
    </table>
    <p>En criollo: <b>la función tiene que valer algo en a, tiene que acercarse a algo, y esos dos algos tienen que ser el mismo</b>. Si las tres se cumplen, no hay corte.</p>

    <h4>Tipos de discontinuidad</h4>
    <table>
      <tr><th>Tipo</th><th>Qué pasa</th></tr>
      <tr><td>Evitable (un agujero)</td><td>El límite existe, pero falta el punto o está corrido. Se "arregla" rellenando el huequito.</td></tr>
      <tr><td>De salto</td><td>Los laterales existen pero dan distinto: la curva pega un salto. No se arregla.</td></tr>
    </table>

    <h4>Los dos teoremas estrella</h4>
    <p><b>Teorema de Bolzano.</b> Si f es continua en un intervalo cerrado [a, b] y en los extremos tiene <b>signos opuestos</b> (uno positivo y otro negativo, es decir f(a)·f(b) &lt; 0), entonces seguro <b>cruza el cero</b> en algún punto de adentro: tiene <b>al menos una raíz</b> en (a, b).</p>
    <div class="eli"><span class="tag">ELI5 de Bolzano</span> Si salís de abajo del agua y terminás arriba del agua, y nunca te teletransportaste (sos continuo), en algún momento <b>tuviste que cruzar la superficie</b>. Ese cruce es la raíz.</div>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="40" y1="12" x2="40" y2="185" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="14" y1="100" x2="346" y2="100" stroke="#7a8499" stroke-width="1.5"/>
      <text x="20" y="114" fill="#aab4c8" font-size="11">y=0</text>
      <path d="M 60 165 Q 190 97 300 40" fill="none" stroke="#6c8cff" stroke-width="2.5"/>
      <circle cx="60" cy="165" r="4.5" fill="#ff6b6b"/>
      <circle cx="300" cy="40" r="4.5" fill="#36d399"/>
      <text x="52" y="182" fill="#aab4c8" font-size="13">a</text>
      <text x="296" y="34" fill="#aab4c8" font-size="13">b</text>
      <text x="14" y="172" fill="#ff6b6b" font-size="11">f(a)&lt;0</text>
      <text x="305" y="46" fill="#36d399" font-size="11">f(b)&gt;0</text>
      <circle cx="185" cy="100" r="5" fill="#ffc24b"/>
      <text x="192" y="92" fill="#ffc24b" font-size="12">raíz</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">f(a) está <b>debajo</b> del eje (negativa) y f(b) <b>encima</b> (positiva). Como es continua, en algún punto de (a,b) <b>cruza el cero</b>: ahí hay una raíz.</div>
    </div>
    <p><b>Teorema de Weierstrass.</b> Si f es continua en un intervalo <b>cerrado</b> [a, b], entonces alcanza un <b>máximo y un mínimo absolutos</b> ahí dentro (hay un punto más alto y uno más bajo, no se escapa al infinito ni queda "sin tope"). Esto es lo que garantiza que los problemas de optimización <b>tengan solución</b>.</p>
    <div class="trap"><span class="tag">Ojo con la trampa</span> Los dos teoremas exigen <b>continuidad</b> en el intervalo <b>cerrado</b> [a, b] (con los extremos incluidos). Si la función se corta, o el intervalo es abierto, el teorema <b>no aplica</b> aunque parezca que sí.</div>

    <h4>Cómo se ve una discontinuidad de salto</h4>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="40" y1="12" x2="40" y2="180" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="14" y1="160" x2="346" y2="160" stroke="#7a8499" stroke-width="1.5"/>
      <text x="349" y="165" fill="#aab4c8" font-size="13">x</text>
      <line x1="50" y1="130" x2="180" y2="95" stroke="#6c8cff" stroke-width="2.5"/>
      <circle cx="180" cy="95" r="4.5" fill="#6c8cff"/>
      <line x1="180" y1="55" x2="320" y2="40" stroke="#6c8cff" stroke-width="2.5"/>
      <circle cx="180" cy="55" r="5" fill="#161d2e" stroke="#6c8cff" stroke-width="2.5"/>
      <line x1="180" y1="55" x2="180" y2="160" stroke="#7a8499" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="175" y="177" fill="#aab4c8" font-size="13">a</text>
      <text x="193" y="80" fill="#ff6b6b" font-size="12">¡salto!</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">En x = a la función pega un <b>salto</b>: el límite por izquierda y por derecha dan distinto, así que no es continua (tendría que poder dibujarse sin levantar el lápiz).</div>
    </div>

    <h4>📐 Hoja de fórmulas — Unidad 7</h4>
    <div class="formula-grid">
      <div class="fbox"><div class="big">Continua en a ⟺ existe f(a) · existe lím · son iguales</div><small>Las 3 condiciones juntas</small></div>
      <div class="fbox"><div class="big">Bolzano</div><small>f continua en [a,b] y f(a)·f(b)&lt;0 → hay una raíz en (a,b)</small></div>
      <div class="fbox"><div class="big">Weierstrass</div><small>f continua en [a,b] → alcanza máximo y mínimo absolutos</small></div>
      <div class="fbox"><div class="big">Derivable ⟹ continua</div><small>(pero continua NO implica derivable)</small></div>
    </div>

    <h4>Ejercicios resueltos de esta unidad (de fácil a difícil)</h4>
    <details class="ex" open><summary>① Básico · ¿Es continua? (chequear las 3 condiciones)</summary>
      <div class="body">
        <p><b>Letra:</b> Sea f(x) = (x² − 1)/(x − 1) para x ≠ 1, y f(1) = 5. ¿Es continua en x = 1?</p>
        <ol class="steps">
          <li>Existe f(1) = 5 ✓ (condición 1).</li>
          <li>Límite: (x²−1)/(x−1) = (x−1)(x+1)/(x−1) = x+1 → lím_(x→1) = 2 ✓ (condición 2).</li>
          <li>¿Coinciden? lím = 2 pero f(1) = 5 → <b>2 ≠ 5</b>, no coinciden → <b>NO es continua</b> (el punto está "despegado").</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>② Medio (tipo revisión) · Hallar el parámetro para que sea continua</summary>
      <div class="body">
        <p><b>Letra:</b> Sea f(x) = { 2x + 1 si x &lt; 1 ; x² + a si x ≥ 1 }. ¿Qué valor de a hace que f sea continua en x = 1?</p>
        <ol class="steps">
          <li>Para que sea continua, los dos pedazos tienen que "pegar" en x=1: el límite por izquierda = el valor por derecha.</li>
          <li>Por izquierda (2x+1): 2·1 + 1 = 3. Por derecha (x²+a): 1 + a.</li>
          <li>Igualo: 3 = 1 + a → <b>a = 2</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>③ Medio · Usar Bolzano para garantizar una raíz</summary>
      <div class="body">
        <p><b>Letra:</b> Mostrá que f(x) = x³ + x − 1 tiene una raíz en (0, 1).</p>
        <ol class="steps">
          <li>f es un polinomio → es continua en el cerrado [0, 1].</li>
          <li>Evalúo los extremos: f(0) = −1 (negativo) y f(1) = 1 (positivo) → cambia de signo.</li>
          <li>Por <b>Bolzano</b>, como es continua y cambia de signo, existe al menos una raíz en (0, 1). ✓</li>
        </ol>
      </div>
    </details>
  </section>

  <!-- DERIVADAS -->
  <section class="sec" id="c-der">
    <h3>Unidad 8 · Derivabilidad (Cap. 8)</h3>

    <h4>Lo macro: ¿qué problema vino a resolver la derivada?</h4>
    <p>Sé sacar la <b>pendiente de una recta</b> (cuánto sube por cada paso que avanzo): tomo dos puntos y hago "subida sobre avance". Pero, ¿y si la curva no es una recta? La pendiente cambia en cada punto. La pregunta difícil es: <b>¿cuál es la pendiente en UN solo punto?</b> Para una recta entre dos puntos es fácil; para "un punto solo" no tengo con qué compararlo. La derivada es la herramienta que resuelve justo eso, y de paso me dice la <b>velocidad de cambio instantánea</b> de la función (cuán rápido sube o baja ahí).</p>
    <div class="eli"><span class="tag">ELI5</span> Es el velocímetro de la función. El cuentakilómetros te dice cuánto recorriste (la función); el velocímetro te dice qué tan rápido vas <b>en este instante</b> (la derivada). Positiva = subiendo, negativa = bajando.</div>

    <h4>Construyo la definición desde cero</h4>
    <p>Quiero la pendiente en el punto a. Como con un solo punto no puedo, hago una trampa inteligente: tomo <b>otro punto x cercano</b> y calculo la pendiente de la recta que une los dos (se llama <b>recta secante</b>). Esa pendiente entre dos puntos es el <b>cociente incremental</b>:</p>
    <div class="fbox"><div class="big">Δf / Δx = (f(x) − f(a)) / (x − a)</div><small>"subida" sobre "avance" entre a y x. (Δ se lee "delta" = variación, cuánto cambió.)</small></div>
    <p>Ahora la idea genial: <b>acerco x cada vez más a a</b>. La recta secante se va "apoyando" sobre la curva hasta convertirse en la <b>recta tangente</b> (la que tiene la <b>misma inclinación que la curva en ese punto</b> y la mejor aproxima ahí cerca). "Acercar x a a" ya sé hacerlo: es un <b>límite</b>. Por eso la derivada es el límite del cociente incremental:</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">f ′(a) = lím_(x→a) (f(x)−f(a))/(x−a)</div><small>Definición. Se lee "f prima de a"</small></div>
      <div class="fbox"><div class="big">f ′(a) = lím_(h→0) (f(a+h)−f(a))/h</div><small>La misma, llamando h = x−a (h→0 = acercar)</small></div>
    </div>
    <p>Las dos fórmulas son lo mismo escrito distinto: en la segunda llamo <b>h</b> a la distancia entre los puntos, y "acercar x a a" es "hacer h→0". Se simboliza <span class="fml">f ′(a)</span> o <span class="fml">df/dx</span>. <b>Acá se ve por qué primero hay que entender límites:</b> la derivada ES un límite.</p>

    <h4>Qué significa geométricamente y la recta tangente</h4>
    <p>f ′(a) es la <b>pendiente de la recta tangente</b> en el punto (a, f(a)). Y como ya tengo un punto y una pendiente, puedo escribir esa recta con la fórmula de la recta que vi en el 1er parcial (y = f(a) + pendiente·(x − a)):</p>
    <div class="key"><span class="tag">Recta tangente en a</span> <span class="fml">y = f(a) + f ′(a)·(x − a)</span></div>

    <h4>Una relación importante: derivable ⟹ continua (pero no al revés)</h4>
    <p>Si una función es <b>derivable</b> en un punto (tiene tangente bien definida), entonces seguro es <b>continua</b> ahí (no se corta). Pero al revés <b>no</b> siempre: una función puede ser continua y aún así no tener derivada. El ejemplo clásico es <span class="fml">|x|</span> (valor absoluto) en x = 0: no se corta, pero hace un <b>pico</b>, y en un pico no hay una única pendiente (por izquierda baja, por derecha sube). Sin pendiente única, no hay derivada.</p>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="180" y1="12" x2="180" y2="180" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="20" y1="150" x2="342" y2="150" stroke="#7a8499" stroke-width="1.5"/>
      <text x="345" y="155" fill="#aab4c8" font-size="13">x</text>
      <line x1="80" y1="50" x2="180" y2="150" stroke="#6c8cff" stroke-width="2.5"/>
      <line x1="180" y1="150" x2="280" y2="50" stroke="#6c8cff" stroke-width="2.5"/>
      <circle cx="180" cy="150" r="5" fill="#161d2e" stroke="#ff6b6b" stroke-width="2.5"/>
      <text x="90" y="46" fill="#6c8cff" font-size="13">y = |x|</text>
      <text x="190" y="140" fill="#ff6b6b" font-size="12">pico en x=0</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">En el <b>pico</b> (x=0) la curva no se corta (es <b>continua</b>) pero cambia de pendiente de golpe: por izquierda baja, por derecha sube. No hay una única tangente → <b>no es derivable</b> ahí. Por eso continua no implica derivable.</div>
    </div>

    <h4>La tabla de derivadas (atajos que evitan hacer el límite cada vez)</h4>
    <p>Calcular la derivada con el límite siempre sería lentísimo. Por suerte, aplicando esa definición una vez a cada función "básica", salen fórmulas listas para usar. Esta tabla es eso: el resultado de hacer el límite, ya resuelto. Me la aprendo de memoria (el parcial es sin material).</p>
    <table>
      <tr><th>f(x)</th><th>f ′(x)</th><th>En palabras</th></tr>
      <tr><td>k (constante)</td><td>0</td><td>algo que no cambia no tiene pendiente</td></tr>
      <tr><td>xⁿ</td><td>n·xⁿ⁻¹</td><td>"bajo el exponente y le resto 1" (ej: x³ → 3x²)</td></tr>
      <tr><td>eˣ</td><td>eˣ</td><td>la única que es su propia derivada</td></tr>
      <tr><td>aˣ</td><td>aˣ·ln a</td><td>exponencial de base a</td></tr>
      <tr><td>ln x</td><td>1/x</td><td>logaritmo natural</td></tr>
      <tr><td>√x</td><td>1/(2√x)</td><td>(es xⁿ con n = ½, sale de la regla de la potencia)</td></tr>
    </table>

    <h4>Reglas de derivación (cómo combinar las básicas) y de dónde salen</h4>
    <p>Las funciones de verdad son combinaciones de las básicas (sumas, productos, etc.). Estas reglas dicen cómo derivar esas combinaciones:</p>
    <table>
      <tr><th>Si la función es…</th><th>Su derivada es…</th><th>Idea de por qué</th></tr>
      <tr><td>Suma/resta: f ± g</td><td>f ′ ± g′</td><td>la variación del total es la suma de las variaciones: derivo cada una</td></tr>
      <tr><td>Constante por función: k·f</td><td>k·f ′</td><td>multiplicar por k estira todo k veces, también la pendiente</td></tr>
      <tr><td>Producto: f·g</td><td>f ′·g + f·g′</td><td>cambian los dos factores: aporta el cambio de uno por el otro, y viceversa</td></tr>
      <tr><td>Cociente: f/g</td><td>(f ′·g − f·g′) / g²</td><td>parecida al producto, pero con un menos y dividido g²</td></tr>
      <tr><td><b>Cadena: f(g(x))</b></td><td>f ′(g(x))·g′(x)</td><td>función "adentro de" otra: derivo la de afuera y multiplico por la derivada de la de adentro</td></tr>
    </table>
    <div class="eli"><span class="tag">ELI5 de la cadena</span> Si tengo "una caja dentro de otra caja", derivo la de afuera dejando la de adentro quieta, y después multiplico por la derivada de la de adentro. Como pelar una cebolla: una capa a la vez.</div>
    <div class="trap"><span class="tag">Ojo con la trampa</span> La del producto <b>no</b> es f ′·g′. La del cociente lleva <b>menos</b> en el medio y g² abajo (y el orden importa por el menos). Y la cadena se olvida muy fácil: nunca te olvides de multiplicar por la derivada de lo de adentro. (También hay ejercicios en la pestaña <b>Ejercicios</b>.)</div>

    <h4>La derivada es la pendiente de la recta tangente</h4>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="40" y1="12" x2="40" y2="180" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="14" y1="170" x2="346" y2="170" stroke="#7a8499" stroke-width="1.5"/>
      <text x="349" y="175" fill="#aab4c8" font-size="13">x</text>
      <path d="M 70 45 Q 185 205 305 45" fill="none" stroke="#6c8cff" stroke-width="2.5"/>
      <line x1="185" y1="150" x2="335" y2="40" stroke="#ffc24b" stroke-width="2"/>
      <circle cx="255" cy="97" r="4.5" fill="#36d399"/>
      <text x="200" y="112" fill="#36d399" font-size="12">(a, f(a))</text>
      <text x="248" y="34" fill="#ffc24b" font-size="12">recta tangente</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">La derivada <b>f ′(a)</b> es la <b>pendiente de la recta tangente</b> a la curva en el punto (a, f(a)).</div>
    </div>

    <h4>📐 Hoja de fórmulas — Unidad 8</h4>
    <div class="formula-grid">
      <div class="fbox"><div class="big">f ′(a) = lím_(h→0) (f(a+h)−f(a))/h</div><small>Definición</small></div>
      <div class="fbox"><div class="big">y = f(a) + f ′(a)(x−a)</div><small>Recta tangente en a</small></div>
      <div class="fbox"><div class="big">(xⁿ)′=n·xⁿ⁻¹ · (eˣ)′=eˣ · (L x)′=1/x</div><small>Tabla básica (L = ln)</small></div>
      <div class="fbox"><div class="big">(f·g)′ = f ′g + fg′</div><small>Producto</small></div>
      <div class="fbox"><div class="big">(f/g)′ = (f ′g − fg′)/g²</div><small>Cociente</small></div>
      <div class="fbox"><div class="big">(f(g(x)))′ = f ′(g(x))·g′(x)</div><small>Regla de la cadena</small></div>
    </div>

    <h4>Ejercicios resueltos de esta unidad (de fácil a difícil)</h4>
    <details class="ex" open><summary>① Básico · Derivar un polinomio</summary>
      <div class="body">
        <p><b>Letra:</b> Derivá f(x) = 2x³ − 5x² + 7x − 29.</p>
        <ol class="steps">
          <li>Derivo término a término con (xⁿ)′ = n·xⁿ⁻¹: (2x³)′=6x², (−5x²)′=−10x, (7x)′=7, (−29)′=0.</li>
          <li>f ′(x) = <b>6x² − 10x + 7</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>② Medio (tipo revisión) · Producto + cadena: eˣ·L(3x²)</summary>
      <div class="body">
        <p><b>Letra:</b> Derivá f(x) = eˣ·L(3x²). (Recordá: L = ln.)</p>
        <ol class="steps">
          <li>Es un <b>producto</b> de eˣ y L(3x²): aplico (f·g)′ = f ′g + fg′.</li>
          <li>(eˣ)′ = eˣ. Para (L(3x²))′ uso la <b>cadena</b>: (1/(3x²))·(3x²)′ = (1/(3x²))·6x = 2/x.</li>
          <li>f ′(x) = eˣ·L(3x²) + eˣ·(2/x) = <b>eˣ·L(3x²) + 2eˣ/x</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>③ Difícil (tipo revisión) · Cadena compuesta: F(x) = (f(x))³ + f(x³)</summary>
      <div class="body">
        <p><b>Letra:</b> Sea f derivable con f(1) = 2 y f ′(1) = 3. Para F(x) = (f(x))³ + f(x³), hallá F ′(1). (Este tipo cayó casi igual en 2023 y 2025.)</p>
        <ol class="steps">
          <li>Derivo con la cadena cada término: el primero, 3(f(x))²·f ′(x); el segundo, f ′(x³)·(3x²).</li>
          <li>F ′(x) = 3(f(x))²·f ′(x) + f ′(x³)·3x².</li>
          <li>En x=1: 3·(f(1))²·f ′(1) + f ′(1)·3 = 3·(2²)·3 + 3·3 = 36 + 9 = <b>45</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>④ Medio (tipo revisión) · Recta tangente "al revés"</summary>
      <div class="body">
        <p><b>Letra:</b> La recta y = 3x + 4 es tangente a la gráfica de f en el punto (1, f(1)). ¿Cuánto valen f(1) y f ′(1)?</p>
        <ol class="steps">
          <li>La tangente en a=1 es y = f(1) + f ′(1)(x − 1). Su <b>pendiente</b> es f ′(1).</li>
          <li>La recta dada tiene pendiente 3 → <b>f ′(1) = 3</b>.</li>
          <li>El punto de tangencia está sobre la recta: f(1) = 3·1 + 4 = <b>7</b>. Entonces f(1)=7, f ′(1)=3.</li>
        </ol>
      </div>
    </details>
  </section>

  <!-- OPTIMIZACIÓN -->
  <section class="sec" id="c-opt">
    <h3>Unidad 9 · Variación y optimización (Cap. 9)</h3>

    <h4>Por qué esta es la parte que paga todo lo anterior</h4>
    <p>Acá llega el premio de haber aprendido derivadas. "Optimizar" es <b>encontrar lo mejor</b>: la cantidad que da la <b>máxima</b> utilidad, el precio que da el <b>máximo</b> ingreso, las dimensiones de <b>mínimo</b> costo. Y resulta que la derivada es la herramienta perfecta para esto, porque me dice exactamente dónde la función sube, dónde baja y dónde llega a su tope.</p>

    <h4>El signo de la derivada me dice si sube o baja</h4>
    <p>Ya vimos que f ′ es la pendiente. Entonces es directo: si la pendiente es positiva, la función va para arriba; si es negativa, va para abajo.</p>
    <table>
      <tr><th>Si en un tramo…</th><th>Entonces f…</th><th>Por qué</th></tr>
      <tr><td>f ′(x) &gt; 0</td><td>crece (sube)</td><td>pendiente positiva = va hacia arriba</td></tr>
      <tr><td>f ′(x) &lt; 0</td><td>decrece (baja)</td><td>pendiente negativa = va hacia abajo</td></tr>
    </table>

    <h4>Los puntos críticos: donde la función "se da vuelta"</h4>
    <p>Pensá en una montaña: justo en la <b>cima</b>, por un instante no subís ni bajás, estás <b>plano</b>. Eso quiere decir que en un máximo (o un mínimo) la pendiente es <b>cero</b>: la recta tangente es horizontal. Por eso, los candidatos a máximo/mínimo son los <b>puntos críticos</b>: donde <span class="fml">f ′(x) = 0</span>.</p>
    <p>Pero "f ′ = 0" sola no me dice si es cima o valle (los dos son planos arriba). Para distinguirlos miro <b>cómo cambia el signo de f ′ alrededor</b>:</p>
    <table>
      <tr><th>En el punto crítico a…</th><th>Es un…</th><th>Imagen</th></tr>
      <tr><td>f ′ pasa de <b>+</b> a <b>−</b></td><td><b>máximo</b></td><td>venía subiendo y empieza a bajar = cima ⛰️</td></tr>
      <tr><td>f ′ pasa de <b>−</b> a <b>+</b></td><td><b>mínimo</b></td><td>venía bajando y empieza a subir = valle 🏞️</td></tr>
    </table>
    <div class="eli"><span class="tag">ELI5</span> El velocímetro (f ′) en una cima marca cero justo en la punta: venías acelerando hacia arriba (+) y arrancás a bajar (−). Ese cambio de + a − es la firma de un máximo.</div>

    <h4>Procedimiento completo de optimización (lo aplico siempre igual)</h4>
    <ol class="steps">
      <li>Escribo la <b>función</b> a optimizar y su <b>dominio</b> (en economía suele ser x ≥ 0). Si el problema viene con texto, primero traduzco: defino variables y armo la función.</li>
      <li><b>Derivo</b> e igualo a cero: f ′(x) = 0 → me da los <b>puntos críticos</b> (los candidatos).</li>
      <li>Estudio el <b>signo de f ′</b> antes y después de cada crítico para <b>clasificar</b> (máx o mín).</li>
      <li>Reviso también los <b>extremos del dominio</b>: a veces el mejor valor está en el borde, no en un crítico.</li>
      <li><b>Interpreto</b> en contexto: "la cantidad óptima es…", "la utilidad máxima es…".</li>
    </ol>
    <div class="trap"><span class="tag">Ojo con la trampa</span> Encontrar f ′(a)=0 <b>no alcanza</b>: hay que <b>clasificarlo</b> con el signo de f ′ y mirar el dominio. Un crítico puede ser un mínimo cuando yo buscaba un máximo, o el óptimo real puede estar en un borde.</div>

    <h4>Elasticidad de la demanda (9.3): una aplicación estrella</h4>
    <p>La <b>elasticidad</b> mide qué tan sensible es la cantidad que la gente compra (la demanda) a un cambio del precio. Es clave para una pregunta económica concreta: <i>si subo un poco el precio, ¿mi ingreso total sube o baja?</i></p>
    <p>De dónde sale: el ingreso es <span class="fml">I(p) = p·D(p)</span> (precio por cantidad vendida). Para ver si sube o baja al subir el precio, derivo (¡otra vez la derivada!) usando la regla del producto: <span class="fml">I′(p) = D(p) + p·D′(p)</span>. Estudiando el signo de eso, el curso define la elasticidad como:</p>
    <div class="key"><span class="tag">Definición del curso</span> <span class="fml">η(p) = − p·D′(p) / D(p)</span> &nbsp;(el signo menos es para que dé positiva, ya que D′&lt;0: si sube el precio, baja la cantidad).</div>
    <table>
      <tr><th>Si η(p)…</th><th>La demanda es…</th><th>Si subo levemente el precio, el ingreso…</th></tr>
      <tr><td>&gt; 1</td><td>elástica (muy sensible)</td><td><b>baja</b> (la gente compra mucho menos)</td></tr>
      <tr><td>= 1</td><td>unitaria</td><td>el ingreso tiene un punto crítico (I′=0): para la demanda típica, su <b>máximo</b></td></tr>
      <tr><td>&lt; 1</td><td>inelástica (poco sensible)</td><td><b>sube</b> (la cantidad casi no cae)</td></tr>
    </table>
    <div class="eli"><span class="tag">ELI5</span> Si vendés algo que la gente <b>necesita sí o sí</b> (inelástico, como el pan), podés subir el precio y casi no te compran menos → ganás más. Si vendés algo <b>prescindible</b> (elástico, como un lujo), subís el precio y se te van los clientes → ganás menos.</div>
    <div class="key"><span class="tag">Ejemplo del manual</span> D(p)=3000−30p → η(p)= p/(100−p). En p=20: η=¼ &lt;1 (inelástica → subir precio sube ingreso). En p=60: η=3/2 &gt;1 (elástica → subir precio baja ingreso). (Cálculo completo más abajo.)</div>

    <h4>En un máximo, la pendiente es cero</h4>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="40" y1="12" x2="40" y2="180" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="14" y1="170" x2="346" y2="170" stroke="#7a8499" stroke-width="1.5"/>
      <text x="349" y="175" fill="#aab4c8" font-size="13">x</text>
      <path d="M 55 155 Q 180 -5 305 155" fill="none" stroke="#6c8cff" stroke-width="2.5"/>
      <line x1="120" y1="73" x2="240" y2="73" stroke="#ffc24b" stroke-width="1.8" stroke-dasharray="5 4"/>
      <circle cx="180" cy="73" r="4.5" fill="#ffc24b"/>
      <text x="150" y="60" fill="#ffc24b" font-size="12">f ′ = 0 (máximo)</text>
      <text x="78" y="120" fill="#36d399" font-size="13">f ′&gt;0</text>
      <text x="262" y="120" fill="#ff6b6b" font-size="13">f ′&lt;0</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">En el máximo la pendiente es <b>0</b> (tangente horizontal). f ′ pasa de <b>+</b> (subiendo) a <b>−</b> (bajando): esa es la firma de un máximo.</div>
    </div>

    <h4>📐 Hoja de fórmulas — Unidad 9</h4>
    <div class="formula-grid">
      <div class="fbox"><div class="big">f ′&gt;0 crece · f ′&lt;0 decrece</div><small>El signo de la derivada</small></div>
      <div class="fbox"><div class="big">f ′(a) = 0 → punto crítico</div><small>Candidato a máximo o mínimo</small></div>
      <div class="fbox"><div class="big">+ a − = máximo · − a + = mínimo</div><small>Clasifico por el cambio de signo de f ′</small></div>
      <div class="fbox"><div class="big">En [a,b]: comparo críticos y extremos</div><small>El óptimo puede estar en un borde</small></div>
      <div class="fbox"><div class="big">η(p) = − p·D′(p)/D(p)</div><small>Elasticidad de la demanda</small></div>
    </div>

    <h4>Ejercicios resueltos de esta unidad (de fácil a difícil)</h4>
    <details class="ex" open><summary>① Básico · ¿Dónde crece y dónde decrece?</summary>
      <div class="body">
        <p><b>Letra:</b> Estudiá el crecimiento de f(x) = x³ − 3x.</p>
        <ol class="steps">
          <li>Derivo: f ′(x) = 3x² − 3 = 3(x − 1)(x + 1). Puntos críticos: x = 1 y x = −1.</li>
          <li>Signo de f ′: positiva para x &lt; −1 (crece), negativa entre −1 y 1 (decrece), positiva para x &gt; 1 (crece).</li>
          <li>Entonces hay un <b>máximo relativo en x = −1</b> (+ a −) y un <b>mínimo relativo en x = 1</b> (− a +).</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>② Medio · Optimización: utilidad máxima</summary>
      <div class="body">
        <p><b>Letra:</b> La utilidad es U(x) = −x² + 40x − 100. ¿Qué cantidad la maximiza?</p>
        <ol class="steps">
          <li>Derivo e igualo a 0: U ′(x) = −2x + 40 = 0 → x = 20.</li>
          <li>U ′ pasa de + a − en x=20 → es <b>máximo</b>.</li>
          <li>Utilidad máxima: U(20) = −400 + 800 − 100 = <b>300</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>③ Difícil (tipo revisión) · Mínimo absoluto en un intervalo cerrado</summary>
      <div class="body">
        <p><b>Letra:</b> Hallá el mínimo absoluto de f(x) = x⁴ − 4x − 1 en [2, 3]. (Cayó en julio 2025.)</p>
        <ol class="steps">
          <li>Busco críticos: f ′(x) = 4x³ − 4 = 0 → x³ = 1 → x = 1. <b>No está en [2,3]</b>, así que no hay críticos adentro.</li>
          <li>Como no hay críticos internos, el mínimo está en un <b>extremo</b>. Evalúo: f(2) = 16 − 8 − 1 = 7; f(3) = 81 − 12 − 1 = 68.</li>
          <li>El menor es <b>m = 7</b> (en x = 2).</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>④ Medio (tipo revisión) · Máximo y mínimo relativos de un cúbico</summary>
      <div class="body">
        <p><b>Letra:</b> Para f(x) = 3x³ − 9x² + 4: ¿cuántas soluciones tiene f ′(x)=0 y qué extremos hay?</p>
        <ol class="steps">
          <li>f ′(x) = 9x² − 18x = 9x(x − 2) = 0 → x = 0 y x = 2: <b>dos soluciones</b>.</li>
          <li>Signo de f ′: + para x&lt;0, − entre 0 y 2, + para x&gt;2.</li>
          <li>En x=0 pasa de + a − → <b>máximo relativo</b>; en x=2 pasa de − a + → <b>mínimo relativo</b>. (Hay máx y mín.)</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>⑤ Aplicado · Elasticidad de la demanda</summary>
      <div class="body">
        <p><b>Letra:</b> La demanda es D(p) = 3000 − 30p. Calculá la elasticidad en p = 20 y p = 60 e interpretá.</p>
        <ol class="steps">
          <li>D ′(p) = −30. Elasticidad: η(p) = −p·D′(p)/D(p) = 30p/(3000 − 30p) = <b>p/(100 − p)</b>.</li>
          <li>En p=20: η = 20/80 = <b>¼ &lt; 1 → inelástica</b> (subir el precio sube el ingreso).</li>
          <li>En p=60: η = 60/40 = <b>3/2 &gt; 1 → elástica</b> (subir el precio baja el ingreso).</li>
        </ol>
      </div>
    </details>
  </section>

  <!-- FÓRMULAS -->
  <section class="sec" id="c-fml">
    <h3>Hoja de ecuaciones de TODO Cálculo</h3>
    <p>Acá junté <b>todas</b> las fórmulas de las 9 unidades, en orden. El parcial es sin material, así que esta es la hoja que tengo que tener en la cabeza. La uso como repaso final: si miro una fórmula y no me acuerdo de dónde sale, vuelvo a la unidad.</p>

    <h4>1er Parcial · Funciones</h4>
    <p style="color:var(--accent);font-weight:700;margin:6px 0">Unidad 1 — Lineales</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">y = m·x + n</div><small>Recta. m = pendiente, n = corte con eje y</small></div>
      <div class="fbox"><div class="big">m = (y₂−y₁)/(x₂−x₁)</div><small>Pendiente con dos puntos</small></div>
      <div class="fbox"><div class="big">CT = CF + cv·x · I = p·x · U = I − CT</div><small>Costo, ingreso, utilidad</small></div>
      <div class="fbox"><div class="big">U = 0 (equilibrio) · Qd = Qs (mercado)</div><small>Punto de equilibrio</small></div>
    </div>
    <p style="color:var(--accent);font-weight:700;margin:6px 0">Unidad 2 — Cuadráticas</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">y = ax² + bx + c</div><small>Parábola</small></div>
      <div class="fbox"><div class="big">Δ = b² − 4ac</div><small>Δ&gt;0: 2 raíces · =0: 1 · &lt;0: ninguna</small></div>
      <div class="fbox"><div class="big">x = (−b ± √Δ) / 2a</div><small>Raíces (Bhaskara)</small></div>
      <div class="fbox"><div class="big">x_v = −b/2a</div><small>Vértice. a&gt;0 mínimo · a&lt;0 máximo</small></div>
    </div>
    <p style="color:var(--accent);font-weight:700;margin:6px 0">Unidad 3 — Más sobre funciones</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">Dominio: denom ≠ 0 · radicando ≥ 0</div><small>Las dos prohibiciones</small></div>
      <div class="fbox"><div class="big">(f∘g)(x) = f(g(x))</div><small>Composición (primero g, después f)</small></div>
      <div class="fbox"><div class="big">|x| = x si x≥0 · −x si x&lt;0</div><small>Valor absoluto (por tramos)</small></div>
    </div>
    <p style="color:var(--accent);font-weight:700;margin:6px 0">Unidad 4 — Exponencial y logarítmica</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">M = C·(1 + i)ⁿ</div><small>Interés compuesto</small></div>
      <div class="fbox"><div class="big">y = aˣ ⟺ x = log_a(y)</div><small>Exponencial ↔ logaritmo (inversas)</small></div>
      <div class="fbox"><div class="big">L(ab)=La+Lb · L(a/b)=La−Lb · L(aⁿ)=n·La</div><small>Propiedades del log (L = ln)</small></div>
      <div class="fbox"><div class="big">L(1)=0 · L(e)=1 · e^(L x)=x</div><small>Valores y cancelación</small></div>
    </div>

    <h4>2º Parcial · Límites, continuidad, derivadas y optimización</h4>
    <p style="color:var(--accent);font-weight:700;margin:6px 0">Unidad 5 — Límites para x→a</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">lím_(x→a) f(x) = L</div><small>Hacia qué valor se acerca</small></div>
      <div class="fbox"><div class="big">Existe ⟺ lím_(x→a⁻) = lím_(x→a⁺)</div><small>Laterales coinciden</small></div>
      <div class="fbox"><div class="big">0/0 → factorizo y simplifico (x−a)</div><small>Bhaskara o Ruffini</small></div>
      <div class="fbox"><div class="big">denom→0, numer≠0 → ±∞</div><small>Asíntota vertical en x=a</small></div>
    </div>
    <p style="color:var(--accent);font-weight:700;margin:6px 0">Unidad 6 — Límites para x→±∞</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">∞/∞ → término de mayor grado</div><small>Cociente de polinomios</small></div>
      <div class="fbox"><div class="big">eˣ ≫ xⁿ ≫ L x</div><small>Órdenes de infinito</small></div>
      <div class="fbox"><div class="big">tiende a L → asíntota horizontal y=L</div><small>Comportamiento a lo lejos</small></div>
    </div>
    <p style="color:var(--accent);font-weight:700;margin:6px 0">Unidad 7 — Continuidad</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">Continua en a ⟺ ∃f(a) · ∃lím · son iguales</div><small>Las 3 condiciones</small></div>
      <div class="fbox"><div class="big">Bolzano</div><small>Continua en [a,b] y cambia de signo → raíz en (a,b)</small></div>
      <div class="fbox"><div class="big">Weierstrass</div><small>Continua en [a,b] → alcanza máx y mín absolutos</small></div>
      <div class="fbox"><div class="big">Derivable ⟹ continua</div><small>(no al revés)</small></div>
    </div>
    <p style="color:var(--accent);font-weight:700;margin:6px 0">Unidad 8 — Derivadas</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">f ′(a) = lím_(h→0) (f(a+h)−f(a))/h</div><small>Definición</small></div>
      <div class="fbox"><div class="big">y = f(a) + f ′(a)(x−a)</div><small>Recta tangente</small></div>
      <div class="fbox"><div class="big">(k)′=0 · (xⁿ)′=n·xⁿ⁻¹ · (√x)′=1/(2√x)</div><small>Tabla (potencias)</small></div>
      <div class="fbox"><div class="big">(eˣ)′=eˣ · (aˣ)′=aˣ·L a · (L x)′=1/x</div><small>Tabla (exp y log)</small></div>
      <div class="fbox"><div class="big">(f±g)′=f ′±g′ · (k·f)′=k·f ′</div><small>Suma y constante</small></div>
      <div class="fbox"><div class="big">(f·g)′ = f ′g + fg′</div><small>Producto</small></div>
      <div class="fbox"><div class="big">(f/g)′ = (f ′g − fg′)/g²</div><small>Cociente</small></div>
      <div class="fbox"><div class="big">(f(g(x)))′ = f ′(g(x))·g′(x)</div><small>Regla de la cadena</small></div>
    </div>
    <p style="color:var(--accent);font-weight:700;margin:6px 0">Unidad 9 — Variación y optimización</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">f ′&gt;0 crece · f ′&lt;0 decrece</div><small>Signo de la derivada</small></div>
      <div class="fbox"><div class="big">f ′(a)=0 → punto crítico</div><small>Candidato a máx/mín</small></div>
      <div class="fbox"><div class="big">+ a − = máximo · − a + = mínimo</div><small>Clasificación por cambio de signo</small></div>
      <div class="fbox"><div class="big">En [a,b]: comparo críticos y extremos</div><small>El óptimo puede estar en un borde</small></div>
      <div class="fbox"><div class="big">η(p) = − p·D′(p)/D(p)</div><small>Elasticidad (η&gt;1 elástica, &lt;1 inelástica)</small></div>
      <div class="fbox"><div class="big">I(p) = p·D(p) → I′(p) = D(p) + p·D′(p)</div><small>Ingreso y su derivada</small></div>
    </div>
  </section>

  <!-- EJERCICIOS -->
  <section class="sec" id="c-ej">
    <h3>Procedimientos + ejercicios resueltos (paso a paso)</h3>
    <p class="tagline">Primero la "receta" por tipo de ejercicio, después los resueltos. Es sin material, así que la idea es que estos pasos me salgan en automático.</p>
    <h4>Recetas rápidas por tipo (mi GPS: reconozco el tipo → aplico el procedimiento)</h4>
    <p style="color:var(--accent);font-weight:700;margin:8px 0 2px">1er Parcial · Funciones</p>
    <table>
      <tr><th>Si me piden…</th><th>Procedimiento</th></tr>
      <tr><td>Hallar una recta</td><td>1) Con 2 puntos: m=(y₂−y₁)/(x₂−x₁). 2) Con punto y pendiente: uso y=mx+n y despejo n con el punto. 3) Intersección de 2 rectas: igualo sus fórmulas.</td></tr>
      <tr><td>Cuadrática (raíces / vértice)</td><td>1) Δ=b²−4ac dice cuántas raíces. 2) Raíces con Bhaskara. 3) Vértice: x_v=−b/2a, y_v=f(x_v). 4) a&gt;0 mínimo, a&lt;0 máximo.</td></tr>
      <tr><td>Intersección recta–parábola</td><td>Igualo las dos fórmulas → me queda una cuadrática. El nº de soluciones = nº de puntos de corte.</td></tr>
      <tr><td>Dominio de una función</td><td>Quito lo prohibido: denominador ≠ 0 y radicando (de raíz par) ≥ 0.</td></tr>
      <tr><td>Recorrido (imagen)</td><td>Pienso qué valores de y toma: ej. |x|≥0; una parábola, desde su vértice hacia arriba o abajo.</td></tr>
      <tr><td>Composición f∘g</td><td>(f∘g)(x)=f(g(x)): meto g adentro de f. Ojo el orden (f∘g ≠ g∘f).</td></tr>
      <tr><td>Función por tramos con parámetros</td><td>Uso las condiciones (raíces dadas, o que sea continua) para armar ecuaciones y despejar los parámetros.</td></tr>
      <tr><td>Ecuación exponencial</td><td>Despejo la exponencial sola y aplico L a ambos lados (ej. eˣ=5 → x=L(5)).</td></tr>
      <tr><td>Ecuación logarítmica</td><td>Uso que L(algo)=0 ⟺ algo=1, o aplico e a ambos lados.</td></tr>
      <tr><td>Optimización económica (P1)</td><td>Armo U = Ingreso − Costo total (queda una cuadrática) y voy al vértice (x_v=−b/2a).</td></tr>
    </table>
    <p style="color:var(--accent);font-weight:700;margin:14px 0 2px">2º Parcial · Límites, continuidad, derivadas, optimización</p>
    <table>
      <tr><th>Si me piden…</th><th>Procedimiento</th></tr>
      <tr><td>Un límite (x→a)</td><td>1) Sustituyo. 2) Si da número, listo. 3) Si da 0/0 → factorizo (Bhaskara o Ruffini) y simplifico (x−a). 4) Reviso laterales si hay tramos.</td></tr>
      <tr><td>Límite en el infinito (x→±∞)</td><td>∞/∞ → término de mayor grado. Si hay eˣ, xⁿ, L x → uso órdenes de infinito (eˣ ≫ xⁿ ≫ L x).</td></tr>
      <tr><td>Parámetro para que un límite sea finito</td><td>Fuerzo que el numerador también → 0 en x=a (así queda 0/0, que SÍ se puede levantar). Despejo el parámetro y calculo.</td></tr>
      <tr><td>¿Es continua en a?</td><td>Chequeo las 3 condiciones: existe f(a), existe el límite y son iguales. En tramos, miro que los laterales peguen.</td></tr>
      <tr><td>Hallar parámetro de continuidad</td><td>Igualo el límite por izquierda con el valor por derecha en el punto y despejo.</td></tr>
      <tr><td>Probar que hay una raíz (Bolzano)</td><td>Verifico que f sea continua en [a,b] y que cambie de signo (f(a)·f(b)&lt;0). Entonces hay raíz en (a,b).</td></tr>
      <tr><td>Derivar</td><td>Identifico la estructura (suma, producto, cociente, composición) y aplico la regla. En cadena, multiplico por la derivada de lo de adentro.</td></tr>
      <tr><td>Recta tangente en a</td><td>1) Calculo f(a). 2) Calculo f′(a) (pendiente). 3) y = f(a) + f′(a)(x−a).</td></tr>
      <tr><td>Recta tangente "al revés"</td><td>La pendiente de la recta dada es f′(a); y el punto de tangencia (sobre la recta) me da f(a).</td></tr>
      <tr><td>Cadena compuesta F(x)=(f(x))ⁿ+f(xᵏ)</td><td>Derivo cada término con la cadena y evalúo con los datos f(a) y f′(a).</td></tr>
      <tr><td>Crecimiento / extremos</td><td>1) Derivo. 2) f′=0 → críticos. 3) Signo de f′. 4) + a − = máx; − a + = mín.</td></tr>
      <tr><td>Máximo/mínimo absoluto en [a,b]</td><td>Comparo el valor de f en los puntos críticos internos y en los dos bordes a y b.</td></tr>
      <tr><td>Optimización (problema con texto)</td><td>1) Defino variables. 2) Función objetivo + ecuación de restricción. 3) Despejo y sustituyo para dejar 1 variable. 4) Derivo, f′=0, clasifico. 5) Interpreto.</td></tr>
      <tr><td>Elasticidad</td><td>η(p) = −p·D′(p)/D(p). Comparo con 1: &gt;1 elástica, &lt;1 inelástica.</td></tr>
    </table>
    <h4>Ejercicios resueltos</h4>
    <details class="ex" open><summary>Ej 1 · Límite 0/0 con factorización</summary>
      <div class="body">
        <p><b>Letra:</b> Calculá <span class="fml">lím_(x→2) (x² − 4)/(x − 2)</span>.</p>
        <ol class="steps">
          <li>Sustituyo x = 2: (4−4)/(2−2) = <b>0/0</b> → indeterminación.</li>
          <li>Factorizo el numerador: x² − 4 = (x − 2)(x + 2).</li>
          <li>Simplifico (x − 2): queda (x + 2).</li>
          <li>Ahora sí sustituyo: 2 + 2 = <b>4</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>Ej 2 · Límite x→∞ de cociente de polinomios</summary>
      <div class="body">
        <p><b>Letra:</b> Calculá <span class="fml">lím_(x→+∞) (3x² + 2x)/(x² − 5)</span>.</p>
        <ol class="steps">
          <li>Es ∞/∞. Me quedo con el término de <b>mayor grado</b> arriba y abajo: 3x² / x².</li>
          <li>Simplifico: 3x²/x² = 3.</li>
          <li>Resultado: <b>3</b> (hay asíntota horizontal y = 3).</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>Ej 3 · Derivada + recta tangente</summary>
      <div class="body">
        <p><b>Letra:</b> Sea f(x) = x² − 4x + 3. Hallá f ′(x) y la recta tangente en x = 1.</p>
        <ol class="steps">
          <li>Derivo con la tabla: f ′(x) = 2x − 4.</li>
          <li>Pendiente en x = 1: f ′(1) = 2·1 − 4 = <b>−2</b>.</li>
          <li>Punto: f(1) = 1 − 4 + 3 = 0 → (1, 0).</li>
          <li>Recta tangente: y = 0 + (−2)(x − 1) → <b>y = −2x + 2</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>Ej 4 · Optimización económica (utilidad máxima)</summary>
      <div class="body">
        <p><b>Letra:</b> La utilidad de una empresa es U(x) = −x² + 40x − 100 (x = cantidad). ¿Qué cantidad maximiza la utilidad?</p>
        <ol class="steps">
          <li>Derivo: U′(x) = −2x + 40.</li>
          <li>Igualo a 0: −2x + 40 = 0 → <b>x = 20</b>.</li>
          <li>Verifico que sea máximo: U′ pasa de + (x&lt;20) a − (x&gt;20) → es <b>máximo</b>.</li>
          <li>Utilidad máxima: U(20) = −400 + 800 − 100 = <b>300</b>.</li>
        </ol>
      </div>
    </details>

    <details class="ex"><summary>Ej 5 · Límite 0/0 con Ruffini (numerador de grado 3)</summary>
      <div class="body">
        <p><b>Letra:</b> Calculá <span class="fml">lím_(x→1) (x³ − 4x² + 2x + 1)/(2x² − 3x + 1)</span>.</p>
        <ol class="steps">
          <li>Sustituyo x=1: numerador y denominador dan 0 → <b>0/0</b>. Entonces x=1 es raíz de ambos.</li>
          <li>Factorizo el numerador (grado 3) con <b>Ruffini</b> dividiendo por (x−1): queda (x−1)(x²−3x−1).</li>
          <li>El denominador: 2x²−3x+1 = (x−1)(2x−1).</li>
          <li>Simplifico (x−1): queda (x²−3x−1)/(2x−1).</li>
          <li>Sustituyo x=1: (1−3−1)/(2−1) = −3/1 = <b>−3</b>.</li>
        </ol>
      </div>
    </details>

    <details class="ex"><summary>Ej 6 · Derivadas con regla del producto y del cociente</summary>
      <div class="body">
        <p><b>Letra:</b> Derivá (a) f(x)=x²·eˣ y (b) g(x)=eˣ/(3x+1).</p>
        <ol class="steps">
          <li><b>(a) Producto</b> (f·g)′=f′g+fg′: (x²)′eˣ + x²(eˣ)′ = 2x·eˣ + x²·eˣ = <b>x·eˣ·(2+x)</b>.</li>
          <li><b>(b) Cociente</b> (f/g)′=(f′g−fg′)/g²: [eˣ(3x+1) − eˣ·3] / (3x+1)² = <b>eˣ(3x−2)/(3x+1)²</b>.</li>
        </ol>
      </div>
    </details>

    <details class="ex"><summary>Ej 7 · Regla de la cadena</summary>
      <div class="body">
        <p><b>Letra:</b> Derivá h(x) = (x² + 1)⁵ y luego k(x) = e^(3x).</p>
        <ol class="steps">
          <li><b>h:</b> lo de afuera es (·)⁵, lo de adentro x²+1. h′ = 5(x²+1)⁴ · (x²+1)′ = 5(x²+1)⁴·2x = <b>10x(x²+1)⁴</b>.</li>
          <li><b>k:</b> lo de afuera eˣ, lo de adentro 3x. k′ = e^(3x)·(3x)′ = <b>3·e^(3x)</b>.</li>
        </ol>
      </div>
    </details>

    <details class="ex"><summary>Ej 8 · Elasticidad de la demanda (caso del manual)</summary>
      <div class="body">
        <p><b>Letra:</b> La demanda es D(p)=3000−30p. Calculá la elasticidad en p=20 y p=60 e interpretá.</p>
        <ol class="steps">
          <li>D′(p) = −30.</li>
          <li>η(p) = −p·D′(p)/D(p) = −p·(−30)/(3000−30p) = 30p/(3000−30p) = <b>p/(100−p)</b>.</li>
          <li>En p=20: η = 20/80 = <b>¼ &lt; 1 → inelástica</b> (subir el precio sube el ingreso).</li>
          <li>En p=60: η = 60/40 = <b>3/2 &gt; 1 → elástica</b> (subir el precio baja el ingreso).</li>
        </ol>
      </div>
    </details>

    <details class="ex"><summary>Ej 9 · Optimización con restricción (cercar un terreno)</summary>
      <div class="body">
        <p><b>Letra:</b> Quiero cercar un terreno rectangular de área fija A con el menor perímetro posible. ¿Qué dimensiones convienen?</p>
        <ol class="steps">
          <li>Variables: lados x&gt;0, y&gt;0. Objetivo: minimizar P = 2(x+y).</li>
          <li>Restricción: x·y = A → despejo y = A/x.</li>
          <li>Sustituyo: P(x) = 2(x + A/x), con x&gt;0.</li>
          <li>Derivo: P′(x) = 2(1 − A/x²) = 2(x²−A)/x². Igualo a 0 → x² = A → x = √A.</li>
          <li>Signo de P′: negativa antes de √A, positiva después → <b>mínimo</b> en x=√A.</li>
          <li>Como y = A/x = √A, queda <b>x = y = √A: el rectángulo óptimo es un cuadrado</b>.</li>
        </ol>
      </div>
    </details>

  <!-- TRAMPAS -->
  <section class="sec" id="c-trap">
    <h3>Trampas típicas</h3>
    <div class="trap"><span class="tag">Límites</span> 0/0 e ∞/∞ son indeterminaciones: hay que <b>trabajarlas</b>, no valen 0 ni 1. Si los laterales no coinciden, el límite <b>no existe</b>.</div>
    <div class="trap"><span class="tag">Continuidad</span> Bolzano y Weierstrass exigen <b>continuidad en el intervalo cerrado</b>. Sin eso, no aplican.</div>
    <div class="trap"><span class="tag">Derivadas</span> (f·g)′ ≠ f ′·g′. La cadena se olvida: multiplicá por la derivada de lo de adentro. Continua no implica derivable.</div>
    <div class="trap"><span class="tag">Optimización</span> f ′(a)=0 no garantiza máximo: clasificá con el signo de f ′ y mirá el dominio.</div>
    <div class="trap"><span class="tag">Elasticidad</span> Con la notación del curso, <b>η ya es positiva</b> (por el signo menos): η&gt;1 elástica, η&lt;1 inelástica. No le pongas valor absoluto aparte.</div>
    <p style="color:var(--accent);font-weight:700;margin:12px 0 2px">Del 1er parcial (funciones)</p>
    <div class="trap"><span class="tag">Dominio</span> No se puede dividir por cero ni sacar raíz (par) de un negativo. Esos valores <b>salen</b> del dominio.</div>
    <div class="trap"><span class="tag">Composición</span> f∘g <b>no</b> es g∘f: el orden importa. (f∘g)(x)=f(g(x)) (primero g).</div>
    <div class="trap"><span class="tag">Cuadrática</span> El signo de <b>a</b> decide máximo vs mínimo. No confundas las <b>raíces</b> (cortes con el eje x) con el <b>vértice</b> (la punta).</div>
    <div class="trap"><span class="tag">Utilidad (P1)</span> Armá bien U = Ingreso − Costo total (con CF y costo variable) ANTES de maximizar; el óptimo está en el vértice de la parábola.</div>
    <div class="trap"><span class="tag">Logaritmo</span> L(a+b) <b>no</b> es L(a)+L(b). El log convierte <b>productos</b> en sumas (L(ab)=La+Lb), no sumas.</div>
    <div class="trap"><span class="tag">Dominio vs recorrido</span> El <b>dominio</b> son las x donde existe; el <b>recorrido</b> (o imagen) son los valores de y que toma. No los confundas: son cosas distintas.</div>
    <div class="trap"><span class="tag">Límites</span> El límite <b>no</b> mira f(a): mira los alrededores. La función puede no existir en a y aún tener límite (el agujero).</div>
    <div class="trap"><span class="tag">Derivadas</span> La derivada de una <b>constante</b> es 0 (no la constante). Y ojo: derivar no es lo mismo que evaluar; f ′(a) es la pendiente, no el valor f(a).</div>
    <div class="trap"><span class="tag">Optimización</span> Un <b>máximo relativo</b> no siempre es el <b>absoluto</b>: en un intervalo [a,b] el absoluto puede estar en un borde. Siempre comparo críticos y extremos.</div>
    <div class="trap"><span class="tag">Notación</span> El parcial escribe <b>L en vez de ln</b>. Es lo mismo: logaritmo natural (base e).</div>
    <div class="trap"><span class="tag">Estrategia del parcial</span> Equivocarse <b>resta</b> 1.5. Si no puedo descartar al menos dos opciones, a veces conviene dejar en blanco (0) antes que arriesgar.</div>
  </section>

  <!-- P1-A: LINEALES Y CUADRÁTICAS -->
  <section class="sec" id="c-u1">
    <h3>Unidad 1 · Funciones lineales (Cap. 1)</h3>

    <h4>Antes que nada: ¿qué es una función?</h4>
    <p>Una <b>función</b> es una regla que a cada número de entrada le asigna <b>un único</b> número de salida. La entrada se llama x (variable independiente), la salida y o f(x). En economía la uso para conectar dos cantidades: "a cada cantidad producida, su costo", "a cada precio, su demanda". En el 1er parcial conozco las familias de funciones; en el 2º las exprimo con cálculo.</p>

    <h4>Función lineal: cambio constante</h4>
    <p>Es la más simple: <span class="fml">y = m·x + n</span>. Su gráfico es una <b>recta</b>. Tiene dos números con significado:</p>
    <table>
      <tr><th>Símbolo</th><th>Qué es</th><th>Qué significa</th></tr>
      <tr><td><b>m</b> (pendiente)</td><td>cuánto cambia y por cada +1 en x</td><td>la <b>tasa de cambio</b>. m&gt;0 sube, m&lt;0 baja, m=0 plana</td></tr>
      <tr><td><b>n</b> (ordenada en el origen)</td><td>el valor de y cuando x = 0</td><td>el valor de y donde la recta corta el eje vertical (eje y)</td></tr>
    </table>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="40" y1="12" x2="40" y2="180" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="14" y1="160" x2="346" y2="160" stroke="#7a8499" stroke-width="1.5"/>
      <text x="349" y="165" fill="#aab4c8" font-size="13">x</text>
      <text x="29" y="14" fill="#aab4c8" font-size="13">y</text>
      <line x1="15" y1="127" x2="322" y2="32" stroke="#6c8cff" stroke-width="2.5"/>
      <text x="250" y="28" fill="#6c8cff" font-size="13">y = m·x + n</text>
      <line x1="40" y1="120" x2="180" y2="120" stroke="#36d399" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="180" y1="120" x2="180" y2="80" stroke="#36d399" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="78" y="135" fill="#36d399" font-size="12">Δx (avance)</text>
      <text x="185" y="104" fill="#36d399" font-size="12">Δy (subida)</text>
      <circle cx="40" cy="120" r="4" fill="#ffc24b"/>
      <text x="22" y="116" fill="#ffc24b" font-size="14">n</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">La recta corta el eje y en <b>n</b>; la pendiente <b>m = Δy/Δx</b> (subida sobre avance) es la misma en toda la recta.</div>
    </div>
    <p>Es lineal porque la tasa de cambio es <b>siempre la misma</b> (cada paso sube lo mismo). Por eso modela cosas con costo constante por unidad:</p>
    <table>
      <tr><th>En economía</th><th>Modelo</th><th>Lectura</th></tr>
      <tr><td>Costo total</td><td>CT = costos fijos + (costo por unidad)·x</td><td>n = costos fijos; m = costo variable unitario</td></tr>
      <tr><td>Ingreso</td><td>I = precio·x</td><td>arranca en 0 y sube "precio" por cada unidad vendida</td></tr>
      <tr><td>Utilidad</td><td>U = I − CT</td><td>el <b>punto de equilibrio</b> es donde U = 0 (ni gano ni pierdo)</td></tr>
    </table>
    <div class="key"><span class="tag">Determinar una recta</span> Si tengo dos puntos, la pendiente es <span class="fml">m = (y₂−y₁)/(x₂−x₁)</span> ("cuánto subió y" sobre "cuánto avanzó x"). Para ver dónde se cruzan dos rectas, igualo sus fórmulas y despejo x.</div>

    <h4>📐 Hoja de fórmulas — Unidad 1</h4>
    <div class="formula-grid">
      <div class="fbox"><div class="big">y = m·x + n</div><small>Recta · m = pendiente, n = ordenada en el origen</small></div>
      <div class="fbox"><div class="big">m = (y₂−y₁)/(x₂−x₁)</div><small>Pendiente a partir de dos puntos</small></div>
      <div class="fbox"><div class="big">CT = CF + cv·x</div><small>Costo total (fijos + variable·cantidad)</small></div>
      <div class="fbox"><div class="big">I = p·x · U = I − CT</div><small>Ingreso y utilidad</small></div>
      <div class="fbox"><div class="big">Equilibrio: U = 0 (o Qd = Qs)</div><small>Punto de no ganar ni perder / equilibrio de mercado</small></div>
    </div>

    <h4>Ejercicios resueltos de esta unidad (de fácil a difícil)</h4>
    <details class="ex" open><summary>① Básico · Leer pendiente, signo y raíz de una recta</summary>
      <div class="body">
        <p><b>Letra:</b> Sea f(x) = −2x + 4. (a) ¿Crece o decrece? (b) ¿Dónde corta los ejes? (c) ¿Para qué x es positiva?</p>
        <ol class="steps">
          <li>(a) La pendiente es m = −2 &lt; 0 → la función <b>decrece</b>.</li>
          <li>(b) Corte con eje y: x=0 → f(0)=4 → punto (0, 4). Corte con eje x (raíz): −2x+4=0 → <b>x=2</b> → punto (2, 0).</li>
          <li>(c) Como decrece y vale 0 en x=2, es <b>positiva para x &lt; 2</b> y negativa para x &gt; 2.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>② Medio · Hallar la recta que pasa por dos puntos</summary>
      <div class="body">
        <p><b>Letra:</b> Encontrá la ecuación de la recta que pasa por A=(1, 3) y B=(3, 7).</p>
        <ol class="steps">
          <li>Pendiente: m = (7−3)/(3−1) = 4/2 = <b>2</b>.</li>
          <li>Uso y = mx + n con el punto A=(1,3): 3 = 2·1 + n → n = <b>1</b>.</li>
          <li>Recta: <b>y = 2x + 1</b>. (Verifico con B: 2·3+1 = 7 ✓.)</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>③ Aplicado · Costo, ingreso, utilidad y punto de equilibrio</summary>
      <div class="body">
        <p><b>Letra:</b> Una empresa tiene costos fijos de $500 y un costo variable de $3 por unidad. Vende cada unidad a $8. (a) Escribí CT, I y U en función de x. (b) ¿Cuántas unidades necesita para no perder?</p>
        <ol class="steps">
          <li>(a) CT = 500 + 3x · I = 8x · U = I − CT = 8x − (500 + 3x) = <b>5x − 500</b>.</li>
          <li>(b) Equilibrio: U = 0 → 5x − 500 = 0 → <b>x = 100 unidades</b>.</li>
          <li>Lectura: con menos de 100 pierde, con más gana. Cada unidad extra aporta $5 (la pendiente de U).</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>④ Más complejo · Intersección de dos rectas (comparar dos planes)</summary>
      <div class="body">
        <p><b>Letra:</b> El plan A cobra $200 fijos + $2 por unidad; el plan B cobra $50 fijos + $5 por unidad. ¿A partir de cuántas unidades conviene A?</p>
        <ol class="steps">
          <li>Costo A: C_A = 200 + 2x. Costo B: C_B = 50 + 5x.</li>
          <li>Se cruzan donde cuestan igual: 200 + 2x = 50 + 5x → 150 = 3x → <b>x = 50</b>.</li>
          <li>Para x &gt; 50, A crece más lento (pendiente 2 &lt; 5) → <b>conviene A a partir de 50 unidades</b>; antes, B.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>⑤ Medio · Recta dada por un punto y la pendiente</summary>
      <div class="body">
        <p><b>Letra:</b> Hallá la recta de pendiente m = −3 que pasa por el punto P = (2, 1).</p>
        <ol class="steps">
          <li>Arranco de y = mx + n con m = −3: y = −3x + n.</li>
          <li>Como pasa por (2, 1): 1 = −3·2 + n → 1 = −6 + n → n = <b>7</b>.</li>
          <li>Recta: <b>y = −3x + 7</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>⑥ Aplicado · Equilibrio de mercado (oferta = demanda)</summary>
      <div class="body">
        <p><b>Letra:</b> La demanda es Qd = 100 − 2p y la oferta Qs = 10 + 3p (p = precio). Hallá el precio y la cantidad de equilibrio.</p>
        <ol class="steps">
          <li>El equilibrio es donde lo que se pide = lo que se ofrece: Qd = Qs.</li>
          <li>100 − 2p = 10 + 3p → 90 = 5p → <b>p = 18</b>.</li>
          <li>Cantidad: reemplazo en cualquiera: Q = 100 − 2·18 = <b>64</b>. (Chequeo con la oferta: 10 + 3·18 = 64 ✓.)</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>⑦ Conceptual · Interpretar la pendiente como tasa de cambio</summary>
      <div class="body">
        <p><b>Letra:</b> El costo de producir x unidades es CT(x) = 400 + 6x. (a) ¿Qué significan el 400 y el 6? (b) ¿Cuánto aumenta el costo si paso de 50 a 51 unidades? ¿Y de 200 a 201?</p>
        <ol class="steps">
          <li>(a) El <b>400</b> es el costo fijo (lo que gasto aunque produzca 0). El <b>6</b> es el costo de cada unidad extra (la pendiente = costo marginal, acá constante).</li>
          <li>(b) Como es lineal, cada unidad extra cuesta siempre lo mismo: <b>$6</b>, tanto de 50→51 como de 200→201.</li>
          <li>Idea clave: en una función lineal la tasa de cambio es <b>constante</b>. En el 2º parcial, cuando la función no sea recta, esa "tasa" cambiará en cada punto y la mediré con la <b>derivada</b>.</li>
        </ol>
      </div>
    </details>
  </section>

  <!-- UNIDAD 2: CUADRÁTICAS -->
  <section class="sec" id="c-u2">
    <h3>Unidad 2 · Funciones cuadráticas (Cap. 2)</h3>
    <div class="idea">✓ <b>Idea madre:</b> después de la recta (cambio constante) viene la <b>parábola</b>, que sube y baja: tiene un punto más alto o más bajo (el vértice). En economía modela ingreso y utilidad, donde justo me interesa ese máximo.</div>

    <h4>Función cuadrática: la parábola</h4>
    <p>Forma <span class="fml">y = ax² + bx + c</span>. Su gráfico es una <b>parábola</b> (una "U" o una "U invertida"). El número <b>a</b> manda la forma:</p>
    <table>
      <tr><th>Si…</th><th>La parábola…</th><th>Tiene un…</th></tr>
      <tr><td>a &gt; 0</td><td>abre hacia arriba (U)</td><td><b>mínimo</b> en el vértice</td></tr>
      <tr><td>a &lt; 0</td><td>abre hacia abajo (∩)</td><td><b>máximo</b> en el vértice</td></tr>
    </table>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="20" y1="160" x2="345" y2="160" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="180" y1="12" x2="180" y2="185" stroke="#7a8499" stroke-width="1.5"/>
      <text x="349" y="165" fill="#aab4c8" font-size="13">x</text>
      <path d="M 80 160 Q 180 -50 280 160" fill="none" stroke="#6c8cff" stroke-width="2.5"/>
      <circle cx="80" cy="160" r="4" fill="#ff6b6b"/>
      <circle cx="280" cy="160" r="4" fill="#ff6b6b"/>
      <text x="58" y="178" fill="#ff6b6b" font-size="12">raíz</text>
      <text x="262" y="178" fill="#ff6b6b" font-size="12">raíz</text>
      <circle cx="180" cy="55" r="4" fill="#ffc24b"/>
      <text x="188" y="52" fill="#ffc24b" font-size="12">vértice (máximo)</text>
      <text x="300" y="110" fill="#6c8cff" font-size="13">a &lt; 0</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">Parábola con <b>a &lt; 0</b> (abre hacia abajo): las <b>raíces</b> son los cortes con el eje x; el <b>vértice</b> es el máximo.</div>
    </div>
    <p>Dos cosas que siempre me piden:</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">x = (−b ± √(b²−4ac)) / 2a</div><small><b>Raíces (Bhaskara):</b> los x donde la parábola corta el eje horizontal (donde y = 0)</small></div>
      <div class="fbox"><div class="big">x_v = −b / 2a</div><small><b>Vértice:</b> el x donde está el máximo o mínimo</small></div>
    </div>
    <div class="key"><span class="tag">Conexión económica</span> Si el ingreso o la utilidad es una parábola hacia abajo, el <b>vértice es el punto de máximo</b>. Esto lo voy a reencontrar en el 2º parcial: ahí el vértice sale de derivar e igualar a cero (f ′=0). ¡Es la misma idea!</div>
    <div class="trap"><span class="tag">Ojo con la trampa</span> El signo de <b>a</b> decide si el vértice es máximo o mínimo. No confundas las <b>raíces</b> (cortes con el eje x) con el <b>vértice</b> (la punta).</div>

    <h4>📐 Hoja de fórmulas — Unidad 2</h4>
    <div class="formula-grid">
      <div class="fbox"><div class="big">y = ax² + bx + c</div><small>Forma general · a≠0</small></div>
      <div class="fbox"><div class="big">Δ = b² − 4ac</div><small>Discriminante: Δ&gt;0 → 2 raíces · Δ=0 → 1 · Δ&lt;0 → ninguna real</small></div>
      <div class="fbox"><div class="big">x = (−b ± √Δ) / 2a</div><small>Raíces (Bhaskara)</small></div>
      <div class="fbox"><div class="big">x_v = −b / 2a</div><small>Vértice (x). Su y se obtiene evaluando: y_v = f(x_v)</small></div>
      <div class="fbox"><div class="big">a &gt; 0 → mínimo · a &lt; 0 → máximo</div><small>El signo de a decide la concavidad</small></div>
    </div>

    <h4>Ejercicios resueltos de esta unidad (de fácil a difícil)</h4>
    <details class="ex" open><summary>① Básico · Raíces con Bhaskara</summary>
      <div class="body">
        <p><b>Letra:</b> Hallá las raíces de f(x) = 2x² + 5x − 3.</p>
        <ol class="steps">
          <li>Identifico: a=2, b=5, c=−3. Discriminante: Δ = 5² − 4·2·(−3) = 25 + 24 = 49.</li>
          <li>Como Δ=49&gt;0, hay 2 raíces: x = (−5 ± √49)/(2·2) = (−5 ± 7)/4.</li>
          <li>x₁ = (−5+7)/4 = <b>1/2</b> · x₂ = (−5−7)/4 = <b>−3</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>② Básico · Vértice y si es máximo o mínimo</summary>
      <div class="body">
        <p><b>Letra:</b> Para f(x) = −x² + 4x, hallá el vértice e indicá si es máximo o mínimo.</p>
        <ol class="steps">
          <li>a=−1, b=4, c=0. Como a&lt;0, la parábola abre hacia abajo → tiene <b>máximo</b>.</li>
          <li>x_v = −b/2a = −4/(2·(−1)) = <b>2</b>.</li>
          <li>y_v = f(2) = −(2²) + 4·2 = −4 + 8 = <b>4</b>. Vértice (2, 4), es un máximo.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>③ Medio · Estudiar el signo de la cuadrática</summary>
      <div class="body">
        <p><b>Letra:</b> ¿Para qué valores de x es positiva f(x) = x² − x − 6?</p>
        <ol class="steps">
          <li>Raíces: Δ = 1 + 24 = 25 → x = (1 ± 5)/2 → x₁ = 3, x₂ = −2.</li>
          <li>Como a=1&gt;0 (abre hacia arriba), es <b>negativa entre las raíces</b> y positiva afuera.</li>
          <li>Entonces f(x) &gt; 0 para <b>x &lt; −2 o x &gt; 3</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>④ Aplicado · Precio que maximiza el ingreso</summary>
      <div class="body">
        <p><b>Letra:</b> La demanda es Q = 60 − 2p. El ingreso es I(p) = p·Q. ¿Qué precio maximiza el ingreso?</p>
        <ol class="steps">
          <li>I(p) = p(60 − 2p) = 60p − 2p². Es una parábola en p con a=−2&lt;0 → tiene máximo.</li>
          <li>p_v = −b/2a = −60/(2·(−2)) = <b>$15</b>.</li>
          <li>Ingreso máximo: I(15) = 60·15 − 2·15² = 900 − 450 = <b>$450</b>. (En el 2º parcial esto sale derivando I y poniendo I′=0.)</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>⑤ Aplicado · Utilidad: equilibrio (raíces) y máximo (vértice)</summary>
      <div class="body">
        <p><b>Letra:</b> La utilidad es U(x) = −x² + 10x − 16. (a) ¿Entre qué cantidades hay ganancia? (b) ¿Qué cantidad da la utilidad máxima?</p>
        <ol class="steps">
          <li>(a) Hay ganancia donde U&gt;0. Raíces: Δ = 100 − 64 = 36 → x = (−10 ± 6)/(−2) → x₁ = 2, x₂ = 8. Como a&lt;0, U&gt;0 <b>entre 2 y 8</b>.</li>
          <li>(b) Máximo en el vértice: x_v = −10/(2·(−1)) = <b>5</b>.</li>
          <li>Utilidad máxima: U(5) = −25 + 50 − 16 = <b>9</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>⑥ Más complejo · Discriminante con parámetro</summary>
      <div class="body">
        <p><b>Letra:</b> ¿Para qué valores de k la ecuación x² − 4x + k = 0 tiene dos raíces reales distintas?</p>
        <ol class="steps">
          <li>Dos raíces reales distintas ⟺ Δ &gt; 0. Acá Δ = (−4)² − 4·1·k = 16 − 4k.</li>
          <li>16 − 4k &gt; 0 → 16 &gt; 4k → <b>k &lt; 4</b>.</li>
          <li>(Si k = 4 hay una sola raíz doble; si k &gt; 4, ninguna real.)</li>
        </ol>
      </div>
    </details>
  </section>

  <!-- P1-B: FUNCIONES, EXP Y LOG -->
  <section class="sec" id="c-u3">
    <h3>Unidad 3 · Más sobre funciones (Cap. 3)</h3>
    <div class="idea">✓ <b>Idea madre:</b> antes de avanzar necesito manejar bien las funciones en general: dónde existen (dominio), cómo combinarlas y cómo meter una dentro de otra (composición). Esto último es la semilla de la regla de la cadena del 2º parcial.</div>

    <h4>Conceptos que necesito para no trabarme después</h4>
    <table>
      <tr><th>Concepto</th><th>Qué es</th><th>Por qué me importa</th></tr>
      <tr><td><b>Dominio</b></td><td>El conjunto de valores de x donde la función <b>existe</b></td><td>Ojo con dos prohibiciones: no se puede dividir por cero ni sacar raíz de un número negativo. Eso "saca" valores del dominio</td></tr>
      <tr><td><b>Operaciones</b></td><td>Sumar, restar, multiplicar o dividir funciones</td><td>las funciones de verdad son combinaciones de las básicas</td></tr>
      <tr><td><b>Composición</b></td><td>Meter una función <b>adentro</b> de otra: f(g(x))</td><td>es la base de la <b>regla de la cadena</b> del 2º parcial</td></tr>
      <tr><td><b>Función potencial</b></td><td>y = xⁿ</td><td>es la que más derivo después (regla: baja el exponente)</td></tr>
      <tr><td><b>Por tramos / valor absoluto</b></td><td>Distinta fórmula según el intervalo de x</td><td>ej. el IRPF, que cobra distinto % por franjas de ingreso</td></tr>
    </table>

    <h4>📐 Hoja de fórmulas — Unidad 3</h4>
    <div class="formula-grid">
      <div class="fbox"><div class="big">Dominio: denominador ≠ 0</div><small>No se puede dividir por cero</small></div>
      <div class="fbox"><div class="big">Dominio: lo de adentro de √ ≥ 0</div><small>No hay raíz (par) de negativos</small></div>
      <div class="fbox"><div class="big">(f∘g)(x) = f(g(x))</div><small>Composición: primero g, después f</small></div>
      <div class="fbox"><div class="big">|x| = x si x≥0 ; −x si x&lt;0</div><small>Valor absoluto (función por tramos)</small></div>
    </div>

    <h4>Ejercicios resueltos de esta unidad (de fácil a difícil)</h4>
    <details class="ex" open><summary>① Básico · Dominio de una función</summary>
      <div class="body">
        <p><b>Letra:</b> Hallá el dominio de f(x) = √(x − 3) y de g(x) = 1/(x − 5).</p>
        <ol class="steps">
          <li><b>f:</b> lo de adentro de la raíz debe ser ≥ 0: x − 3 ≥ 0 → <b>x ≥ 3</b>. Dominio: [3, +∞).</li>
          <li><b>g:</b> el denominador no puede ser 0: x − 5 ≠ 0 → <b>x ≠ 5</b>. Dominio: todos los reales menos 5.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>② Medio · Composición de funciones (el orden importa)</summary>
      <div class="body">
        <p><b>Letra:</b> Sean f(x) = x² y g(x) = x + 1. Hallá (f∘g)(x) y (g∘f)(x).</p>
        <ol class="steps">
          <li>(f∘g)(x) = f(g(x)) = f(x+1) = <b>(x+1)²</b> (meto g adentro de f).</li>
          <li>(g∘f)(x) = g(f(x)) = g(x²) = <b>x² + 1</b>.</li>
          <li>Conclusión: ¡el orden importa! (x+1)² ≠ x²+1. Esto es clave para la regla de la cadena del 2º parcial.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>③ Medio · Evaluar una función por tramos</summary>
      <div class="body">
        <p><b>Letra:</b> Sea f(x) = { 2x si x &lt; 1 ; x² + 3 si x ≥ 1 }. Calculá f(0), f(1) y f(3).</p>
        <ol class="steps">
          <li>f(0): como 0 &lt; 1, uso 2x → f(0) = 2·0 = <b>0</b>.</li>
          <li>f(1): como 1 ≥ 1, uso x²+3 → f(1) = 1 + 3 = <b>4</b>.</li>
          <li>f(3): como 3 ≥ 1, uso x²+3 → f(3) = 9 + 3 = <b>12</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>④ Aplicado · Función por tramos tipo IRPF</summary>
      <div class="body">
        <p><b>Letra:</b> Un impuesto cobra 0% hasta $1000 y 10% sobre lo que excede $1000. Escribí el impuesto T(x) por tramos y calculá T(800) y T(1500).</p>
        <ol class="steps">
          <li>Por tramos: T(x) = { 0 si x ≤ 1000 ; 0,10·(x − 1000) si x &gt; 1000 }.</li>
          <li>T(800): como 800 ≤ 1000 → <b>$0</b>.</li>
          <li>T(1500): como 1500 &gt; 1000 → 0,10·(1500 − 1000) = <b>$50</b>.</li>
        </ol>
      </div>
    </details>
  </section>

  <!-- UNIDAD 4: EXPONENCIAL Y LOGARÍTMICA -->
  <section class="sec" id="c-u4">
    <h3>Unidad 4 · Exponencial y logarítmica (Cap. 4)</h3>
    <div class="idea">✓ <b>Idea madre:</b> dos familias de funciones que son una la inversa de la otra. La exponencial modela crecimiento que se acelera (interés compuesto); el logaritmo lo "deshace". Reaparecen mucho en el 2º parcial.</div>

    <h4>Función exponencial: crecimiento que se acelera</h4>
    <p>Es <span class="fml">y = aˣ</span>: la variable está <b>en el exponente</b>. A diferencia de la lineal (que sube siempre lo mismo), la exponencial <b>crece cada vez más rápido</b> — por eso modela el interés compuesto, donde los intereses generan más intereses.</p>
    <div class="fbox"><div class="big">M = C·(1 + i)ⁿ</div><small>Monto final M, a partir de un capital C, a tasa i, durante n períodos. (1+i) se aplica n veces.</small></div>
    <div class="eli"><span class="tag">ELI5</span> Lineal = ahorrás $10 por mes (siempre igual). Exponencial = una bola de nieve que rueda: cuanto más grande, más nieve junta por vuelta.</div>
    <p>Hay una base especial, <b>e ≈ 2,718</b> (el número de Euler), que aparece naturalmente en crecimiento continuo. La exponencial de base e, <span class="fml">eˣ</span>, es la reina del cálculo (su derivada es ella misma).</p>
    <div style="text-align:center;margin:16px 0">
    <svg viewBox="0 0 360 200" style="max-width:340px;width:100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="40" y1="12" x2="40" y2="175" stroke="#7a8499" stroke-width="1.5"/>
      <line x1="14" y1="165" x2="346" y2="165" stroke="#7a8499" stroke-width="1.5"/>
      <text x="349" y="170" fill="#aab4c8" font-size="13">x</text>
      <line x1="40" y1="150" x2="320" y2="70" stroke="#7a8499" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="285" y="66" fill="#aab4c8" font-size="11">lineal</text>
      <path d="M 45 160 Q 230 158 312 25" fill="none" stroke="#6c8cff" stroke-width="2.5"/>
      <text x="255" y="34" fill="#6c8cff" font-size="13">y = eˣ</text>
    </svg>
    <div style="color:#7a8499;font-size:.8rem">La exponencial (azul) arranca despacio pero después <b>se dispara</b>, mucho más rápido que una recta (punteada). Por eso, a la larga, le gana a cualquier potencia.</div>
    </div>
    <p>Y el logaritmo, al ser su <b>inversa</b>, es como esa misma curva <b>reflejada</b>: crece pero cada vez más lento.</p>

    <h4>Función logarítmica: la que "deshace" la exponencial</h4>
    <p>El <b>logaritmo</b> es la función <b>inversa</b> de la exponencial: hace la pregunta al revés. La exponencial dice "si elevo a a la x, ¿cuánto da?"; el logaritmo dice "¿a qué exponente tengo que elevar a para llegar a este número?".</p>
    <div class="formula-grid">
      <div class="fbox"><div class="big">y = aˣ  ⟺  x = log_a(y)</div><small>Son la misma relación, leída en dos sentidos</small></div>
      <div class="fbox"><div class="big">ln(a·b) = ln a + ln b<br>ln(aⁿ) = n·ln a</div><small>Propiedades: el log convierte productos en sumas y baja exponentes</small></div>
    </div>
    <p><b>ln</b> es el logaritmo natural (base e). Es el "compañero" de eˣ.</p>
    <div class="key"><span class="tag">Por qué importa para el 2º parcial</span> eˣ y ln x reaparecen todo el tiempo: en los <b>órdenes de infinito</b> de los límites (eˣ ≫ xⁿ ≫ ln x) y en la <b>tabla de derivadas</b> ((eˣ)′=eˣ, (ln x)′=1/x). Si las domino ahora, el 2º parcial se hace mucho más liviano.</div>

    <h4>📐 Hoja de fórmulas — Unidad 4</h4>
    <div class="formula-grid">
      <div class="fbox"><div class="big">M = C·(1 + i)ⁿ</div><small>Interés compuesto</small></div>
      <div class="fbox"><div class="big">y = aˣ ⟺ x = log_a(y)</div><small>Exponencial ↔ logaritmo (inversas)</small></div>
      <div class="fbox"><div class="big">L(a·b)=L a+L b · L(a/b)=L a−L b · L(aⁿ)=n·L a</div><small>Propiedades del log (el curso escribe L = ln)</small></div>
      <div class="fbox"><div class="big">L(1)=0 · L(e)=1 · eᴸ⁽ˣ⁾=x</div><small>Valores y cancelación útiles</small></div>
    </div>

    <h4>Ejercicios resueltos de esta unidad (de fácil a difícil)</h4>
    <details class="ex" open><summary>① Básico · Simplificar con propiedades del logaritmo</summary>
      <div class="body">
        <p><b>Letra:</b> Escribí como un solo logaritmo: L(8) + L(3) − L(4). (Recordá: el curso usa L = ln.)</p>
        <ol class="steps">
          <li>Suma de logs = log del producto: L(8) + L(3) = L(8·3) = L(24).</li>
          <li>Resta de logs = log del cociente: L(24) − L(4) = L(24/4) = <b>L(6)</b>.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>② Básico · Interés compuesto</summary>
      <div class="body">
        <p><b>Letra:</b> Deposito $1000 al 5% anual durante 3 años (interés compuesto). ¿Cuánto tengo al final?</p>
        <ol class="steps">
          <li>M = C·(1+i)ⁿ con C=1000, i=0,05, n=3.</li>
          <li>M = 1000·(1,05)³ = 1000·1,157625 = <b>$1157,63</b> aprox.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>③ Medio · Despejar usando logaritmo</summary>
      <div class="body">
        <p><b>Letra:</b> Resolvé para x: e^(2x) = 7.</p>
        <ol class="steps">
          <li>Aplico L (logaritmo natural) a ambos lados: L(e^(2x)) = L(7).</li>
          <li>Como L y e se cancelan: 2x = L(7).</li>
          <li>x = <b>L(7)/2</b> ≈ 0,973.</li>
        </ol>
      </div>
    </details>
    <details class="ex"><summary>④ Aplicado · ¿En cuántos años se duplica?</summary>
      <div class="body">
        <p><b>Letra:</b> ¿En cuántos años se duplica un capital al 6% anual compuesto?</p>
        <ol class="steps">
          <li>Quiero M = 2C: 2C = C·(1,06)ⁿ → 2 = (1,06)ⁿ.</li>
          <li>Aplico L: L(2) = n·L(1,06) → n = L(2)/L(1,06).</li>
          <li>n = 0,693/0,0583 ≈ <b>11,9 años</b>.</li>
        </ol>
      </div>
    </details>
  </section>

  <!-- CHECKLIST -->

      <label><input type="checkbox" onchange="tick(this)"><span><b>U5</b> · Calculo límites levantando 0/0 (factorizo / Ruffini) y manejo los límites laterales y la asíntota vertical</span></label>
      <label><input type="checkbox" onchange="tick(this)"><span><b>U6</b> · Resuelvo ∞/∞ (mayor grado) y sé los órdenes de infinito (eˣ ≫ xⁿ ≫ L x) y la asíntota horizontal</span></label>
      <label><input type="checkbox" onchange="tick(this)"><span><b>U7</b> · Aplico las 3 condiciones de continuidad y los teoremas de Bolzano y Weierstrass</span></label>
      <label><input type="checkbox" onchange="tick(this)"><span><b>U8</b> · Me sé la tabla de derivadas y las reglas (producto, cociente, cadena) y calculo la recta tangente</span></label>
      <label><input type="checkbox" onchange="tick(this)"><span><b>U8</b> · Resuelvo la cadena compuesta F(x)=(f(x))ⁿ+f(xᵏ) y la tangente "al revés"</span></label>
      <label><input type="checkbox" onchange="tick(this)"><span><b>U9</b> · Estudio crecimiento con el signo de f ′ y clasifico máx/mín (relativos y absolutos en [a,b])</span></label>
