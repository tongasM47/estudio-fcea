  <!-- RECETAS -->
  <section class="sec" id="a-rec">
    <h3>Recetas de examen — tipos de ejercicio (revisiones 2022–2026)</h3>
    <p class="tagline">Saqué esto de las revisiones reales de los últimos años. Primero el formato, después qué cae siempre y la receta por tipo: cómo lo reconozco → cómo se responde → la trampa.</p>
    <div class="key"><span class="tag">★ Formato del examen (los dos parciales)</span> <b>No es múltiple opción ni V/F.</b> Es <b>desarrollo a partir de UN caso</b> (una empresa descrita en párrafos numerados) + un bloque <b>"SE PIDE"</b> con 7 a 12 preguntas, cada una con su <b>puntaje</b> y su <b>etiqueta de tema</b>. Casi todas dicen <b>"justifique con el texto"</b>: responder con pura teoría, sin anclar al caso, <b>no suma</b>. Truco habitual: meten una frase textual de un personaje y la pregunta gira sobre esa frase exacta.</div>
    <div class="key"><span class="tag">★ Regla de oro</span> Cada respuesta = <b>concepto/autor + cita o dato del texto que lo prueba</b>. La cátedra puntúa la justificación anclada al caso, no la teoría suelta.</div>

    <h4>1er Parcial · lo que SIEMPRE cae</h4>
    <table>
      <tr><th>Tema</th><th>Frecuencia</th><th>Estrella</th></tr>
      <tr><td>Dirección / Liderazgo</td><td>5/5</td><td><b>Grid de Blake y Mouton</b> (4 de 5 años) · Hersey-Blanchard · McClelland</td></tr>
      <tr><td>Control (4 etapas)</td><td>5/5</td><td>Las 4 etapas aplicadas a un dato del caso</td></tr>
      <tr><td>Organización</td><td>5/5</td><td>Dibujar/corregir organigrama + departamentalización</td></tr>
      <tr><td>Medio Ambiente</td><td>5/5</td><td>Factores directo/indirecto, interno/externo · visión periférica</td></tr>
      <tr><td>Administradores</td><td>4/5</td><td>Katz, Mintzberg, escuelas clásicas (Taylor/Fayol/Mayo/Weber)</td></tr>
      <tr><td>Planificación</td><td>4/5</td><td>FODA, redacción de objetivos, misión/visión</td></tr>
    </table>
    <h4>1er Parcial · recetas por tipo</h4>
    <table>
      <tr><th>Tipo · cómo lo reconozco</th><th>Cómo se resuelve</th><th>Trampa</th></tr>
      <tr><td><b>Grid de Blake y Mouton</b> — "¿qué estilo de liderazgo aplica X?"</td><td>Ubicar al personaje en los 2 ejes (interés por personas / por producción) y nombrar el estilo: (1,1) pobre, (1,9) club, (9,1) autoritario, (5,5) medio, <b>(9,9) equipo/ideal</b>. Citar la frase que prueba cada eje.</td><td>Quedarse en un solo eje. Si cuida clima Y resultados es 9,9, no club social.</td></tr>
      <tr><td><b>Hersey y Blanchard (situacional)</b> — compara dos subordinados</td><td>Según la <b>madurez del subordinado</b>: E1 dirigir, E2 persuadir, E3 participar, E4 delegar. Equipo experto → delegar; gente nueva → dirigir.</td><td>El estilo depende del SUBORDINADO, no del jefe. No confundir con Blake-Mouton.</td></tr>
      <tr><td><b>Proceso de control (4 etapas)</b> — te dan un estándar y un valor real</td><td>Desarrollar con los números del caso: 1) fijar estándar, 2) medir, 3) comparar/desvío, 4) acción correctiva. A veces piden el tipo: tiempo real = <b>concurrente</b>.</td><td>Quedarse en teoría sin los números. Confundir estándar (planeado) con medición (real).</td></tr>
      <tr><td><b>Organigrama</b> — "dibuje" o "encuentre los errores" + departamentalización</td><td>Respetar quién reporta a quién; <b>staff/asesoría con línea punteada</b> al costado. Criterios: funcional, geográfico, por producto, por cliente, por proceso.</td><td>Poner una asesoría como línea de mando. Confundir autoridad funcional con dependencia jerárquica.</td></tr>
      <tr><td><b>Medio Ambiente</b> — identificar y clasificar factores</td><td><b>Directo</b> = clientes, proveedores, competidores, reguladores, sindicatos. <b>Indirecto</b> = económico, político, social, tecnológico. <b>Interno</b> = empleados, cultura. Citar el texto.</td><td>La inflación/tipo de cambio es <b>indirecto</b> aunque "afecte mucho". Decir el factor sin clasificarlo.</td></tr>
      <tr><td><b>Katz / Mintzberg</b> — habilidades o roles de un personaje</td><td>Katz por nivel: alta dirección = conceptual, base = técnica, todos = humana. Mintzberg: mapear frases a roles (representa la empresa = enlace; media conflictos = gestor de conflictos; aprueba presupuesto = asignador de recursos).</td><td>Dar habilidad técnica a un gerente general (le toca conceptual). Nombrar el rol sin la frase que lo prueba.</td></tr>
      <tr><td><b>Escuelas clásicas</b> — "¿a qué autor corresponde cada medida?"</td><td><b>Taylor</b> = tiempos, eficiencia, premio por productividad individual. <b>Fayol</b> = principios (unidad de mando). <b>Mayo</b> = clima, metas grupales. <b>Weber</b> = burocracia, criterios objetivos, comunicación escrita.</td><td>"Premios por metas GRUPALES" es Mayo, no Taylor. "Comunicación por escrito" es Weber.</td></tr>
      <tr><td><b>FODA / objetivos cruzados</b> — matriz o "¿es FO/DO/FA/DA?"</td><td>F y D = internas; O y A = externas. FO ofensiva, DO adaptación, <b>FA defensiva</b>, DA supervivencia. (Ej.: enfrentar la crisis hídrica —amenaza— con buen mantenimiento —fortaleza— = FA.)</td><td>Poner una fortaleza interna en oportunidad. Confundir FA con DA: si lo que enfrenta la amenaza es una fortaleza, es FA.</td></tr>
      <tr><td><b>Redacción de objetivos</b> — "proponga / evalúe un objetivo"</td><td>Debe ser <b>específico, medible, alcanzable, con plazo y responsable</b>. "Validar 3 de 5 procedimientos para marzo 2024" (bien) vs. "terminar el testeo pronto" (mal).</td><td>Objetivo sin plazo ni métrica. No decir qué característica falla.</td></tr>
      <tr><td><b>Clasificación de organizaciones</b></td><td>Propiedad (privada/pública/mixta; cooperativa = de socios), adhesión, origen de productos, beneficiarios (Blau-Scott), rentabilidad (lucro / sin lucro).</td><td>En una cooperativa el beneficiario son los <b>socios</b> (mutualista), no es empresa de lucro común.</td></tr>
    </table>

    <h4>2º Parcial · lo que SIEMPRE cae</h4>
    <table>
      <tr><th>Tema</th><th>Frecuencia</th><th>Estrella</th></tr>
      <tr><td>Finanzas</td><td>4/4</td><td><b>Punto de equilibrio (cálculo)</b> · razón corriente e índice de solvencia · flujo de caja</td></tr>
      <tr><td>Comercialización</td><td>4/4</td><td>Mezcla comercial (4 P) · clasificación de productos · estrategias de precio</td></tr>
      <tr><td>Producción</td><td>4/4</td><td>Enfoques (costo/calidad/cliente) · capacidad · layout</td></tr>
      <tr><td>Crecimiento</td><td>4/4</td><td><b>Ansoff</b> (dirección) + forma (interno/externo)</td></tr>
      <tr><td>RRHH</td><td>4/4</td><td>Los 3 procesos · inducción · descripción/perfil de cargo · índice de rotación</td></tr>

    <h4>2º Parcial · recetas por tipo</h4>
    <table>
      <tr><th>Tipo · cómo lo reconozco</th><th>Cómo se resuelve</th><th>Trampa</th></tr>
      <tr><td><b>Punto de equilibrio</b> (el cálculo estrella) — "calcule el PE, muestre el desarrollo"</td><td><b>PE = Costos Fijos / (Precio unitario − Costo Variable unitario)</b>. Clasificar bien cada costo en fijo/variable y unificar períodos. Comparar con las ventas reales.</td><td>Clasificar mal los costos (la amortización es FIJA). No mostrar el desarrollo (lo piden). No mensualizar/anualizar parejo.</td></tr>
      <tr><td><b>Razón corriente e índice de solvencia</b></td><td><b>Razón corriente = Activo Corriente / Pasivo Corriente</b> (liquidez corto plazo, &gt;1 ok). <b>Solvencia = Activo total / Pasivo total</b> (&gt;1 sano). Interpretar la evolución.</td><td>Invertir el cociente (pasivo/activo). Confundir liquidez (corto plazo) con solvencia (total).</td></tr>
      <tr><td><b>Flujo de caja / decisión financiera</b></td><td>Flujo = saldo inicial + ingresos − egresos, arrastrando el saldo mes a mes. Decisiones: inversión, financiamiento, distribución.</td><td>Las obligaciones negociables son <b>financiamiento para el emisor</b> pero <b>inversión para el comprador</b> — ojo la perspectiva.</td></tr>
      <tr><td><b>Mezcla comercial (4 P)</b></td><td><b>Producto</b> (qué/marca/calidad), <b>Precio</b>, <b>Plaza</b> (canales), <b>Promoción</b> (publicidad). Pegar cada P a una frase del texto.</td><td>Listar las 4 P en abstracto. Confundir Plaza (canal) con Promoción.</td></tr>
      <tr><td><b>Clasificación de productos de consumo</b></td><td>Conveniencia (compra frecuente: leche, galletas), comparación, especialidad (lealtad), no buscados. Justificar con el hábito de compra.</td><td>Confundirla con la clasificación <b>técnica/de diseño</b> (estandarizado vs a pedido), que es otra pregunta.</td></tr>
      <tr><td><b>Estrategias de precio</b></td><td><b>Penetración</b> = precio bajo por volumen/participación. <b>Descremado</b> = precio alto al inicio. <b>Costo + margen (markup)</b>.</td><td>Confundir penetración (bajo) con descremado (alto).</td></tr>
      <tr><td><b>Crecimiento: Ansoff + forma</b> (suelen venir juntas)</td><td><b>Ansoff (dirección)</b>: penetración, desarrollo de mercado, desarrollo de producto, diversificación (nuevo+nuevo). <b>Forma</b>: interno (recursos propios) vs externo (fusión/adquisición).</td><td>Mezclar dirección con forma (son dos preguntas). Llamar "diversificación" a un mero desarrollo de producto.</td></tr>
      <tr><td><b>Producción</b> — enfoques / capacidad / layout / diseño</td><td>Enfoques: costo, calidad, cliente. Capacidad: cuánto puede producir. Layout: distribución de planta. Diseño técnico: en serie vs a medida.</td><td>Confundir clasificación por consumo con clasificación técnica. Mezclar capacidad con enfoque.</td></tr>
      <tr><td><b>RRHH</b> — 3 procesos / inducción / cargo / rotación</td><td><b>3 procesos</b>: provisión (reclutar+seleccionar), desarrollo (capacitar), mantenimiento. <b>Descripción de cargo</b> = tareas; <b>perfil</b> = requisitos de la persona. <b>Rotación</b> = renuncias/plantilla.</td><td>Creer que "mostrar el escritorio" es inducción completa (falta socialización: misión/visión/valores). Confundir descripción (puesto) con perfil (persona).</td></tr>
      <tr><td><b>Informática</b> — etapa / requisitos y riesgos / qué tecnología</td><td>Etapas: relevamiento → diseño → desarrollo → <b>testeo</b> → implementación. Requisitos: confiable, oportuno, íntegro, seguro. Si hay papeleo sin base única → recomendar <b>ERP</b>.</td><td>Dar requisitos sin riesgos cuando piden ambos. Errar la etapa (lo que recién se "plantea" está en relevamiento, no en testeo).</td></tr>
      <tr><td><b>Creación / emprendedor</b> — fuente de la idea / perfil / financiamiento</td><td>Fuente de la idea: necesidad del mercado, experiencia previa, hobby. Perfil: creatividad, orientación al mercado, tolerancia al riesgo. Financiamiento: ahorros, <b>ANDE</b>, FFF (familia/amigos).</td><td>Decir la fuente sin descartar las otras cuando lo piden. Enumerar el perfil sin anclar a frases del fundador.</td></tr>
    </table>
  </section>

function fcHTML(grupos){
  let html='';
  grupos.forEach(g=>{
    html+='<p style="color:var(--accent);font-weight:700;margin:16px 0 4px">'+g.t+'</p><div class="fc-grid">';
    g.fc.forEach(c=>{html+='<div class="fc" onclick="flip(this)"><div class="fc-in"><div class="fc-f">'+c.f+'<small>tocá</small></div><div class="fc-b">'+c.b+'</div></div></div>';});
    html+='</div>';
  });
  return html;
}

/* ===== Barajado universal de respuestas: cambian de lugar en cada carga ===== */
function shuffleQuizzes(){
  document.querySelectorAll('.q').forEach(function(q){
    var opts=Array.prototype.slice.call(q.querySelectorAll('.opt'));
    if(opts.length<2)return;
    var ref=q.querySelector('.fb');
    for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t;}
    opts.forEach(function(o){ q.insertBefore(o, ref); });
  });
}
shuffleQuizzes();
